on working. (in spite of this)\u000b→ Laura felt unwell. In spite of this, she went on working.","19. I told the children to be quiet. We heard noise. (because of)\u000b→ I told the children to be quiet because of the noise from upstairs.","20. It was raining. We delayed our trip. (despite)\u000b→ We delayed our trip despite the rain.","Rewrite the sentences, using the word in brackets.","1. \"Whatever\" – đại từ/ từ nối","✅ Nghĩa: \"bất cứ điều gì\", \"dù là cái gì đi nữa\"","🔹 Cấu trúc:","Whatever + S + V, clause","Hoặc trong câu danh từ: Whatever you do is fine","2. \"No matter + từ để hỏi\" (what, where, when, who, how, why…)","✅ Nghĩa: \"cho dù… thì vẫn…\", nhấn mạnh bất kể tình huống nào xảy ra thì kết quả không đổi","🔹 Cấu trúc:","No matter + wh-word + S + V, clause","—-----------------------------------------------------------------","1. They are rich, not happy. (no matter)\u000b→ No matter how rich they are, they aren’t happy.","2. I'd rather have a small room of my own. (however)\u000b→ I'd rather have a room of my own, however small it is.","3. He got good jobs, not satisfied. (no matter)\u000b→ No matter how good the jobs were, he was not satisfied.","4. Do any job, do it devotedly. (whatever)\u000b→ Whatever job you do, do it devotedly.  [một cách] tận tụy","5. Anyone with the most points wins. (whoever)\u000b→ Whoever gains the most points wins the competition.","6. He exercised, got fatter. (whatever)\u000b→ Whatever kinds of exercise he did, he got fatter.","7. Lived elsewhere, thought of homeland. (no matter)\u000b→ No matter where he lived, he always thought of his homeland.","8. The roof leaks ( bị dột ) when it rains. (whenever)\u000b→ My roof leaks whenever it rains.","9. He may say anything. Don't trust. (no matter)\u000b→ No matter what he says, don’t trust him.","10. Study hard. Encounter difficulties. (whatever)\u000b→ Study hard whatever difficulties you encounter.","11. Intelligent. Can't answer. (no matter)\u000b→ No matter how intelligent she is, she can’t answer my question.","12. Loves him. Behaved badly. (however)\u000b→ She still loved him, however badly he behaved.","13. Papers print nonsense. People believe. (whatever)\u000b→ Whatever nonsense the papers print, some people always believe it.","14. I'll find him. Wherever. (no matter)\u000b→ I’ll find him, no matter where he has gone.","15. Phone when you arrive. No matter late. (however)\u000b→ Phone me when you arrive, however late it is.","PHẦN 1: CHỌN TỪ/ CỤM TỪ PHÙ HỢP VÀO CHỖ TRỐNG","✅ Tổng kết mẹo ghi nhớ:","🔸 Mệnh đề chỉ mục đích:","so that + S + V (để mà...)","in order to / so as to + V-inf (để làm gì đó)","🔸 Mệnh đề chỉ nguyên nhân:"]},{"title":"Phần ôn tập 57 · Chủ đề du lịch → take off, check in, get on","items":["because / since / as + S + V","because of / due to / owing to + N / V-ing","🔸 So / Such:","so + adj/adv + that","such + (a/an) + adj + noun + that","🔸 Too / Enough:","too + adj + to V (quá đến mức không...)","adj + enough + to V (đủ để...)","Điền từ/cụm từ phù hợp để hoàn thành câu (5/5 điểm)","The government passed a law so that children could go to school for free. ✅","He ate a lot in order to gain weight. ✅","He’s going to the gym so that he can have abs. ✅","I always carry an umbrella in case of rain. ✅","They built a bridge for people to cross the river. ✅","PHẦN 2: CHỌN ĐÁP ÁN ĐÚNG","Chọn cụm từ phù hợp chỉ mục đích, nguyên nhân (4/5 điểm)","The city council installed solar panels on public buildings with a view to reduce their carbon footprint. ✅","I woke up early on the day of the festival in order not to miss the parade. ✅","They planted trees along the highway so as to prevent soil erosion. ✅","We brought raincoats in order not to get caught in the unexpected downpour. ✅","The company implemented new recycling policies with a view to protecting the environment. ✅","PHẦN 3: VIẾT LẠI CÂU SỬ DỤNG CẤU TRÚC CHO TRƯỚC","Viết lại câu sử dụng cấu trúc \"in order to\" hoặc \"so as to\" (0/4 điểm)","Botez eats a balanced diet to maintain good health and avoid nutritional deficiencies.\u000b ✅ Đáp án đúng:\u000b – Botez eats a balanced diet so as to maintain good health and avoid nutritional deficiencies.\u000b – Botez eats a balanced diet in order to maintain good health and avoid nutritional deficiencies.","Lilly avoids sugary drinks and processed foods because she wants to maintain a healthy weight and prevent chronic diseases.\u000b ✅ Đáp án đúng:\u000b – Lilly avoids sugary drinks and processed foods in order to maintain a healthy weight and prevent chronic diseases.\u000b – Lilly avoids sugary drinks and processed foods so as to maintain a healthy weight and prevent chronic diseases.","PHẦN 4: HOÀN THÀNH CÂU VỚI \"SO\" HOẶC \"SUCH\"","Chọn \"so\" hoặc \"such\" để hoàn thành câu (17/18 điểm)","I spend so much money that I can't save any. ✅","Jimmy and Ken are so alike that I can't tell one from another. ✅","Shames is such a nice dog that he never barks. ✅","Those are such great pictures that I never want to throw them away. ✅","I am so bored that I just want to sleep. ✅","Our neighbors are so kind that they let us borrow their lawn mower. ✅","My back aches so badly that I can't lift anything anymore. ✅","Hawaii has such amazing beaches that everyone wants to live there. ✅","PHẦN 5: CHỌN \"ENOUGH\" HOẶC \"TOO\"","Chọn từ phù hợp để hoàn thành câu (10/10 điểm)","The coffee is too hot to drink right now. ✅","She didn't have enough money to buy the concert tickets. ✅","The book was too difficult for me to understand. ✅","He's not tall enough to reach the top shelf. ✅","The suitcase was too heavy for her to carry. ✅","The movie was too scary for the young audience. ✅","The car was traveling too fast to stop in time. ✅","We didn't leave enough time to catch the bus. ✅","The cake was too sweet that I couldn't finish it. ✅","I don't think this box is big enough to hold all the items. ✅","PHẦN 6: HOÀN THÀNH ĐOẠN VĂN (SO / SUCH)","Điền từ vào chỗ trống trong đoạn văn (8/8 điểm)","Finland is (1) such a nice place to go on winter holidays. The winter there is (2) so mild and welcoming! You can do snowboarding, skating, skiing or any other winter sport, there are (3) so many possibilities. We found (4) such a lovely hotel, and it was (5) such a short walk to the skiing slope. Well, winter season in Finland is not (6) so cheap as we expected, but we had (7) such a great time there. It is (8) so tempting to come there every winter, again and again. ✅","PHẦN 7: THÊM CỤM TỪ HOẶC MỆNH ĐỀ CHỈ MỤC ĐÍCH / NGUYÊN NHÂN","Chọn cụm từ phù hợp: because, because of, due to, owing to, since, as, etc. (5/6 điểm)","She found the exam easy because she had worked hard during the course. ✅","It was all because of her that we got into trouble. ✅","I am late because of the traffic. ✅","We had to hurry indoors because it was raining. ✅","We didn't arrive until seven o'clock because the traffic was terrible. ✅","We stopped playing tennis because of the rain. ✅","1. Do you like traveling?","Outline:","Express Preference: Start with whether you like it or not.","Reason: Explain why you enjoy (or don’t enjoy) traveling.","Examples: Mention specific trips or experiences that made you feel this way.","Example: \"I absolutely love traveling! It’s one of my favorite things to do because it allows me to step out of my daily routine and experience new places and cultures. Traveling helps me relax and opens my mind to different ways of living, which I find fascinating.\"","Thanh Tam: Yes, I love traveling, it allows me to broaden my horizon  experience and my mind, it helps me explore new places and learn about regional culture more. Last year, one of my favorite tríps was to Da Lat, a beautiful city in the mountains of VietNam. I really loved the fresh air, the peaceful scenery . Especially,","2. How often do you travel and why?","Outline:",": Mention how often you travel (e.g., once a year, every few months).","Purpose: Explain reasons for your travel frequency (e.g., work, family, leisure).","Example: Describe a typical trip to illustrate."]},{"title":"Phần ôn tập 58 · Chủ đề du lịch → take off, check in, get on","items":["Example: \"I try to travel at least twice a year if I can, usually during my holiday breaks. Traveling is something I prioritize because it recharges me, and I find that exploring new places helps me become more creative and open-minded.”","3. When do you usually travel?","Outline:","Time: Specify when you prefer to travel (e.g., summer, winter, during holidays).","Reasons: Explain why this time is preferable (e.g., weather, vacation time).","Example: ”I usually travel during the summer because it’s when I have the longest break from work and school, and I can spend more time exploring. The weather is also usually warm and sunny, which is perfect for outdoor activities.","Thanh Tâm: Honestly, as a full-time worker , i  travel when I have both money and free time. Usually, that’s during  public holidays or when i can take a few days off from work. Long weekends or special occasions like Tet are perfect for long travel. I believe travelling at these times of the year is a great way to relax and reward myself after working hard.","4. What kind of places are you more interested in and why?","Outline:","Preference: Describe the type of places (e.g., beaches, mountains, historical cities).","Reasons: Explain why you prefer these places.","Example: \"I’m particularly interested in historical places because I love learning about the past and seeing how people lived hundreds or even thousands of years ago. For example, I’m fascinated by places like Rome with its ancient ruins, or Egypt with the pyramids. I find that visiting such places makes history come alive, and I leave with a deeper appreciation for human achievements.\"","Thanh Tâm: I’m more interested in visiting places surrounded by nature, such as mountains or beaches. I enjoy these scenic spots because they offer a peaceful atmosphere where I can unwind after a busy period of work . For example, last year i went to Da Lat, a city famous for beautiful pine forests and cool climate. Being there helped me escape from my daily routine and recharge my energy. Besides relaxation, I also love exploring local culture and traditions, which makes traveling more meaningful. Overall, natural destinations give me both peace of mind and memorable experiences.","6. What do you normally do when you are in a new place?","Outline:","Routine: Describe typical activities you do (e.g., sightseeing, tasting local food).","Purpose: Explain why these activities are meaningful to you.","Example: \"When I’m in a new place, I always make it a point to explore local food. I think food is a big part of experiencing a new culture, so I visit local restaurants or street food markets. I also like to walk around neighborhoods, take photos, and talk to locals if I get a chance. It gives me a deeper sense of what life is like in that place beyond just being a tourist.\"","When I visit a new place, I usually spend time exploring the area. I love trying local food because it’s a fun way to experience the culture. I also enjoy sightseeing and walking around to take pictures or simply enjoy the cold and fresh air,   . For example, when I went to Da Lat, I visited the night market, tried bánh tráng nướng, and took a relaxing walk around Xuan Huong Lake. It was really peaceful and memorable.","7. Which do you prefer: traveling by yourself or with friends, and why?","Outline:","Preference: State whether you prefer solo travel or traveling with friends.","Advantages: Describe the benefits of your preference.","Example: \"\"I prefer traveling with friends because it makes the experience more enjoyable and memorable. Having friends around means we can share the excitement, and there’s always someone to talk to or take photos with. For example, on a recent trip to Vietnam, I went with my best friends, and we had a blast exploring cities, trying street food, and even getting lost together. Those are memories I’ll cherish forever.\"","I prefer traveling with friends because it’s more fun and I don’t feel lonely. We can share experiences, take photos of each other, and split the cost of food and hotels. It also feels safer when you’re not alone. For example, when I traveled to Nha Trang with my friends, we went to the beach together, ate delicious seafood, and laughed a lot. I think good company makes any trip more special. Those are memories I’ll cherish forever","Slide:","Link to hw1","Present conti: be+Ving  ->      am/is/are   being V3/ed","Passive: be + V3/ed","I am riding a bike. -> a bike am is are being ridden by me.","Past continuous passive : was/were+be-ing V3/ed","->","Present perfect: have/has + V3/ed","Passive: be + V3/ed","->   have/has +   been +  V3/ed","had","Future simple: will + V","-> future simple passive:    will + be + V3/ed","Near future: am/is/are + going to + V","-> N.F. passive:   am/is/are going to + be V3/ed","S + can/should + V ->","I. Put the verbs into the most suitable passive form.","There's someone behind us. I think we _____are being followed________ (follow).","A mystery is something that _______can’t be explained______ (can’t explain).","We didn’t play football yesterday. The match was cancelled_____________ (cancel).","The television ________has been repaired_____ (repair). It’s working again now.","The church tower ______is being restored_______ (restore). The work is almost finished.","\"How old is the tower?\" \"It ______is believed_______ (believe) to be over 600 years old.\"","If I didn’t do my job properly, I ______would be sacked_______ (would/ sack).","A: I left some papers on the desk last night, and I can’t find them now.\u000bB: They _____might be thrown away________ (might/ throw away).","I learned to swim when I was very young. I _______was taught ______ (teach) by my mother.","After _________being arrested____ (arrest), I was taken to the police station.","This road ______is being repaired_______ (repair), so we have to take another road.","Two people ____were reported_________ (report) to _____________ (injure) in an explosion at a factory early this morning.","I haven’t received the letter. It ______might be sent_______ (might/ send) to the wrong address.","The vegetables didn’t taste very good. They ______had been cooked_______ (cook) for too long.","The examination papers are scored by machine. The students ______will be tell_______ (tell) their results next week.","II. Use the words in the box to complete these passive sentences. Use any appropriate tense.","cause | blow | hold | collect | invite | not steal | show | translate | write | invent | spell | surround | build | report | murder","An island ______is surrounded_______ by water.","I was _____invited________ to the wedding, but I couldn’t come.","Many accidents _______are caused______ by reckless driving.","A new dormitory _____is being built________ in the campus at present.","A lot of the trees _____were blown________ down in a storm a few days ago.","Some politicians ____have been murdered_________ by terrorist recently.","The concert ______will be held_______ at the university next Sunday.","This money box _____has been collected________ for five years.","The electric light bulb _____was invented________ by Thomas Edison.","The -ing form of ‘sit’ ____is spelled_________ with a double t.","The accident _______was reported______ in the newspaper yesterday."]},{"title":"Phần ôn tập 59 · Chủ đề du lịch → take off, check in, get on","items":["Mickey Mouse cartoons _____have been translated________ into sixty languages.","The election results ______will be shown_______ on television at the end of this month.","This program ______was written_______ by students at Stanford University.","Thank goodness! My jewellery _____was not stolen________ in the robbery last night.","III. Change active to passive, paying close attention to special structures.","Parents always give me proper encouragement.","I am always given proper encouragement by my parents.","Proper encouragement is always given to me by my parents.","I remember someone giving me a toy drum on my fifth birthday.","I remember being given a toy drum on my fifth birthday.","Someone saw him pick up the gun.","I remember being given a toy drum on my fifth birthday.","They asked me some difficult questions at the interview.","I was asked some difficult questions at the interview.","Some difficult questions were asked to me at the interview.","Don’t touch this switch.","This switch must not be touched.","He won’t let you do that silly thing again.","You won’t be allowed to do that silly thing again (by him).","The real estate office will send you a copy of the sales contract.","You will be sent a copy of the sales contract by the real estate office.","A copy of the sales contract will be sent to you by the real estate office.","I didn’t expect the police to find my car.","I didn’t expect my car to be found by the police.","I rarely hear her call her children bad names.","Her children are rarely heard being called bad names by her.","Someone seems to have made a terrible mistake.","A terrible mistake seems to have been made.","I think they should have offered Tom the job.","I think Tom should have been offered the job.","People say that Arthur robbed a bank a long time ago.","It is said that Arthur robbed a bank a long time ago.","Arthur is said to have robbed a bank a long time ago.","They used to make little boys climb the chimneys to clean them.","Little boys used to be made to climb the chimneys to clean them.","They suggested banning the sale of alcohol at football matches.","It was suggested that the sale of alcohol should be banned at football matches.","Banning the sale of alcohol at football matches was suggested.","Take off your coat.","Let your coat be taken off. (ít dùng)","You are requested to take off your coat. (tự nhiên hơn)","They have sent that money to the poor families.","That money has been sent to the poor families.","He recommended using bullet-proof glass.","Using bullet-proof glass was recommended by him.","It was recommended that bullet-proof glass should be used.","She loves someone praising her all the time.","She loves being praised all the time.","We believe that he has special knowledge which may be useful to the police.","He is believed to have special knowledge which may be useful to the police.","You need to have your hair cut.","Your hair needs to be cut.","IV. Put these sentences into the passive voice","Should they help Jane with the sewing?","Should Jane be helped with the sewing (by them)?","The mechanic is repairing Judy’s car.","Judy’s car is being repaired by the mechanic.","Must we finish the test before ten?","Must the test be finished before ten (by us)?","They use a computer to do that job nowadays.","A computer is used to do that job nowadays.","Employers must pay all travel expenses for this training course.","All travel expenses for this training course must be paid by employers.","Did her story take them in? (“Take in” = lừa gạt)","Were they taken in by her story?","The bank manager kept me waiting for half an hour.","I was kept waiting for half an hour by the bank manager.\u000b (“Keep sb doing sth” → chỉ phần đầu chuyển bị động)","Has he spelt this word wrongly?","Has this word been spelt wrongly (by him)?","All his friends will see him off at the airport."]},{"title":"Phần ôn tập 60 · Chủ đề du lịch → take off, check in, get on","items":["He will be seen off at the airport by all his friends.","They used to drink beer for breakfast in England years ago.","Beer used to be drunk for breakfast in England years ago.","Someone might have sent the letter to the wrong address.","The letter might have been sent to the wrong address (by someone).","They were cleaning the floor when I arrived.","The floor was being cleaned when I arrived.","They are digging the hole on the wrong side of the road.","The hole is being dug on the wrong side of the road.","They are going to steal your money if you’re not careful.","Your money is going to be stolen if you’re not careful.","Has anyone ever asked you for your opinion?","Have you ever been asked for your opinion (by anyone)?","Alan’s knowledge of art doesn’t impress me.","I am not impressed by Alan’s knowledge of art.","How do people make candles?","How are candles made (by people)?","They can’t make tea with cold water.","Tea can’t be made with cold water.","When is someone going to announce the results of the contest?","When are the results of the contest going to be announced?","Nobody informed the police that there had been a mistake.","The police were not informed that there had been a mistake.","Where will your company send you next year?","Where will you be sent by your company next year?","Who looked after the children when you were away?","Who were the children looked after when you were away?","Look! Someone is feeding the seals.","Look! The seals are being fed.","Kathy had returned the book to the library.","The book had been returned to the library by Kathy.","By this time tomorrow, the president will have made the announcement.","By this time tomorrow, the announcement will have been made by the president.","The pollution in the city was affecting people’s breathing.","People’s breathing was being affected by the pollution in the city.","Mrs. Andrews hasn’t signed those papers yet. Has Mr. Andrews signed them yet?","Those papers haven’t been signed by Mrs. Andrews yet.","Have they been signed by Mr. Andrews yet?","Is a student pilot flying that airplane?","Is that airplane being flown by a student pilot?","Where did they hold the 1988 Olympic Games?","Where were the 1988 Olympic Games held?","Do they make those tractors in this country, or do they import them?","Are those tractors made in this country, or are they imported?","IV. Change active to passive, paying close attention to special structures.","Parents always give me proper encouragement.","I was given proper encouragement by my parents.","Proper encouragement was given to me by my parents.","I remember someone giving me a toy drum on my fifth birthday.\u000b → I remember being given a toy drum on my fifth birthday.\u000b → A toy drum was given to me on my fifth birthday, I remember.","Someone saw him pick up the gun.\u000b → He was seen to pick up the gun.\u000b → The gun was seen to be picked up by him.","They asked me some difficult questions at the interview.\u000b → I was asked some difficult questions at the interview.\u000b → Some difficult questions were asked to me at the interview.","Don’t touch this switch.\u000b → This switch must not be touched.\u000b → You are not allowed to touch this switch.","He won’t let you do that silly thing again.\u000b → You won’t be allowed to do that silly thing again (by him).\u000b → That silly thing won’t be allowed to be done by you again (by him).","The real estate office will send you a copy of the sales contract.\u000b → You will be sent a copy of the sales contract by the real estate office.\u000b → A copy of the sales contract will be sent to you by the real estate office.","I didn’t expect the police to find my car.\u000b → I didn’t expect my car to be found by the police.\u000b → My car was not expected to be found by the police.","I rarely hear her call her children bad names.\u000b → Her children are rarely heard (by me) being called bad names by her.\u000b → She is rarely heard calling her children bad names (by me).","Someone seems to have made a terrible mistake.\u000b → A terrible mistake seems to have been made.\u000b → It seems that a terrible mistake has been made.","I think they should have offered Tom the job.\u000b → I think Tom should have been offered the job.\u000b → The job should have been offered to Tom, I think.","People say that Arthur robbed a bank a long time ago.\u000b → It is said that Arthur robbed a bank a long time ago.\u000b → Arthur is said to have robbed a bank a long time ago.","They used to make little boys climb the chimneys to clean them.\u000b → Little boys used to be made to climb the chimneys to clean them.\u000b → The chimneys used to be cleaned by making little boys climb them.","They suggested banning the sale of alcohol at football matches.\u000b → It was suggested that the sale of alcohol (should be) banned at football matches.\u000b → The banning of the sale of alcohol at football matches was suggested.","Take off your coat.\u000b → Let your coat be taken off.\u000b → You are asked to take off your coat.","They have sent that money to the poor families.\u000b → That money has been sent to the poor families.\u000b → The poor families have been sent that money.","He recommended using bullet-proof glass.\u000b → The use of bullet-proof glass was recommended (by him).\u000b → It was recommended that bullet-proof glass be used.","She loves someone praising her all the time.\u000b → She loves being praised all the time.\u000b → Being praised all the time is what she loves.","We believe that he has special knowledge which may be useful to the police.\u000b → It is believed that he has special knowledge which may be useful to the police.\u000b → He is believed to have special knowledge which may be useful to the police.","You need to have your hair cut.\u000b → Your hair needs to be cut.\u000b → It is necessary for your hair to be cut.","Passive voice 1","Tổng điểm19/24","B1: Xác định vị trí S, V, O"]},{"title":"Phần ôn tập 61 · Chủ đề du lịch → take off, check in, get on","items":["B2: Xác định thì trong câu","B3: Chuyển về bị động","The waiter    brings   me   this dish.","- I am brought this dish by the waiter","- This dish is brought to me by the waiter","✅ Exercise 1: Cho dạng đúng của từ trong ngoặc (9/10 điểm)","The war will be declared next week. (DECLARE) ✅","Your homework must be finished by tomorrow afternoon. (MUST FINISH) ✅","That house hasn’t been painted since I was a child. (NOT PAINT) ✅","Smoking isn’t allowed in this hotel. (NOT ALLOW) ✅","After all the flights had been cancelled, the tourists checked in at the airport hotel. (CANCEL) ❌ → Bạn chọn sai, đúng là: had been cancelled","The car hasn’t been washed for over a week. (NOT WASH) ✅","He was given a new contract last year. (GIVE) ✅","This song was written by the Beatles in 1967. (WRITE) ✅","The earth can be saved if we try hard enough to do something. (CAN SAVE) ✅","The new bridge is being built at the moment. (BUILD) ✅","✅ Exercise 2: Chia đúng động từ (chủ động hoặc bị động) (7/10 điểm)","Đề bài: The first diagram (1) ___ the process of cement manufacture, and the second diagram (2) ___ the materials that go into the production of concrete.","It is clear that there are five stages in the production of cement, beginning with the input of raw materials and ending with bags of the finished product. To produce concrete, four different materials (3) ___ together.","At the first stage in the production of cement, limestone and clay (4) ___ to form a powder. This powder (5) ___ before it passes into a rotating heater. After heating, the resulting mixture (6) ___, and cement (7) ___. Finally, the cement (8) ___ in large bags.","Cement is one of the four raw materials that (9) ___ in the production of concrete, along with gravel, sand and water. To be exact, concrete (10) ___ of 50% gravel, 25% sand, 15% cement and 10% water. All four materials are blended together in a rotating machine called a concrete mixer.","Câu","Đáp án đúng","Trạng thái","(1)","illustrates","✅","(2)","shows","✅","(3)","are mixed","✅","(4)","are crushed","✅","(5)","❌ is then mixed (Bạn chọn sai: “then is mixed” → sai trật tự trạng từ)","(6)","is ground","✅","(7)","is produced","✅","(8)","is packaged","✅","(9)","❌ are used (Đáp án đúng: is used → chủ ngữ “Cement” số ít)","(10)","consists","✅","✅ Exercise 4: Chuyển sang thể bị động (3/4 điểm)","These postcards are sent to us by our friends. ✅\u000b (Chủ động: Our friends send these postcards to us.)","This train ticket was ordered for his mother by Tim. ✅\u000b (Chủ động: Tim ordered this train ticket for his mother.)","❌ Her ticket was showed to the airline agent.\u000b → Đáp án đúng: Her ticket was shown to the airline agent. (show → showed → shown ở thể bị động)","This story was told to them by their grandmother when they visited her last week. ✅\u000b (Chủ động: Their grandmother told them this story when they visited her last week.)","📝 Ghi chú:","Động từ \"show\" ở thể bị động phải dùng quá khứ phân từ \"shown\", không phải \"showed\".","Cần lưu ý thứ tự trạng từ, ví dụ \"then is mixed\" → đúng phải là \"is then mixed\".","Một số danh từ như \"cement\" là không đếm được/số ít, nên động từ đi kèm là \"is\", không phải \"are\".","Slide:","Link to hw2","Useful Sentence Structures","I enjoy (hobby/noun phrase) because (clause of reason).","Example: I enjoy reading because it makes me relaxed.","I love to (verb phrase) because it's so (adjective).","Example: I love to work in the garden because it's so peaceful.","(Hobby/noun phrase) is my favourite hobby because (clause of reason).","Example: Cooking is my favourite hobby because I also love eating."]},{"title":"Phần ôn tập 62 · Chủ đề du lịch → take off, check in, get on","items":["Whenever I am (present participle), I feel (adjective).","Example: Whenever I am dancing, I feel so happy.","I started (gerund phrase) at the age of (number) when I was (with somebody/prepositional phrase).","Example: I started collecting stamps at the age of seven when I was with my grandma.","I think I’d rather (bare infinitive).","Example: I think I’d rather have a hobby that is active rather than passive.","1. Common Collocations with “Hobbies” (Cụm từ thông dụng với \"Hobbies\")","Take up a hobby – start a new hobby (Bắt đầu một sở thích mới)","Example: “I decided to take up photography as a hobby.”\u000b(Tôi quyết định bắt đầu nhiếp ảnh như một sở thích.)","Pursue a hobby – continue engaging in a hobby (Theo đuổi một sở thích)","Example: “He pursues his hobby of painting with great passion.”\u000b(Anh ấy theo đuổi sở thích vẽ với niềm đam mê mãnh liệt.)","Develop a passion for – grow to enjoy something deeply (Phát triển niềm đam mê với điều gì đó)","Example: “Over time, I developed a passion for playing the guitar.”\u000b(Qua thời gian, tôi phát triển niềm đam mê chơi guitar.)","Engage in a hobby – participate actively in a hobby (Tham gia tích cực vào một sở thích)","Example: “Many people engage in hobbies to unwind after a long day.”\u000b(Nhiều người tham gia vào sở thích để thư giãn sau một ngày dài.)","Dedicate time to a hobby – allocate time specifically for a hobby (Dành thời gian cho một sở thích)","Example: “I try to dedicate at least two hours a week to my hobby.”\u000b(Tôi cố gắng dành ít nhất hai giờ mỗi tuần cho sở thích của mình.)","Be an avid (reader/collector/etc.) – very enthusiastic about a specific hobby (Rất nhiệt tình hoặc đam mê một sở thích cụ thể)","Example: “She’s an avid reader and spends hours lost in books.”\u000b(Cô ấy là một người đọc say mê và dành hàng giờ để đắm chìm trong sách.)","Get involved in – participate in an activity or hobby (Tham gia vào một hoạt động hoặc sở thích)","Example: “I got involved in hiking a few years ago and have loved it ever since.”\u000b(Tôi đã tham gia leo núi vài năm trước và rất yêu thích từ đó đến nay.)","Find (something) relaxing/enjoyable – feel relaxed or happy when doing a hobby (Thấy điều gì đó thư giãn hoặc thú vị)","Example: “I find gardening incredibly relaxing.”\u000b(Tôi thấy làm vườn vô cùng thư giãn.)","2. Hobby-Related Vocabulary (Từ vựng liên quan đến sở thích)","Creative outlet – an activity that allows for creativity and self-expression (Hoạt động cho phép sáng tạo và thể hiện bản thân)","Example: “Painting provides a creative outlet for me to express my feelings.”\u000b(Vẽ tranh mang lại cho tôi một phương tiện sáng tạo để thể hiện cảm xúc.)","Pastime – a leisure activity done regularly (Hoạt động giải trí thường xuyên)","Example: “Reading is a favorite pastime for many people.”\u000b(Đọc sách là một hoạt động giải trí yêu thích của nhiều người.)","Therapeutic – providing relaxation or stress relief (Mang lại sự thư giãn hoặc giảm căng thẳng)","Example: “Gardening is therapeutic, helping me relieve stress.”\u000b(Làm vườn có tính chữa lành, giúp tôi giảm căng thẳng.)","Rewarding – giving satisfaction or benefit (Mang lại sự hài lòng hoặc lợi ích)","Example: “Playing the piano is rewarding, especially when I learn a new piece.”\u000b(Chơi piano rất bổ ích, đặc biệt khi tôi học một bản nhạc mới.)","Hands-on activity – a practical activity involving active participation (Hoạt động thực hành yêu cầu tham gia tích cực)","Get a sense of accomplishment – feel proud of completing something (Có cảm giác thành tựu)","Social interaction – engaging with others socially (Tương tác xã hội)","Leisure pursuit – a formal way to refer to a hobby or recreational activity (Cách nói trang trọng về sở thích hoặc hoạt động giải trí)","3. Adjectives for Describing Hobbies (Tính từ mô tả sở thích)","Relaxing – calming and soothing (Thư giãn)","Example: “Knitting is a relaxing activity I enjoy in my free time.”\u000b(Đan len là một hoạt động thư giãn mà tôi yêu thích trong thời gian rảnh.)","Challenging – requiring effort and skill (Đòi hỏi sự nỗ lực và kỹ năng)","Example: “Learning a musical instrument can be challenging but worthwhile.”\u000b(Học một nhạc cụ có thể thử thách nhưng rất đáng giá.)","Stimulating – mentally engaging and exciting (Kích thích trí não và thú vị)","Example: “Chess is a stimulating game that requires strategic thinking.”\u000b(Cờ vua là một trò chơi kích thích yêu cầu tư duy chiến lược.)","Time-consuming – requiring a lot of time to complete (Tốn nhiều thời gian)","Example: “Oil painting is quite time-consuming, but the results are satisfying.”\u000b(Vẽ tranh sơn dầu khá tốn thời gian, nhưng kết quả rất hài lòng.)","Engrossing – very interesting, absorbing full attention (Rất thú vị, thu hút hoàn toàn sự chú ý)","Example: “Reading mystery novels can be engrossing, especially when they’re well-written.”\u000b(Đọc tiểu thuyết trinh thám có thể rất cuốn hút, đặc biệt khi được viết hay.)","Rewarding – providing satisfaction or benefits (Mang lại sự hài lòng hoặc lợi ích)","Example: “Teaching yourself to cook is a rewarding hobby.”\u000b(Tự học nấu ăn là một sở thích đáng giá.)","4. Phrasal Verbs Related to Hobbies (Cụm động từ liên quan đến sở thích)","Get into (something) – start becoming interested in (Bắt đầu quan tâm đến điều gì đó)","Example: “I recently got into gardening, and now I spend hours working on it.”\u000b(Gần đây tôi bắt đầu thích làm vườn và giờ tôi dành hàng giờ để làm việc này.)","Pick up (a hobby) – learn or start a new hobby (Bắt đầu hoặc học một sở thích mới)","Example: “She picked up painting during the lockdown and has been improving ever since.”\u000b(Cô ấy bắt đầu học vẽ trong thời gian giãn cách và đã tiến bộ rất nhiều từ đó.)","Wind down – relax after a busy day (Thư giãn sau một ngày bận rộn)","Example: “Reading a book helps me wind down in the evening.”\u000b(Đọc sách giúp tôi thư giãn vào buổi tối.)","Catch up on – do something you’ve missed out on (Làm điều gì đó mà bạn đã bỏ lỡ)","Example: “On weekends, I like to catch up on my favorite shows.”\u000b(Vào cuối tuần, tôi thích xem lại các chương trình yêu thích của mình.)","Làm nốt bài tập Passive Voice 1 & 2 nha","Link:","https://forms.gle/x4q597sHWk2QDGoz5","https://forms.gle/bsgzcGH7yi6kKZCk8","Where will your company send you next year?","Where will you be sent by your company next year?","Who looked after the children when you were away?","Who were the children looked after when you were away?","Look! Someone is feeding the seals.","Look! The seals are being fed.","Kathy had returned the book to the library.","The book had been returned to the library by Kathy."]},{"title":"Phần ôn tập 63 · Chủ đề du lịch → take off, check in, get on","items":["By this time tomorrow, the president will have made the announcement.","By this time tomorrow, the announcement will have been made by the president.","The pollution in the city was affecting people’s breathing.","People’s breathing was being affected by the pollution in the city.","Mrs. Andrews hasn’t signed those papers yet. Has Mr. Andrews signed them yet?","Those papers haven’t been signed by Mrs. Andrews yet.","Have they been signed by Mr. Andrews yet?","Is a student pilot flying that airplane?","Is that airplane being flown by a student pilot?","Where did they hold the 1988 Olympic Games?","Where were the 1988 Olympic Games held?","Do they make those tractors in this country, or do they import them?","Are those tractors made in this country, or are they imported?","IV. Change active to passive, paying close attention to special structures.","Parents always give me proper encouragement.","I was given proper encouragement by my parents.","Proper encouragement was given to me by my parents.","I remember someone giving me a toy drum on my fifth birthday.\u000b → I remember being given a toy drum on my fifth birthday.\u000b → A toy drum was given to me on my fifth birthday, I remember.","Someone saw him pick up the gun.\u000b → He was seen to pick up the gun.\u000b → The gun was seen to be picked up by him.","They asked me some difficult questions at the interview.\u000b → I was asked some difficult questions at the interview.\u000b → Some difficult questions were asked to me at the interview.","Don’t touch this switch.\u000b → This switch must not be touched.\u000b → You are not allowed to touch this switch.","He won’t let you do that silly thing again.\u000b → You won’t be allowed to do that silly thing again (by him).\u000b → That silly thing won’t be allowed to be done by you again (by him).","The real estate office will send you a copy of the sales contract.\u000b → You will be sent a copy of the sales contract by the real estate office.\u000b → A copy of the sales contract will be sent to you by the real estate office.","I didn’t expect the police to find my car.\u000b → I didn’t expect my car to be found by the police.\u000b → My car was not expected to be found by the police.","I rarely hear her call her children bad names.\u000b → Her children are rarely heard (by me) being called bad names by her.\u000b → She is rarely heard calling her children bad names (by me).","Someone seems to have made a terrible mistake.\u000b → A terrible mistake seems to have been made.\u000b → It seems that a terrible mistake has been made.","I think they should have offered Tom the job.\u000b → I think Tom should have been offered the job.\u000b → The job should have been offered to Tom, I think.","People say that Arthur robbed a bank a long time ago.\u000b → It is said that Arthur robbed a bank a long time ago.\u000b → Arthur is said to have robbed a bank a long time ago.","They used to make little boys climb the chimneys to clean them.\u000b → Little boys used to be made to climb the chimneys to clean them.\u000b → The chimneys used to be cleaned by making little boys climb them.","They suggested banning the sale of alcohol at football matches.\u000b → It was suggested that the sale of alcohol (should be) banned at football matches.\u000b → The banning of the sale of alcohol at football matches was suggested.","Take off your coat.\u000b → Let your coat be taken off.\u000b → You are asked to take off your coat.","They have sent that money to the poor families.\u000b → That money has been sent to the poor families.\u000b → The poor families have been sent that money.","He recommended using bullet-proof glass.\u000b → The use of bullet-proof glass was recommended (by him).\u000b → It was recommended that bullet-proof glass be used.","She loves someone praising her all the time.\u000b → She loves being praised all the time.\u000b → Being praised all the time is what she loves.","We believe that he has special knowledge which may be useful to the police.\u000b → It is believed that he has special knowledge which may be useful to the police.\u000b → He is believed to have special knowledge which may be useful to the police.","You need to have your hair cut.\u000b → Your hair needs to be cut.\u000b → It is necessary for your hair to be cut.","Useful Sentence Structures","I enjoy (hobby/noun phrase) because (clause of reason).","Example: I enjoy reading because it makes me relaxed.","I love to (verb phrase) because it's so (adjective).","Example: I love to work in the garden because it's so peaceful.","(Hobby/noun phrase) is my favourite hobby because (clause of reason).","Example: Cooking is my favourite hobby because I also love eating.","Whenever I am (present participle), I feel (adjective).","Example: Whenever I am dancing, I feel so happy.","I started (gerund phrase) at the age of (number) when I was (with somebody/prepositional phrase).","Example: I started collecting stamps at the age of seven when I was with my grandma.","I think I’d rather (bare infinitive).","Example: I think I’d rather have a hobby that is active rather than passive.","1. Common Collocations with “Hobbies” (Cụm từ thông dụng với \"Hobbies\")","Take up a hobby – start a new hobby (Bắt đầu một sở thích mới)","Example: “I decided to take up photography as a hobby.”\u000b(Tôi quyết định bắt đầu nhiếp ảnh như một sở thích.)","Pursue a hobby of + Nound– continue engaging in a hobby (Theo đuổi một sở thích)","Example: “He pursues his hobby of painting with great passion.”\u000b(Anh ấy theo đuổi sở thích vẽ với niềm đam mê mãnh liệt.)","Develop a passion for – grow to enjoy something deeply (Phát triển niềm đam mê với điều gì đó)","Example: “Over time, I developed a passion for playing the guitar.”\u000b(Qua thời gian, tôi phát triển niềm đam mê chơi guitar.)","Engage in a hobby – participate actively in a hobby (Tham gia tích cực vào một sở thích)","Example: “Many people engage in hobbies to unwind after a long day.”\u000b(Nhiều người tham gia vào sở thích để thư giãn sau một ngày dài.)","Dedicate time to a hobby – allocate time specifically for a hobby (Dành thời gian cho một sở thích)","Example: “I try to dedicate at least two hours a week to my hobby.”\u000b(Tôi cố gắng dành ít nhất hai giờ mỗi tuần cho sở thích của mình.)","Be an avid (reader/collector/etc.) – very enthusiastic about a specific hobby (Rất nhiệt tình hoặc đam mê một sở thích cụ thể)","Example: “She’s an avid reader and spends hours lost in books.”\u000b(Cô ấy là một người đọc say mê và dành hàng giờ để đắm chìm trong sách.)","Get involved in – participate in an activity or hobby (Tham gia vào một hoạt động hoặc sở thích)","Example: “I got involved in hiking a few years ago and have loved it ever since.”\u000b(Tôi đã tham gia leo núi vài năm trước và rất yêu thích từ đó đến nay.)","Find (something) relaxing/enjoyable – feel relaxed or happy when doing a hobby (Thấy điều gì đó thư giãn hoặc thú vị)","Example: “I find gardening incredibly relaxing.”\u000b(Tôi thấy làm vườn vô cùng thư giãn.)","2. Hobby-Related Vocabulary (Từ vựng liên quan đến sở thích)","Creative outlet – an activity that allows for creativity and self-expression (Hoạt động cho phép sáng tạo và thể hiện bản thân)","Example: “Painting provides a creative outlet for me to express my feelings.”\u000b(Vẽ tranh mang lại cho tôi một phương tiện sáng tạo để thể hiện cảm xúc.)","Pastime – a leisure activity done regularly (Hoạt động giải trí thường xuyên)"]},{"title":"Phần ôn tập 64 · Chủ đề du lịch → take off, check in, get on","items":["Example: “Reading is a favorite pastime for many people.”\u000b(Đọc sách là một hoạt động giải trí yêu thích của nhiều người.)","Therapeutic – providing relaxation or stress relief (Mang lại sự thư giãn hoặc giảm căng thẳng)","Example: “Gardening is therapeutic, helping me relieve stress.”\u000b(Làm vườn có tính chữa lành, giúp tôi giảm căng thẳng.)","Rewarding – giving satisfaction or benefit (Mang lại sự hài lòng hoặc lợi ích)","Example: “Playing the piano is rewarding, especially when I learn a new piece.”\u000b(Chơi piano rất bổ ích, đặc biệt khi tôi học một bản nhạc mới.)","Hands-on activity – a practical activity involving active participation (Hoạt động thực hành yêu cầu tham gia tích cực)","Get a sense of accomplishment – feel proud of completing something (Có cảm giác thành tựu)","Social interaction – engaging with others socially (Tương tác xã hội)","Leisure pursuit – a formal way to refer to a hobby or recreational activity (Cách nói trang trọng về sở thích hoặc hoạt động giải trí)","3. Adjectives for Describing Hobbies (Tính từ mô tả sở thích)","Relaxing – calming and soothing (Thư giãn)","Example: “Knitting is a relaxing activity I enjoy in my free time.”\u000b(Đan len là một hoạt động thư giãn mà tôi yêu thích trong thời gian rảnh.)","Challenging – requiring effort and skill (Đòi hỏi sự nỗ lực và kỹ năng)","Example: “Learning a musical instrument can be challenging but worthwhile.”\u000b(Học một nhạc cụ có thể thử thách nhưng rất đáng giá.)","Stimulating – mentally engaging and exciting (Kích thích trí não và thú vị)","Example: “Chess is a stimulating game that requires strategic thinking.”\u000b(Cờ vua là một trò chơi kích thích yêu cầu tư duy chiến lược.)","Time-consuming – requiring a lot of time to complete (Tốn nhiều thời gian)","Example: “Oil painting is quite time-consuming, but the results are satisfying.”\u000b(Vẽ tranh sơn dầu khá tốn thời gian, nhưng kết quả rất hài lòng.)","Engrossing – very interesting, absorbing full attention (Rất thú vị, thu hút hoàn toàn sự chú ý)","Example: “Reading mystery novels can be engrossing, especially when they’re well-written.”\u000b(Đọc tiểu thuyết trinh thám có thể rất cuốn hút, đặc biệt khi được viết hay.)","Rewarding – providing satisfaction or benefits (Mang lại sự hài lòng hoặc lợi ích)","Example: “Teaching yourself to cook is a rewarding hobby.”\u000b(Tự học nấu ăn là một sở thích đáng giá.)","4. Phrasal Verbs Related to Hobbies (Cụm động từ liên quan đến sở thích)","Get into (something) – start becoming interested in (Bắt đầu quan tâm đến điều gì đó)","Example: “I recently got into gardening, and now I spend hours working on it.”\u000b(Gần đây tôi bắt đầu thích làm vườn và giờ tôi dành hàng giờ để làm việc này.)","Pick up (a hobby) – learn or start a new hobby (Bắt đầu hoặc học một sở thích mới)","Example: “She picked up painting during the lockdown and has been improving ever since.”\u000b(Cô ấy bắt đầu học vẽ trong thời gian giãn cách và đã tiến bộ rất nhiều từ đó.)","Wind down – relax after a busy day (Thư giãn sau một ngày bận rộn)","Example: “Reading a book helps me wind down in the evening.”\u000b(Đọc sách giúp tôi thư giãn vào buổi tối.)","Catch up on – do something you’ve missed out on (Làm điều gì đó mà bạn đã bỏ lỡ)","Example: “On weekends, I like to catch up on my favorite shows.”\u000b(Vào cuối tuần, tôi thích xem lại các chương trình yêu thích của mình.)","1. How do you normally arrange your weekends?","Introduction: Begin by mentioning if you have any regular activities on weekends.","Details: Describe specific activities, such as spending time with family, doing hobbies, or resting.","Reasoning: Explain why you chose these activities (e.g., for relaxation, family bonding, or personal enjoyment).","Sample: Typically, I try to structure my weekends to strike a balance between productivity and relaxation. On Saturday, I usually go for a jog as it energizes me and helps clear my mind while spend time with family or close friends are often prioritzed. Sundays, on the other hand, are more focused on rest. I often use this day to catch up on reading, do some household chores, and mentally prepare for the upcoming week.","answer:","I usually plan my weekends around my hobbies and relaxation. I dedicate Saturday morning to cleaning my house and doing laundry and washing the dishes or cooking as my parents are not at home, then I spend time playing sports like swimming and badminton or learning new skills like Excel and human resource foundation courses. On Sunday, I sometimes hang out with friends or spend time with my family and I take a bit of time to take care of myself. It helps me unwind and recharge for the next week. At the end of the week, i write diary and plan for the next week.","2. How do you spend your spare time?","Introduction: Mention your hobbies or typical activities during free time.","Activities: Describe each activity briefly, like reading, sports, or watching movies.","Benefits: Explain what you enjoy about these activities and how they help you (e.g., relieve stress, learn new things).","Sample: In my free time, I engage in a variety of activities that help me unwind and stay mentally stimulated. I love reading novels, especially mysteries, because they captivate me and allow me to escape into another world. I also enjoy cooking new recipes I find online, as it’s both a creative outlet and a practical skill. Additionally, I try to spend some time outdoors, whether it's hiking, walking, or just relaxing in a nearby park to appreciate nature.","I usually plan my weekends around my hobbies and personal care. On Saturday mornings, I dedicate time to household chores like cleaning, doing laundry, and sometimes cooking — it’s my way of giving back to my family. Then I like to engage in a hobby like swimming or playing badminton because it helps me stay active and refreshed. I also pursue a hobby of learning practical skills, such as Excel and human resource courses, which I find both stimulating and rewarding.","On Sundays, I either hang out with friends or spend time with my family, and in the evening, I wind down by journaling and planning for the upcoming week. I find writing to be a great creative outlet, and it gives me a sense of accomplishment whenever I reflect on what I’ve done.","—-","Sample Answer:\u000b I usually plan my weekends around my hobbies and household responsibilities. On Saturday mornings, I dedicate time to cleaning the house, doing laundry, and sometimes cooking, especially when my parents are out. In the afternoon, I either go swimming or play badminton, which I find really stimulating and healthy. I also pursue a hobby of self-learning, like practicing Excel or studying human resource topics. On Sundays, I may hang out with friends, enjoy time with my family, and in the evening, I wind down by writing in my diary and planning for the upcoming week.","✅ Từ vựng & cấu trúc:","Dedicate time to a hobby","Pursue a hobby of…","Wind down","Stimulating","Plan my weekends around…","3. Do you have any hobbies?","Introduction: Start with a simple yes or no.","Description: If yes, name your hobbies and give a brief description of each.","Interest: Share why you like these hobbies and how you feel about them.","Sample: Yes, I have a couple of hobbies that I’m quite passionate about. One of my main hobbies is photography, which I find incredibly fulfilling. I enjoy capturing landscapes and candid moments, as photography allows me to see beauty in everyday life.","Yes, I do. I enjoy several hobbies because they help me relax and recharge after a long week. For example, I love to play badminton and go swimming because they’re both fun and physically rewarding. Cooking is also my favourite hobby because I love experimenting with new recipes and treating my family. It gives me a real sense of accomplishment.","✅ Cấu trúc & collocations đã dùng:","I enjoy (hobby) because (…)","I love to (verb) because it’s so (adj)","Cooking is my favourite hobby because (…)","Sense of accomplishment","Rewarding","4. How did you become interested in that?","Background: Explain when you first encountered this hobby.","Inspiration: Mention any person, event, or reason that inspired you to take up this hobby.","Development: Describe how your interest grew over time.","Sample: My interest in photography began during a family holiday when I was given a camera for the first time. I found myself taking photos of almost everything, and seeing those images afterward made me realize the power of capturing memories."]},{"title":"Phần ôn tập 65 · Chủ đề du lịch → take off, check in, get on","items":["I started journaling at the age of 15 when I was going through a stressful time at school. Writing helped me stay calm and organized, and over time, I developed a passion for self-reflection and personal growth. As for badminton and swimming, I got into them because my friends invited me to play, and I’ve enjoyed them ever since.","✅ Từ & cấu trúc:","I started (gerund) at the age of…","Developed a passion for…","Got into (something)","5. How much time do you spend on that?","Introduction: Give an estimate (e.g., hours per week or daily).","Schedule: Mention if you have a fixed schedule for this hobby or do it whenever you’re free.","Reasons for Time Spent: Explain if you wish to spend more/less time on it and why.","Sample: I try to dedicate at least a few hours each week to my hobbies. For photography, I typically spend a couple of hours on weekends, either going to scenic spots or just exploring the city.","I try to dedicate at least a few hours every weekend to my hobbies. I usually clean and cook on Saturday mornings, then spend one or two hours playing sports or learning something new. In the evening, I always take 20–30 minutes to write in my journal. I find this routine both rewarding and therapeutic.","✅ Collocations & adj:","Dedicate time to…","Rewarding","Therapeutic","6. Do you prefer relaxing at home or going out in the evening?","Preference: Start by stating your preference.","Explanation: Give reasons (e.g., enjoy peace at home or love social activities outside).","Balance: Mention if you like a mix of both, depending on your mood or energy levels.","Sample: My preference depends on my energy level and the nature of my week. If I’ve had a particularly busy or stressful week, I usually prefer to stay at home, where I can unwind with a good book or a movie. However, if I’m feeling social, I enjoy going out to a nice restaurant or meeting up with friends. I believe both options have their merits, but I tend to lean towards staying in, as it allows me to fully recharge.","It depends on my mood, but usually, I think I’d rather relax at home because it’s peaceful and helps me wind down. I often read, cook something simple, or write in my diary. But sometimes, especially on Sundays, I go out with friends for a coffee or dinner just to catch up and enjoy some social interaction.","✅ Từ vựng & cấu trúc:","I think I’d rather (bare infinitive)","Wind down","Catch up","Social interaction","7. When you go out for the evening, what do you like to do?","Activities: List activities you enjoy outside (e.g., dining out, movies, meeting friends).","Places: Mention any favorite spots like cafes, parks, or theaters.","Reasons: Explain why you enjoy these activities or places.","Sample: When I go out in the evening, I usually like to try new dining experiences or explore cultural events like art exhibitions or live music. I find it enjoyable to try different cuisines and experience the ambiance of unique places. Occasionally, I’ll go to the cinema to watch a new release or attend a concert if there’s a band or artist I like performing nearby.","When I go out, I like to keep it simple — going to a café, trying out new food, or walking in a park. I find that spending time with friends in a calm setting helps me laugh and create memories. I don’t usually go to noisy places. I prefer places where I can talk and feel connected.","✅ Collocations:","Laugh and create memories","Calm setting","Try out new food","8. Is there any kind of entertainment you dislike?","Dislike: Mention any form of entertainment you don’t enjoy.","Reasoning: Explain why (e.g., too noisy, boring, or not suitable for your personality).","Alternative: Suggest what you prefer instead.","Sample: I’m not a big fan of loud nightclubs or places with heavy crowds. I find that the noise and crowded environment make it hard to relax and enjoy myself. I’d rather spend time in a quieter setting where I can have meaningful conversations or engage in activities without feeling overwhelmed. Additionally, I’m not too keen on reality TV; I find it somewhat repetitive and not very intellectually stimulating.","Yes, I’m not really into nightclubs or loud parties. I find them too overwhelming and not really my style. I prefer hobbies that are more relaxing, like journaling or cooking. These activities allow me to feel at peace and express myself more freely.","✅ Từ vựng:","Overwhelming","Relaxing","Express myself freely","9. Why do you think that people have hobbies?","Importance of Hobbies: Briefly explain the general purpose of hobbies.","Benefits: List benefits such as stress relief, skill development, or social interaction.","Personal Opinion: Share why you believe hobbies are essential for everyone.","Sample: In my opinion, hobbies play a vital role in people’s lives as they offer a much-needed break from the demands of everyday life. Engaging in hobbies can be therapeutic, providing a means to relax, relieve stress, and even foster creativity. Moreover, hobbies allow people to explore their interests and develop new skills, which can be highly rewarding. I also think hobbies are a great way to connect with others who share similar passions, creating a sense of community and belonging.","I think people have hobbies because they need a creative outlet or something to help them unwind after a long day. Hobbies are also a great way to explore new skills and maintain a balanced lifestyle. Personally, I believe hobbies are essential because they bring joy, purpose, and even a sense of identity.","✅ Collocations & lý do hay:","Creative outlet","Unwind","Sense of identity","Maintain a balanced lifestyle","Do you have any hobbies?","Introduction: Start with a simple yes or no.","Description: If yes, name your hobbies and give a brief description of each.","Interest: Share why you like these hobbies and how you feel about them.","Sample: Yes, I have a couple of hobbies that I’m quite passionate about. One of my main hobbies is photography, which I find incredibly fulfilling. I enjoy capturing landscapes and candid moments, as photography allows me to see beauty in everyday life.","->Tiếp tục dùng các câu hỏi sau để mở rộng và đảm bảo sự liên kết giữa các phần:","How did you become interested in that?","How much time do you spend on that?\u000b\u000bSample (sau khi mở rộng):","Yes, I have a couple of hobbies that I’m quite passionate about. One of my main hobbies is photography, which I find incredibly fulfilling. I enjoy capturing landscapes and candid moments because photography allows me to see beauty in everyday life.","I first became interested in photography during a family trip to the mountains a few years ago. I borrowed my brother’s camera to take a picture of the sunrise, and when I saw the result, I was amazed at how a single shot could convey so much emotion and detail. That moment sparked my curiosity, and I’ve been exploring photography ever since.","Now, I try to dedicate at least a couple of hours every weekend to photography. On weekdays, I spend time editing my photos and watching tutorials to improve my skills. Whenever I’m traveling or attending special events, I immerse myself completely in the process, sometimes spending an entire day capturing the perfect moments.","*Lưu ý: đặt tên tệp là loại lớp_tên học viên\u000bVí du: Foundation 12_Bùi Mỹ Linh\u000b           Basic Premium 22_Bùi Mỹ Linh","Yes, I have a few hobbies that I really enjoy, especially during the weekends. I usually plan my weekends around my hobbies and relaxation. On Saturday mornings, I spend time cleaning the house, doing laundry, and washing the dishes or cooking as my parents are not at home. These activities help me feel organized and refreshed."]},{"title":"Phần ôn tập 66 · Chủ đề du lịch → take off, ch o call the man whose umbrella I accidentally picked up after the meeting. \u000bStudent 4:","III. Choose the correct explanation of the meaning of each sentence.","The students, who attend class five hours per day, have become quite proficient in their new language.\u000ba. All of the students attend class for five hours per day.\u000bb. Only some of the students attend class for five hours per day.","The students who attend class five hours per day have become quite proficient in their new language.\u000ba. All of the students attend class for five hours per day.\u000bb. Only some of the students attend class for five hours per day.","The orchestra conductor signaled the violinists, who were to begin playing.\u000ba. All of the violinists were to begin playing.\u000bb. Only some of the violinists were to begin playing.","The orchestra conductor signaled the violinists who were to begin playing.\u000ba. All of the violinists were to begin playing.\u000bb. Only some of the violinists were to begin playing.","I put the vase on the top of the TV set, which is in the living room.\u000ba. I have more than one TV set.\u000bb. I have only one TV set.","I put the vase on the top of the TV set which is in the living room.\u000ba. I have more than one TV set.\u000bb. I have only one TV set.","Trees which lose their leaves in winter are called deciduous trees.\u000ba. All trees lose their leaves in winter.\u000bb. Only some trees lose their leaves in winter.","Pine trees, which are evergreen, grow well in a cold climate.\u000ba. All pine trees are evergreen.\u000bb. Only some pine trees are evergreen.","The teacher thanked the students, who had given her some flowers.\u000ba. The flowers were from only some of the students.\u000bb. The flowers were from all of the students.","The teacher thanked the students who had given her some flowers.\u000ba. The flowers were from only some of the students.\u000bb. The flowers were from all of the students.","Roberto reached down and pick
