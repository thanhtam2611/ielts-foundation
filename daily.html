cause. She divorced her husband for this cause.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","The days were the saddest ones. I lived far from home on those days.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","A café is a small restaurant. People can get a light meal there.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","You didn't tell us the reason. We had to cut down our daily expenses for that reason.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","*VI. Complete the advertisement. Put in who, whom, whose, which, where, or why.","The town of Keswick, (1) ___ lies at the heart of the Lake District, is the perfect place for a holiday. The Derwent Hotel, (2) ___ overlooks the town, is the perfect place to stay. Robin and Wendy Jackson, (3) ___ bought the hotel three years ago, have already won an excellent reputation. Robin, (4) ___ cooking is one of the reasons (5) ___ the Derwent is so popular, was once Young Chef of the Year. The comfort of the guests, (6) ___ the owners treat almost as members of the family, always comes first. Peter Ustinov, (7) ___ once stayed at the hotel, described it as \"marvellous.\" And the Lake District, (8) ___ has so much wonderful scenery and (9) ___ the poet Wordsworth lived, will not disappoint you.","VII. Use a relative pronoun or relative adverb to combine each pair of sentences.","The student is from China. He sits next to me in the English class.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","The Old Man and the Sea is an interesting novel. It was written by Ernest Hemingway.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","The professor is excellent. I’m taking his course.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","Mr. Smith said he was too busy to speak to me. I had come to see him.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","The man is my father. I respect this man most.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","Do you know the reason? Marta left for this reason.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","Tom has three sisters. All of them are married.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","I recently went back to Paris. It is still as beautiful as a pearl.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","I recently went back to Paris. I was born in Paris nearly 50 years ago.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","Laura couldn’t find the box. She kept her photos in that box.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","Art Golding was a famous actor. He played the ship’s captain in Iceberg.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","The police want to know the hotel. Mr. Foster stayed there two weeks ago.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","I’ve sent him two letters. He has received neither of them.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:"]},{"title":"Phần ôn tập 69 · Chủ đề du lịch → take off, check in, get on","items":["That man is an artist. I don’t remember the man’s name.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","Do you still remember the day? We moved to this town on that day.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","The reason hasn’t been told yet. The President will come to the city for this reason.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","Vicky didn’t get the job. It’s made her very depressed.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","My uncle usually goes by bus. You met him at the bus stop this morning.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","That car belongs to Dr. Clark. Its engine is very good.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","He gave several reasons. Only a few of them were valid.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","Charlie Chaplin died in 1977. His films amused millions of people in the world.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","The taxi driver is friendly. He took me to the airport.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","I ran into a woman. I had gone to elementary school with her.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","The house is empty now. I used to live there.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","Do you remember the year? The First World War ended in that year.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","A girl was injured in the accident. She is now in hospital.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","Mrs. Morgan is going to spend a few weeks in Sweden. Her daughter lives in that country.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","We stayed at the Grand Hotel. Ann recommended it to us.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","My sister was looking after a dog. Its leg had been broken in an accident.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","The street I live in is very noisy at night. This makes it difficult to sleep.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","IX. Change the relative clauses to phrases.","Do you know the woman who is coming toward us?\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","The road that joins the two villages is very narrow.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","Most of the goods that are made in this factory are exported.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","My grandmother, who is old and sick, never goes out of the house.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","Kuala Lumpur, which is the capital of Malaysia, is a major trade center in Southeast Asia.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","The woman who lived here before us is a romantic novelist.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","The scientists who are researching the cause of cancer are making progress.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","Our solar system is in a galaxy that is called the Milky Way.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","All students who don’t hand in their papers will fail in the exam.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","Thomas Jefferson, who was a great South American general, led the fight for independence early in the 19th century.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","Some of the people who have been invited to the party can’t come.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","Ann is the woman who is responsible for the error.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","Mr. Jackson, who has been working in the company for over ten years, was nominated as the new director.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","English is an alphabet which consists of 26 letters.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","We noticed a pile of wood that had been left in the road.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","XIV. Each of these sentences contains errors in it. Write the correct sentence.","There were a lot of people waited in a long line outside the box office.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","This isn’t the bus on that I normally travel.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","Baseball is the only sport which I am interested on it.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","The reason because I didn’t know was that no one had told me.\u000bStudent 1:\u000bStudent 2:\u000bStudent 3:\u000bStudent 4:","Do you like friends?","Introduction: Start with a positive statement (e.g., “Yes, absolutely”).","Reasoning: Explain why friends are important (e.g., for companionship, support).","Examples/Elaboration: Mention how friends add joy or balance to your life.","Yes, absolutely. Friends play a vital role in my life as they provide companionship, support, and joy. I believe that having friends enriches my life, as they bring different perspectives and experiences that help me grow as a person.","Yes, absolutely. I love having friends.","Friends are very important to me because they make life more fun and less lonely. When I feel sad or stressed, I can talk to them and they always listen.","We laugh and create memories together, like going to a café, watching movies, or just having a heart-to-heart talk.","I think a good friend is someone who supports me, understands me, and stands by me in tough times.","To me, friendship is not just about fun — it’s about trust, love, and being there for each other","Yes, definitely. I believe friends are like a second family. They stand by me in need and support me in tough times. Whenever I feel overwhelmed, I can always have a heart-to-heart talk with them, which helps me feel better instantly.","2. What kind of people can be your friends?","Introduction: Briefly state the types of qualities you value in friends.","Key Qualities: List traits such as honesty, understanding, sense of humor.","Reasoning: Explain why these traits are important for a strong friendship.","Examples: Mention how these qualities make interactions more meaningful.","I prefer friends who are honest, understanding, and supportive. I think these qualities are essential for building trust and maintaining a healthy friendship. I also enjoy being around people who have a good sense of humor and are open-minded, as they make interactions more enjoyable and meaningful.","I like people who has a good sense of humor, kindness, honesty and understanding. These people make me feel safe and comfortable. For me, a good friend is someone i can trust and confide in, who don’t judge me  they support me in both good and bad times.","I tend to make friends with people who are honest, funny, and kind-hearted. I value those who can share common interests and are willing to be a shoulder to cry on when life gets hard. Trust and empathy really matter to me in a friendship.","3. How do you make friends?","Introduction: Mention how you typically meet new people (e.g., social activities).","Steps/Process: Describe the process you follow (e.g., being approachable, showing interest).","Reasoning: Explain why these actions help build connections.","I usually make friends by participating in social activities or group projects. When I meet someone new, I try to be open and approachable, showing genuine interest in their thoughts and experiences. This helps to build a connection, and over time, we can develop a closer bond.","I usually make new friends through school or mutual hobbies. I try to be friendly and open, and once we spend quality time together, the bond naturally grows stronger. A simple conversation can sometimes lead to a lifelong friendship.","4. How much time do you spend with friends?","Introduction: Give an estimate of time spent with friends weekly.","Frequency: Mention if it’s on weekends or during specific times.","Activities/Methods: Describe ways you stay in touch (e.g., meeting up, phone calls).","Reasoning: Explain how this helps maintain the friendship.","It depends on my schedule, but I try to spend at least a few hours each week with my friends. On weekends, we might go out for a meal or participate in an activity together. During the week, we may catch up online or through quick phone calls to stay in touch.","I try to spend quality time together with my friends at least once a week. Even when we’re busy, we still keep in touch through texting or social media. I think it’s important to stay connected to maintain a healthy relationship."]},{"title":"Phần ôn tập 70 · Chủ đề du lịch → take off, check in, get on","items":["5. What do you normally do with your friends?","Introduction: Briefly mention a few common activities.","Activities: List specific things you do together (e.g., café visits, sports, movies).","Reasoning: Explain why these activities are enjoyable or meaningful.","We often enjoy simple activities like going to a café, watching movies, or just having long conversations. Sometimes, we like to be more active, so we go hiking or play sports together. The activity doesn’t really matter as much as just spending time together and enjoying each other’s company.","We usually enjoy casual outings, like grabbing coffee or going for a walk. Sometimes we just sit around, laugh and create memories. What matters most is not the activity itself but the joy of being together.","6. Do you prefer to spend more time with friends or with family?","Preference: State your preference (e.g., family or friends).","Reasoning: Explain why you prioritize one over the other.","Balance: Mention that both are important and you try to balance time with each.","Sample: I enjoy spending time with both, but I think family comes first for me. My family has always been there for me, so I prioritize spending quality time with them. However, I also value my friendships greatly and try to strike a balance between the two.","That’s a tough choice, but I’d say I spend more time with my family. However, I also appreciate lifelong friendships and try to cherish old friendships by checking in or celebrating birthdays together.","7. Would you rather have one close friend or many common friends?","Preference: State if you prefer one close friend or a wider social circle.","Reasoning: Explain the value of having a close friend vs. many friends.","Example: Give an example of the benefits of a close friend (e.g., trust, deep connection).","Sample: I would prefer to have one close friend. I believe having a deep, meaningful connection with one person is more valuable than having numerous acquaintances. A close friend is someone you can trust and rely on, and for me, that’s more important than having a large social circle.","Personally, I’d prefer one close friend over many casual ones. With a true friend, I can trust and confide in someone completely and always have someone to rely on in tough times.","8. How important is friendship to you?","Introduction: Emphasize the significance of friendship in your life.","Reasons: List key reasons (e.g., emotional support, shared experiences).","Benefits: Explain how friendship contributes to your well-being or happiness.","Friendship is incredibly important to me. Friends provide emotional support, share in both the joys and challenges of life, and help me feel connected. Good friends make life more enjoyable, and I think they play a significant role in my personal growth and happiness.","Friendship is incredibly important to me. Good friends help me grow, emotionally and mentally. I always try to build strong friendships and strengthen the bond by being there during both happy and difficult moments.","9. When you have trouble, do you turn to friends or family?","Preference: State if you turn to family, friends, or both.","Reasoning: Explain why you choose one over the other (e.g., trust, familiarity).","Example: Mention specific situations where you might choose friends or family.","When I face challenges, I usually turn to my family first, as they know me best and have always been my strongest support system. However, if the issue is something personal that I feel more comfortable discussing with friends, I’ll reach out to a close friend for advice or comfort.","It depends, but I usually rely on a true friend for emotional issues because I can have a heart-to-heart talk without feeling judged. For practical problems, I often turn to my family.","10. What is a true friend to you?","Definition: Briefly define what a true friend means to you.","Qualities: List qualities such as loyalty, honesty, and support.","Examples: Provide examples of how a true friend behaves (e.g., supportive in tough times, reliable).","Sample: A true friend, to me, is someone who is loyal, understanding, and supportive. They accept me as I am and stand by me in both good and bad times. A true friend is also honest and trustworthy, someone I can confide in without fear of being judged or misunderstood.","A true friend is someone who stands by you in need, who listens, supports, and doesn’t walk away during difficult times. They celebrate special occasions with you and resolve conflicts instead of ignoring them.","Link HW: https://docs.google.com/forms/d/e/1FAIpQLScoinE2qgfDZZgaDdE7mN5cOAMWCTRaCwLkXOot-QwrHaS4qQ/viewform?usp=dialog","VĂN PHONG\u000bSTYLES","Văn phong (style) là cách hành văn để diễn đạt một câu nói. Có nhiều cách để diễn đạt, ta có thể dùng:","a. Tính từ thay cho danh từ (hoặc ngược lại):","Ex:","She had a determination (sự quả quyết/quyết) to overcome her difficulties.\u000bShe was determined (quyết tâm) to overcome her difficulties.\u000b(Cô ấy quyết tâm vượt qua mọi khó khăn.)","They show no interest in the picture.\u000bThey aren’t interested in the picture.\u000b(Họ không thích bức tranh.)","b. Động từ thay cho danh từ (hoặc ngược lại):","Ex:","Can I have a look at your new dress?\u000bCan I look at your new dress?\u000b(Tôi có thể xem chiếc áo mới của bạn được không?)","He had an intention (ý định) of making a journey with her.\u000bHe intended (có ý định) to make a journey with her.\u000b(Anh ấy định đi du lịch với cô ta.)","c. Thể bị động của động từ thay cho thể chủ động (hoặc ngược lại):","Ex:","Mary has finished her homework.\u000b(Mary đã làm xong bài tập về nhà.)\u000bMary’s homework has been finished.\u000b(Bài tập về nhà của Mary đã được hoàn tất.)","We should  keep dangerous chemicals in safe places","Dangerous chemicals should be kept in safe places.\u000b(Hóa chất nguy hiểm nên được cất ở nơi an toàn.)","d. Trạng từ thay cho tính từ (hoặc ngược lại):","Ex:","He is a careful driver.\u000bHe drives carefully. (Anh ấy lái xe cẩn thận.)","Tom is a good student.\u000bTom studies well. (Tom là một học sinh giỏi.)","Lưu ý: Khi đổi cách hành văn, ta cần lưu ý sự thay đổi của giới từ, tính từ hoặc phụ từ trong câu.\u000bEx:","They gave some careful thought to the problem = They thought carefully about the problem\u000b(Họ đã suy nghĩ kỹ về vấn đề này.)","He has a strong desire to become a doctor = He strongly desires to become a doctor\u000b(Anh ấy ao ước trở thành bác sĩ.)","Một số từ thường được sử dụng dưới dạng động từ và danh từ:","to agree = to be in agreement  with (đồng ý) -> I agree with you/ I am in agreement with you.","to argue with sb = to have an argument with sb (tranh cãi với ai)","to arrange with sb = to have an arrangement with sb (sắp xếp)","to bathe = to have/take a bath (tắm)","to brush sth = to give sth a brush (chải)","to call sb = to give sb a call (gọi điện cho...)","to complain about = to have a complaint about (phàn nàn về...)","to contact sb = to have contact with sb (liên lạc, quan hệ)","to cry = to give a cry (khóc, kêu)","to decide to = to make a decision to (quyết định)"]},{"title":"Phần ôn tập 71 · Chủ đề du lịch → take off, check in, get on","items":["to disagree = to be in a disagreement (không đồng ý)","to discuss sth = to have a discussion about sth (thảo luận)","to drink = to have a drink (uống)","to explain sth = to give an explanation for sth (giải thích)","to examine = to have an examination (khám, kiểm tra, xem xét)","to exchange = to have an exchange of (trao đổi)","to kiss sb = to give sb a kiss (hôn)","to land = to make a landing (hạ cánh)","to laugh at = to give a laugh at (cười nhạo)","to look at = to have a look at (nhìn vào)","to love sb = to fall in love with sb (yêu ai)","to meet sb = to have a meeting with sb (gặp ai...)","to need = to have a need of (cần)","to photograph = to have a photograph of (chụp hình)","to receive sth = to be in receipt of sth (nhận...)","to rest = to have a rest (nghỉ ngơi)","to ring sb = to give sb a ring (gọi điện)","to sleep = to have a sleep (ngủ)","to succeed = to make a success (thành công)","to talk to = to have a talk with (nói chuyện với)","to think about/of = to give thought to (nghĩ)","to try to (+ inf.) = to make an effort to / to make an attempt to (cố gắng)","to tend to = to have a tendency to (có khuynh hướng)","to visit sb = to pay a visit to sb / to pay sb a visit (thăm viếng)","to warn = to give warning (báo động, cảnh cáo)","to welcome sb = to give sb a welcome (chào đón)","to wish = to have/express a wish (ao ước)","to be determined to = to have a determination to (quyết tâm)","to be interested in = to have interest in (thích)","to be used = to be in use (được sử dụng)","to desire = to have a desire (ao ước)","to explain sth = to give an explanation for sth (giải thích)","I. Rewrite these sentences, using the nouns corresponding to the verbs.","1. I argued with the referee about his decision.","→ I had an argument with the referee about his decision.\u000b → I had an altercation with the referee about his decision.\u000b → I had an exchange of opinions with the referee about his decision.\u000b → I had a dispute with the referee about his decision.","2. Do you agree with John about this?","→ Are you in agreement with John about this?\u000b → Are you in accord with John about this?\u000b → Are you in consensus with John about this?","3. She usually brushes her hair before going out.","→ She usually gives her hair a brush before going out.\u000b → She usually gives her hair a brushing before going out.\u000b → She usually gives her hair a quick brush before going out.\u000b → She usually gives her hair a tidy-up before going out.","4. She complained about his rudeness.","→ She had a number of complaints about his rudeness.\u000b → She had a number of grievances about his rudeness.\u000b → She had a number of objections about his rudeness.\u000b → She had a number of issues with his rudeness.","5. Because of engine trouble, the plane had to land on the fields.","→ Because of engine trouble, the plane had to make a landing.\u000b → Because of engine trouble, the plane had to make a forced landing.\u000b → Because of engine trouble, the plane had to make an emergency landing.\u000b → Because of engine trouble, the plane had to make a descent.","6. Just look at this picture.","→ Take a look at this picture.\u000b → Take a quick glance at this picture.\u000b → Take a look.\u000b → Take a glance.","7. I love her very much.","→ I’m in love with her.\u000b → I’m in deep love with her.\u000b → I’m in true love with her.\u000b → I’m in a romantic relationship with her.","8. We must start early.","→ We must make a start.\u000b → We must make an early start.\u000b → We must make a prompt start.\u000b → We must make a beginning.","9. After lunch time she usually rests.","→ After lunch time she usually takes a rest.\u000b → After lunch time she usually takes a nap.\u000b → After lunch time she usually takes a short break.\u000b → After lunch time she usually takes a pause.","10. He decided to withdraw from the competition.","→ He made a decision to withdraw from the competition.\u000b → He made a choice to withdraw from the competition.\u000b → He made a resolution to withdraw.\u000b → He made a determination to withdraw.","11. They apologized for their mistake.","→ They made an apology for their mistake.\u000b → They made an official apology for their mistake.\u000b → They made an expression of regret for their mistake.\u000b → They made an admission of their mistake.","12. She prepared for the exam all night.","→ She made thorough preparations for the exam all night.\u000b → She made a thorough preparation for the exam.\u000b → She made adequate preparation for the exam.\u000b → She made full arrangements for the exam.","13. He introduced his colleague to the group.","→ He gave an introduction of his colleague to the group.\u000b → He gave a brief introduction.\u000b → He gave an introductory speech.\u000b → He gave a formal introduction.","14. We discussed the new policy for hours.","→ We had a long discussion about the new policy.\u000b → We had a long debate about the new policy.\u000b → We had a long conversation about the new policy.\u000b → We had a long exchange of views about the new policy.","15. She applied for the position online.","→ She submitted an application for the position online.\u000b → She submitted an official request for the position online.\u000b → She submitted an online form for the position.\u000b → She submitted a written application.","16. He suggested a new approach to the problem.","→ He gave a suggestion for a new approach to the problem.\u000b → He gave a recommendation for a new approach.\u000b → He gave a proposal.\u000b → He gave an idea for a new approach.","17. She explained the situation clearly.","→ She provided a clear explanation of the situation.\u000b → She provided a clear account of the situation.\u000b → She provided a clear description.\u000b → She provided a clear outline.","18. They celebrated their success with a party.","→ They held a celebration to mark their success.\u000b → They held a party to mark their success.\u000b → They held an event to mark their success.\u000b → They held a gathering to mark their success.","19. She reacted quickly to the sudden change."]},{"title":"Phần ôn tập 72 · Chủ đề du lịch → take off, check in, get on","items":["→ She had a swift reaction to the sudden change.\u000b → She had a swift response.\u000b → She had a swift reflex.\u000b → She had a swift reply to the change.","II. Rewrite the sentences, beginning with the given words.","There is a tendency to minimize problems.","→ They tend to minimize problems.","→ They have a tendency to minimize problems.","There is a tendency to minimize problems.\u000b → They tend to minimize problems.\u000b → They have a tendency to minimize problems.\u000b → They are inclined to minimize problems.\u000b → They usually minimize problems.","They show a strong desire to put aside the status of the school child.\u000b → They strongly desire to put aside the status of the school child.\u000b → They strongly wish to leave behind the school-child status.\u000b → They strongly want to abandon the role of school children.\u000b → They strongly intend to move beyond being school children.","They thought much about their work.\u000b → They gave a lot of thought to their work.\u000b → They gave serious thought to their work.\u000b → They gave considerable thought to their work.\u000b → They gave deep thought to their work.","They had little knowledge of the job of their choice.\u000b → They knew little about the job they chose.\u000b → They lacked knowledge of their chosen job.\u000b → They were unfamiliar with the job they selected.\u000b → They had limited understanding of the job they wanted.","There is a determination to overcome problems.\u000b → They are determined to overcome problems.\u000b → They show determination to overcome problems.\u000b → They are resolved to overcome problems.\u000b → They have made up their minds to overcome problems.","He visits us whenever he’s in town.\u000b → He pays us a visit whenever he’s in town.\u000b → He pays a visit whenever he’s in town.\u000b → He pays his family a visit whenever he’s in town.\u000b → He pays a short visit to us whenever he’s in town.","There has been a tendency to choose well-paid jobs.\u000b → They have tended to choose well-paid jobs.\u000b → They have shown a tendency to choose well-paid jobs.\u000b → They have been inclined to choose well-paid jobs.\u000b → They have consistently chosen well-paid jobs.","III. Rewrite these sentences by using the bolded nouns as verbs or adjectives. https://www.thesaurus.com/ => synonym and antonym","He had no intention of making a long journey with her.\u000b → He didn’t intend to make a long journey with her.\u000b → He had no plan to travel far with her.\u000b → He was unwilling to travel far with her.\u000b → He didn’t mean to go on a long journey with her.","Has the city government made a decision to build a hospital for the poor?\u000b → Has the city government decided to build a hospital for the poor?\u000b → Has the city government planned to build a hospital for the poor?\u000b → Has the city government resolved to build a hospital for the poor?\u000b → Has the city government committed to building a hospital for the poor?","She shows no interest in what she is doing for the company.\u000b → She is not interested in what she is doing for the company.\u000b → She lacks interest in her work for the company.\u000b → She doesn’t care about what she’s doing for the company.\u000b → She is uninterested in her tasks for the company.","Do most school-leavers have a strong desire to work at a tourist office?\u000b → Do most school-leavers strongly desire to work at a tourist office?\u000b → Do most school-leavers wish to work at a tourist office?\u000b → Do most school-leavers want to work at a tourist office?\u000b → Do most school-leavers aim to work at a tourist office?","I don’t think they are in disagreement with what we shall do.\u000b → I don’t think they disagree with what we shall do.\u000b → I think they agree with what we will do.\u000b → I don’t believe they object to what we’ll do.\u000b → I don’t think they are opposed to our plan.","The plan didn’t make a success just because most members showed no determination of doing it well.\u000b → The plan failed because most members were not determined to do it well.\u000b → The plan didn’t succeed due to their lack of determination.\u000b → The plan didn’t work as most members lacked the will to succeed.\u000b → The plan failed as they didn’t commit to it.","During the lesson, she always takes a careful look at all the sentences and examples the teacher is giving.\u000b → During the lesson, she always looks carefully at the sentences and examples.\u000b → During the lesson, she examines the teacher’s sentences and examples closely.\u000b → She always observes all the examples the teacher gives.\u000b → She pays close attention to the teacher’s explanations.","My friend expressed a wish to become a pilot.\u000b → My friend wished to become a pilot.\u000b → My friend wanted to become a pilot.\u000b → My friend hoped to become a pilot.\u000b → My friend aspired to be a pilot.","You have no need of answering all the questions in their order.\u000b → You don’t need to answer all the questions in order.\u000b → You aren’t required to answer all the questions in order.\u000b → It isn’t necessary to answer all the questions sequentially.\u000b → You don’t have to answer the questions in the given order.","Please give me a call when you arrive, and we’ll have a meeting at a certain restaurant.\u000b → Please call me when you arrive, and we’ll meet at a restaurant.\u000b → Phone me when you get here, and we’ll meet up.\u000b → Contact me when you arrive so we can meet.\u000b → Call me, and we’ll meet at a restaurant.","She has no knowledge of what will be because she never gives thought to it.\u000b → She doesn’t know what will happen because she never thinks about it.\u000b → She is unaware of what’s coming as she doesn’t think ahead.\u000b → She doesn’t consider the future, so she remains unaware.\u000b → She lacks foresight because she never thinks about it.","She said she would pay me a visit someday.\u000b → She said she would visit me someday.\u000b → She promised to visit me one day.\u000b → She planned to come see me in the future.\u000b → She mentioned she would drop by someday.","He made a decision to leave home.\u000b → He decided to leave home.\u000b → He chose to leave home.\u000b → He resolved to move out.\u000b → He planned to leave home.","I had no intention of staying here.\u000b → I didn’t intend to stay here.\u000b → I didn’t mean to stay here.\u000b → I never planned to stay here.\u000b → I wasn’t going to stay here.","She has a great interest in music.\u000b → She is greatly interested in music.\u000b → She loves music.\u000b → She shows a passion for music.\u000b → She enjoys music very much.","There was an exchange of English lessons between the two schoolgirls.\u000b → The two schoolgirls exchanged English lessons.\u000b → They taught each other English lessons.\u000b → They shared English lessons.\u000b → They gave each other English lessons.","He takes a bath every morning.\u000b → He bathes every morning.\u000b → He has a bath every morning.\u000b → He washes himself every morning.\u000b → He showers or bathes each morning.","I had an arrangement with the neighbors about feeding the cats.\u000b → I arranged with the neighbors to feed the cats.\u000b → I made plans with the neighbors to feed the cats.\u000b → I settled with them about feeding the cats.\u000b → I agreed with them on feeding the cats.","There was no explanation for her plan.\u000b → She didn’t explain her plan.\u000b → She gave no explanation for her plan.\u000b → She failed to explain her plan.\u000b → Her plan was unexplained.","She had a medical examination by a doctor.\u000b → She was medically examined by a doctor.\u000b → A doctor examined her.\u000b → She underwent a medical checkup.\u000b → She had a check-up.","They made an agreement to end the dispute.\u000b → They agreed to end the dispute.\u000b → They reached an agreement to settle the dispute.\u000b → They settled the dispute.\u000b → They came to terms to end the dispute.","She expressed happiness over the news of her promotion.\u000b → She was happy about her promotion.\u000b → She celebrated her promotion.\u000b → She reacted joyfully to her promotion.\u000b → She felt delighted about her promotion.","The team showed great commitment to finishing the project on time.\u000b → The team was committed to finishing the project on time.\u000b → They worked hard to finish the project on time.\u000b → They dedicated themselves to finishing the project.\u000b → They committed fully to the deadline.","The neighbors lodged a formal complaint about the noise.\u000b → The neighbors formally complained about the noise.\u000b → They complained to the authorities about the noise.\u000b → They made a formal complaint.\u000b → They objected to the noise officially.","There was an announcement of the new rules during the meeting.\u000b → They announced the new rules during the meeting.\u000b → The new rules were announced at the meeting.\u000b → A speaker announced the new rules.\u000b → They made an announcement about the new rules.","He has a strong preference for working alone.\u000b → He strongly prefers working alone.\u000b → He likes to work alone.\u000b → He prefers solitude when working.\u000b → He enjoys working independently.","Her celebration of the achievement was heartwarming.\u000b → She celebrated the achievement warmly.\u000b → She joyfully celebrated her success.\u000b → She marked the achievement with joy.\u000b → She expressed her happiness through a celebration.","Their suggestion to delay the event was accepted.\u000b → They suggested delaying the event, and it was accepted.\u000b → Their proposal to delay the event was accepted.\u000b → They recommended a delay, which was accepted.\u000b → They advised postponing the event, and it was agreed.","We made a quick evaluation of the situation before deciding.\u000b → We quickly evaluated the situation before deciding.\u000b → We assessed the situation quickly.\u000b → We gave a quick assessment.\u000b → We judged the situation swiftly.","The students’ participation in the activity was commendable.\u000b → The students actively participated in the activity.\u000b → The students took part in the activity.\u000b → The students joined the activity, which was commendable.\u000b → Their involvement in the activity was praiseworthy.","🟩 1. Chuyển đổi từ loại (Danh từ ↔ Động từ ↔ Tính từ)","He has a determination to succeed.\u000b → He is determined to succeed.","They showed no interest in the game.\u000b → They were not interested in the game.","She has confidence in her abilities.\u000b → She is confident in her abilities.","He decided to stay home.\u000b → He made a decision to stay home.","They complained about the noise.\u000b → They made a complaint about the noise.","She made an effort to solve the problem.\u000b → She tried to solve the problem.","He has a strong determination to succeed despite all obstacles.\u000b → He is strongly determined to succeed despite all obstacles.","The meeting was productive, leading to the successful completion of the project.\u000b → The meeting was productive, leading to the project being successfully completed.","She always expresses her happiness when meeting old friends.\u000b → She is always happy when meeting old friends.","His confidence in presenting ideas makes him a great leader.\u000b → He is confident in presenting ideas, which makes him a great leader.","They handled the matter carefully to avoid any misunderstanding.\u000b → They were careful in handling the matter to avoid any misunderstanding.","🟦 2. Chuyển từ chủ động ↔ bị động","Mary completed the report yesterday.\u000b → The report was completed by Mary yesterday.","The company has launched a new product.\u000b → A new product has been launched by the company.","Dangerous chemicals should be stored safely.\u000b → We should store dangerous chemicals safely. (hoặc: Dangerous chemicals should be stored safely by us.)","His mistakes were noticed by the teacher.\u000b → The teacher noticed his mistakes.","The manager reviewed the budget proposal carefully.\u000b → The budget proposal was reviewed carefully by the manager.","New policies were introduced by the government last month.\u000b → The government introduced new policies last month.","The volunteers are planting trees in the park.\u000b → Trees are being planted in the park by the volunteers.","The bridge will be repaired by the construction team next week.\u000b → The construction team will repair the bridge next week.","Everyone should protect the environment for future generations.\u000b → The environment should be protected by everyone for future generations.","🟨 3. Sử dụng trạng từ ↔ tính từ","He is a careful worker.\u000b → He works carefully.","Tom is a fast runner.\u000b → Tom runs fast.","She danced beautifully.\u000b → She is a beautiful dancer.","The teacher spoke very clearly during the lecture.\u000b → The teacher’s speech during the lecture was very clear."]},{"title":"Phần ôn tập 73 · Chủ đề du lịch → take off, check in, get on","items":["The weather is unusually warm today.\u000b → The weather today is unusual because of the warmth.","He is a quick learner and picks up new skills quickly.\u000b → He learns quickly because he is a quick learner.","The children behaved very badly at the party.\u000b → The children’s behavior at the party was very bad.","She is an excellent chef and cooks deliciously.\u000b → She is an excellent chef who cooks delicious food.","🟧 4. Thay đổi cấu trúc đồng nghĩa","Can I have a look at your book?\u000b → Can I look at your book?","He gave me a call yesterday.\u000b → He called me yesterday.","She strongly desires to become a doctor.\u000b → She has a strong desire to become a doctor.","They need to rest after a long day.\u000b → They are in need of rest after a long day.","Can I have a discussion with you about this matter?\u000b → Can we discuss this matter?","She strongly desires to make a difference in the community.\u000b → She has a strong desire to make a difference in the community.","They made an effort to complete the task before the deadline.\u000b → They tried hard to complete the task before the deadline.","🟥 5. Viết lại đoạn văn bằng cách thay đổi văn phong","📝 Đoạn gốc:","\"John decided to start a business after years of working for others. He made an effort to plan everything carefully. His determination to succeed was clear, and he strongly believed in his ability to overcome any challenges. His friends gave him support and advice, which he valued greatly.\"","✅ Cách viết lại (chuyển từ loại, cấu trúc và giữ nguyên nghĩa):","After years of working for others, John made the decision to start his own business. He carefully planned every detail with strong determination to succeed. He believed in his ability to face any challenge. His friends supported him with valuable advice, which he appreciated deeply.","✅ Chuyển đổi từ loại (6/10 điểm)","Một số lỗi thường gặp:","\"She made an effort...\" → \"She tried...\": Bạn trả lời \"She was effortful...\" là không tự nhiên trong tiếng Anh. Từ \"effortful\" ít dùng, thay vào đó \"tried\" đơn giản và chính xác hơn.","\"He has a strong determination...\" → \"He is determined...\": Bạn quên thêm trạng từ \"strongly\" hoặc bị thiếu trợ động từ \"is\".","\"The meeting was productive...\": Câu bạn viết \"produced results\" vẫn đúng nhưng chưa sát ý gốc. Đáp án chuẩn là giữ nguyên: “The meeting was productive...”.","Cần ghi nhớ:","Khi chuyển từ danh từ → động từ hoặc tính từ, ưu tiên dùng dạng sát nghĩa và thông dụng.","Tránh dùng từ ít phổ biến hoặc không tự nhiên (như “effortful”).","✅ Chuyển câu chủ động ↔ bị động (7/9 điểm)","Hai lỗi:","\"Dangerous chemicals should be stored...\" → Bạn viết \"People should store...\" nhưng đề yêu cầu bị động phải đúng ngữ pháp.","\"Everyone should protect...\" → Bạn viết chưa đủ chuẩn thứ tự, nên viết “...by everyone for future generations.”","Ghi nhớ:","Cấu trúc bị động chuẩn:\u000b be + past participle (V3)\u000b Ví dụ: should be protected, was completed, is being planted...","✅ Trạng từ và tính từ (4/8 điểm)","Một số lỗi:","\"The teacher spoke very clearly...\" → Bạn viết “The teacher gave a clear lecture” không sai, nhưng không nhấn đúng hành động gốc “spoke”.","\"The weather is unusually warm...\" → Viết lại cần bám sát cấu trúc trạng từ → tính từ, đừng làm thay đổi ý nghĩa.","\"She is an excellent chef and cooks deliciously.\" → Từ “deliciously” không tự nhiên. Dùng “delicious food” sẽ tự nhiên và đúng văn phong hơn.","Ghi nhớ:","Tránh dùng trạng từ không phổ biến với hành động cụ thể (e.g. “cook deliciously”).","Ưu tiên cách viết tự nhiên, gần với cách người bản xứ sử dụng.","✅ Thay đổi cấu trúc đồng nghĩa (4/7 điểm)","Một số lỗi:","\"They need to rest...\" → Dùng “are in need of” hoặc “have a need to” đều đúng, bạn chỉ cần chọn cấu trúc trọn vẹn hơn.","\"They made an effort...\" → “Tried” chưa đủ mạnh bằng “tried hard” để thể hiện nỗ lực.","❌ Viết lại đoạn văn (0/1 điểm)","Bạn chưa viết lại đoạn văn đúng yêu cầu. Dưới đây là 2 cách viết lại hoàn chỉnh để bạn tham khảo và học theo:","✍️ Cách 1: Dùng thể bị động","A business was decided to be started by John after years of working for others. Every detail was carefully planned by him. His determination to succeed was clear, and his belief in overcoming challenges was strong. Support and advice were given to him by his friends, which he greatly valued.","✍️ Cách 2: Thay đổi từ loại và cấu trúc","After years of working for others, John made the decision to start his own business. He carefully planned every detail with strong determination to succeed. He believed in his ability to face any challenge. His friends supported him with valuable advice, which he appreciated deeply.","✅ Tổng kết điểm (theo phần):","Phần","Điểm / Tổng","Ghi chú","Chuyển từ loại","6/10","Cần luyện thêm","Chủ động / Bị động","7/9","Gần đạt yêu cầu","Tính từ / Trạng từ","4/8","Thiếu tự nhiên","Cấu trúc đồng nghĩa","4/7","Tốt nhưng cần chắc hơn","Viết lại đoạn văn","0/1","Cần luyện lại","📘 Gợi ý luyện tập thêm:","Làm thêm bài tập chuyển từ loại và viết lại câu tại các website như EnglishGrammar.org hoặc Perfect English Grammar."]},{"title":"Phần ôn tập 74 · Chủ đề du lịch → take off, check in, get on","items":["Viết lại đoạn văn mỗi ngày với 1 mục tiêu (viết ở thể bị động, thay từ loại, dùng trạng từ...)","✅ TỔNG QUAN NHỮNG GÌ BẠN ĐÃ HỌC ĐƯỢC","1. Chuyển đổi từ loại (Word formation)","Bạn đã hiểu được cách:","Chuyển từ danh từ → tính từ (e.g. confidence → confident)","Chuyển từ động từ → danh từ (e.g. complain → complaint)","Chuyển từ cụm danh từ → động từ miêu tả hành động (e.g. make an effort → try)","📌 Kỹ năng đạt được:","Biết phân biệt và áp dụng linh hoạt các loại từ trong câu.","Tăng khả năng paraphrase khi viết và nói tiếng Anh.","2. Chuyển đổi câu chủ động ↔ bị động (Active – Passive voice)","Bạn đã nắm rõ:","Công thức chuyển:\u000b S + V + O ⟶ O + be + V3 + by + S","Nhận diện và chuyển được cả ở các thì khác nhau (hiện tại, quá khứ, tương lai, hiện tại hoàn thành...)","📌 Kỹ năng đạt được:","Viết lại câu linh hoạt trong ngữ cảnh học thuật và giao tiếp.","Hiểu rõ hơn về vai trò của từng thành phần câu.","3. Chuyển đổi trạng từ và tính từ (Adjective ↔ Adverb)","Bạn đã biết cách:","Biến tính từ mô tả người thành trạng từ mô tả hành động:\u000b He is careful → He works carefully.","Hiểu sự khác biệt về vị trí và vai trò của tính từ và trạng từ trong câu.","📌 Kỹ năng đạt được:","Mô tả hành vi và tính cách chi tiết, chính xác hơn.","Giao tiếp rõ ràng và chuẩn hơn bằng tiếng Anh.","4. Thay đổi cấu trúc đồng nghĩa (Paraphrasing)","Bạn đã biết:","Dùng động từ thay cho cụm danh từ:\u000b give a call → call, have a look → look","Diễn đạt một ý với nhiều cấu trúc khác nhau.","📌 Kỹ năng đạt được:","Rèn luyện tư duy đa dạng khi nói và viết.","Chuẩn bị tốt hơn cho các kỹ năng viết luận và làm bài IELTS sau này.","5. Viết lại đoạn văn (Rewriting a paragraph)","Bạn đã tập:","Tổng hợp các kỹ năng trên để viết lại đoạn văn bằng phong cách khác (dùng thể bị động, thay từ loại, thay cấu trúc…).","Vẫn giữ được ý nghĩa gốc của đoạn văn.","📌 Kỹ năng đạt được:","Viết chuyên nghiệp hơn.","Tư duy tổ chức lại thông tin mạch lạc, rõ ràng.","Tổng hợp IPA: https://www.vocabulary.com/resources/ipa-pronunciation/","Link tự luyện IPA miễn phí:","PC: https://agendaweb.org/exercises/phonetic/transcription-animals.htm","Mobile: https://play.google.com/store/apps/details?id=one.nghicv.ipachart&pli=1"]},{"title":"Chủ đề động vật","items":["Chủ đề động vật","/ˈpærət/ : ‘Parrot: con vẹt","/sneɪk/ : Snake","/kaʊ/: Cow","/bɜːd/: Bird","/ˈmʌŋki/ : Monkey","/hɔːs/; Horse","/ˈpeŋɡwɪn/ Penguin","/ˈlaɪən/: Lion","/fɒks/: Fox","/biː/: Bee","/weɪl/: Whale","/ˈkrɒkədaɪl/: Crocodile"]},{"title":"CHỦ ĐỀ ĐỘNG VẬT 2","items":["CHỦ ĐỀ ĐỘNG VẬT 2","/ˈkæml/:","camel: con lạc đà","/ɡəˈrɪlə/","gorilla: con khỉ đột","/ˈiːɡl/","eagle: chim đại bàng","/maʊs/","mouse: con chuột","/ˈbiːtl/","beetle: bọ cánh cứng","/kæŋɡəˈruː/","kangaroo","/ˈɒktəpəs/","octopus","/ˈsiːɡʌl/","seagull: chim hải","/ˈbʌtəflaɪ/","butterfly","/ˈtɜːtl/","turtle","/ʃɑːk/","shark: cá mập","/məˈskiːtəʊ/","mosquito: con muỗi"]},{"title":"CHỦ ĐỀ FOOD","items":["CHỦ ĐỀ FOOD","/ˈæpl/","apple","/ˈɒrɪndʒ/","orange","/raɪs/","rice","/steɪk/","steak","/suːp/","soup","/ˈʃʊɡə(r)/","sugar","/fɪʃ/","fish","/ˈwɔːtə(r)/","water","/ɡreɪps/","grapes","/bred/","bread","/tʃiːz/","cheese","/ˈaɪs kriːm/","ice cream"]},{"title":"Chủ đề body","items":["Chủ đề body","/aɪz/","eyes","/nəʊz/","nose","/heə(r)/","hair","/ˈfɪŋgəz/","fingers","/ɪəz/","ears","/fiːt/","feet","/hænd/","hand","/tiːθ/","teeth","/ɑːm/","arm","/ˈelbəʊ/","elbow : khuỷu tay","/təʊz/","toes :  ngón","/maʊθ/","mouth"]},{"title":"Chủ đề clothes","items":["Chủ đề clothes","/ʃɜːt/","shirt: áo sơ mi","/ʃuːz/","shoes: giày","/hæt/","hat: nón, mũ","/ˈdʒʌmpə(r)/","jumper: áo len chui đầu","/glʌvz/","gloves: găng tay","/ˈdʒækɪt/","jacket: áo khoác ngắn","/buːts/","boots: ủng, giày cao cổ","/sɒks/","socks: tất/vớ","/dʒiːnz/","jeans: quần jean","/kəʊt/","coat: áo khoác dài","/dres/","dress: váy liền","/skɑːf/","scarf: khăn quàng cổ"]},{"title":"Chủ đề number and colours","items":["Chủ đề number and colours","/wʌn/","one","/ɡriːn/","green","/θriː/","three","/ˈjeləʊ/","yellow","/waɪt/","white","/ˈθɜːti/","thirty","/faɪv/","five","/blæk/","black","/braʊn/","brown","/sɪksˈtiːn/","sixteen","/ˈpɜːpl/","purple","/ˈnaɪnti/","ninety"]},{"title":"Chủ đề house and family","items":["Chủ đề house and family","/tʃeə(r)/","chair","/ˈmʌðə(r)/","mother","/ˈteɪbl/","table","/ˈkʌzn/","cousin: anh/em chị họ","/dɔː(r)/","door","/ˈbɑːθruːm/","bathroom","/ˈdɔːtə(r)/","daughter","/ˈbrʌðə(r)/","brother","/ˈɡɑːdn/","garden","/ˈkɪtʃɪn/","kitchen","/ˈʌŋkl/","uncle: chú , bác, cậu","/ˈwɪndəʊ/","window"]},{"title":"Chủ đề school","items":["Chủ đề school","/ˈtiːtʃə(r)/","teacher","/ˈruːlə(r)/","ruler","/bʊk/","book","/ˈɪŋɡlɪʃ/","english","/ˈstʌdi/","study","/raɪt/","write","/ˈlɪsn/","listen","/riːd/","read","/ˈrʌbə(r)/","rubber : cục tẩy","/ˈlaɪbrəri/","library","/ˈsɪzəz/","scissors: cái kéo","/ɡluː/","glue: keo dán","Có 3 cách chính:","Âm cuối của từ","Cách phát âm “s”","Ví dụ","Phiên âm","Âm vô thanh (p, t, k, f, θ)","/s/","cups, cats, books, laughs, months","/s/","Âm hữu thanh (b, d, g, v, l, m, n, r, nguyên âm...)","/z/","dogs, bags, plays, runs, pens","/z/","Âm kết thúc là s, z, ʃ, ʒ, tʃ, dʒ","/ɪz/ hoặc /əz/","buses, washes, watches, changes, scissors","/ɪz/","🔸 Ví dụ minh họa","cats /kæts/ → /s/ vì “t” là âm vô thanh","dogs /dɒɡz/ → /z/ vì “g” là âm hữu thanh","buses /ˈbʌsɪz/ → /ɪz/ vì kết thúc bằng /s/","watches /ˈwɒtʃɪz/ → /ɪz/ vì kết thúc bằng /tʃ/","scissors /ˈsɪzəz/ → có âm /zəz/ vì gốc từ scissor đã có /z/, nên thêm “s” thành âm /zəz/","👉 Tóm gọn mẹo nhớ:","🔹 Vô thanh → /s/\u000b 🔹 Hữu thanh → /z/\u000b 🔹 Kết thúc bằng s, z, sh, ch, j → /ɪz/"]},{"title":"Chủ đề cơ thể","items":["Chủ đề cơ thể","/aɪz/: eyes","/nəʊz/: nose","/heə(r)/: Hair","/ˈfɪŋgəz/: Fingers","/ɪəz/: ears","/fiːt/: Feet","/hænd/: Hand","/tiːθ/: Teeth","/ɑːm/: Arm","/ˈelbəʊ/: Elbow","/təʊz/: Toes","/maʊθ/: Mouth"]},{"title":"Chủ đề City","items":["Chủ đề City","/striːt/","school: con đường,con phố","/ˈsɪnəmə/","cinema","/ˈsuːpəmɑːkɪt/","supermarket","/həʊˈtel/","hotel","/tʃɜːtʃ/","church: nhà thờ","/ˈsteɪʃn/","station: ga tàu, trạm","/ˈeəpɔːt/","airport: sân","/skuːl/","school","/ˈhɒspɪtl/","hospital","/bæŋk/","bank","/ˈrestrɒnt/","restaurant","/kɑːz/","cars"]},{"title":"Chủ đề Nature","items":["Chủ đề Nature","/ˈrɪvə(r)/","River","/ˈflaʊəz/","flowers","/triːz/","trees","/klaʊdz/","clouds","/siː/","sea: biển","/ˈmaʊntən/","moutain","/sʌn/","sun","/ˈəʊʃn/","ocean: đại dương","/ˈreɪnbəʊ/","rainbow","/ˈaɪlənd/","people: hòn đào","/ˈænɪməlz/","animals","/ˈpiːpl/","people"]},{"title":"Chủ đề calendar","items":["Chủ đề calendar","/ˈeɪprəl/","april: tháng 4","/ˈsʌmə(r)/","summer","/ˈiːvnɪŋ/","evening","/ˈθɜːzdeɪ/","Thursday","/ɔːˈɡʌst/","August","/naɪt/","night: ban đêm","/sprɪŋ/","spring","/dʒuˈlaɪ/","July","/ˈwɪntə(r)/","winter","/ˈmɔːnɪŋ/","morning","/jɪə(r)/","year","/ˈsiːzn/","season"]},{"title":"Chủ đề adjectives","items":["Chủ đề adjectives","/kaɪnd/","kind","/ˈhæpi/","happy","/ˈdeɪndʒərəs/","dangerous","/ˈɔːfl/","awful: kinh khủng, tệ","/ˈleɪzi/","lazy","/jʌŋ/","young : trẻ","/ˈiːzi/","easy","/smɔːl/","small","/ˈʌɡli/","ugly: xấu xí","/ɡʊd/","good","/ˈhʌŋɡri/","hungry","/ˈtaɪəd/"]},{"title":"Chủ đề Daily activities","items":["Chủ đề Daily activities","/raɪd ə baɪk/: ride a bike","/pleɪ ðə ˌvaɪəˈlɪn/: play the violin","/riːd ə bʊk/ : read a book","/hæv ə ˈʃaʊə/: have a shower","/wɒʃ jə hændz/: wash your hands","/wɔːk ðə dɒg/: walk the dog","/meɪk ðə bed/: make the bed","/brʌʃ jə tiːθ/: brush your teeth"]},{"title":"Chủ đề câu ngắn 1","items":["Chủ đề câu ngắn 1","/aɪ lɪv ɪn speɪn/.","I live in Spain.","/haʊ əʊld ə jʊ/?","How old are you?","/ʃiː ɪz maɪ ˈsɪstə/.","She is my sister.","/duː jʊ spiːk ˈɪŋglɪʃ/?","Do you speak english?","/wi həv tuː dɒgz/.","We have two dogs.","/kæn jʊ draɪv ə kɑː/?","Can you drive a car?","/duː jʊ laɪk ˈfʊtbɔːl/?","Do you like football?"]},{"title":"Chủ đề câu ngắn 2","items":["Chủ đề câu ngắn 2","01. /maɪ neɪm ɪz ˈpiːtə/",".My name is Peter","02. /weə ɪz jə ˈpensl/ ?","Where is your pencil?","03. /hiː ɪz ˈsevn jɪəz əʊld/",".He is seven years old","04. /maɪ ˈfeɪvərɪt ˈkʌlə ɪz bluː/",".My favorite color is blue","05. /weə dʌz hiː lɪv/?","where does he live?","06. /ʃiː həz griːn ˈaɪz/",".she has green eyes","07. /aɪ ˈɔːlwəz get ʌp ˈɜːlɪ/","i always  get up early"]},{"title":"Chủ đề câu ngắn 3","items":["Chủ đề câu ngắn 3","01. /maɪ mʌm ˈnevə ˈdɑːnsɪz/",".My mom never dances","02. /ʃiː həz ɔːlˈredɪ əˈraɪvd/",".She has already arrived","03. /maɪ dæd ˈwɔːtəd ðə plɑːnts/",".My dad watered the plants","04. /hiː ˈsʌmtaɪmz kʊks lʌnʧ/",".He sometimes cooks lunch.","05. /ðə ˈbeɪbɪ wəz stɪl ˈsliːpɪŋ/",".The baby was still sleeping","06. /aɪ ʃəd iːt mɔː fruːt/",".I should eat more fruit","07. /ə jʊ ˈhæpɪ təˈdeɪ/?","Are you happy today?","🌱 CHỦ ĐỀ: My Day","(Từ A1 → B2 + bản song song Việt – Anh + ghi chú)","→ Lỗi & lý do:","Câu gốc","Lỗi","Giải thích & Cách sửa","Each day begin at 6 o’clock","❌ Sai chia động từ","Chủ ngữ “each day” là số ít → phải dùng begins","I gets up","❌ Sai chia động từ","“I” → luôn dùng get, không bao giờ “gets”","brush teeth","❌ Thiếu đại từ sở hữu","Phải là brush my teeth","have breakfast to my family","❌ Sai giới từ","Dùng with khi nói “ăn sáng cùng ai” → have breakfast with my family","drink a milk glass","❌ Sai trật tự danh từ","Phải nói a glass of milk","I have eaten yet","❌ Sai thì và vị trí","Nên nói After I eat / After eating. Không dùng “yet” ở đây.","I dress clothes","❌ Sai dùng động từ","“Dress” không đi với “clothes” → dùng get dressed","work at office","❌ Thiếu mạo từ","Cần có at the office","I feel happy because worked with...","❌ Sai thì","Phải là I work with (hiện tại)","nice coledge","❌ Sai chính tả","Đúng là colleagues","take a path","❌ Sai từ","“Path” = con đường. Phải là take a bath (tắm)","learn more english language about 30 minutes","❌ Trật tự từ","Đúng: learn English for about 30 minutes","My day simply flow but happiness","❌ Sai động từ & danh từ","Đúng: My day is simple but happy.","I feel interested because have a stable job","❌ Thiếu chủ ngữ","Đúng: I feel happy because I have...","everyday is peacefull day","❌ Sai chính tả","“peaceful” (1 chữ l) và thiếu mạo từ → a peaceful day","🟢 A1 – Cấp độ cơ bản (IELTS Life Skills A1 / CEFR A1)","My day begins at six o’clock in the morning. I get up, fold my blanket, brush my teeth, and wash my face. Then I have breakfast with my family. I eat bread or noodles and drink a glass of milk. After breakfast, I get dressed and go to work.","I work at the office from eight a.m. to five p.m. At lunch time, I eat rice and take a rest. My job is sometimes busy, but I am happy because I work with nice people.","After work, I go home, take a bath, and have dinner with my family. In the evening, I watch TV, read a book, or listen to music. I also study English for thirty minutes."]},{"title":"Phần ôn tập 92 · Chủ đề câu ngắn 3","items":["I go to bed at ten o’clock. My day is simple but happy. I feel good because I have a job, a family, and good health.","🟡 PHIÊN BẢN CHUẨN A2"]},{"title":"Topic: My Day","items":["Topic: My Day","Every day starts at six o’clock in the morning. I get up, fold my blanket, and wash my face. After that, I have breakfast with my family. We usually eat bread or noodles and drink milk. Then I get dressed and go to the office.","I work from eight in the morning until five in the afternoon. During lunch time, I eat rice and take a short nap. My job is sometimes busy, but I enjoy working with my friendly colleagues.","When I finish work, I go home, take a bath, and have dinner with my family. In the evening, I like watching TV, reading books, or listening to music. I also study English for about thirty minutes every day.","I go to bed at ten o’clock. My day is quite simple, but I feel happy because I have a good job, a loving family, and good health. I hope every day will be peaceful like this.","✅ Đặc điểm A2:","Dùng thêm từ nối (“after that”, “during”, “when I finish work”).","Câu mạch lạc hơn, tự nhiên hơn.","Có dùng tính từ mở rộng (“friendly colleagues”, “loving family”).","🔵 PHIÊN BẢN CHUẨN B1"]},{"title":"Topic: My Typical Day","items":["Topic: My Typical Day","My day usually begins at six o’clock in the morning. I get up, make my bed, and wash my face to feel fresh. Then I have breakfast with my family. We often eat bread or noodles and drink a glass of milk or juice. After breakfast, I get dressed and go to work.","I work in an office from eight in the morning to five in the afternoon. My job can be quite busy, but it’s also interesting because I work with friendly and helpful colleagues. During lunch time, I eat rice, talk with my coworkers, and take a short break to relax.","After work, I go home, take a shower, and have dinner with my family. In the evening, I like watching TV, reading books, or listening to music. I also study English for about half an hour to improve my skills.","I usually go to bed at ten o’clock. My daily routine is simple, but it makes me feel happy and relaxed. I’m grateful for my job, my family, and my health. I hope each day will be as peaceful as this.","✅ Đặc điểm B1:","Dùng thì hiện tại đơn đúng & linh hoạt.","Từ nối phong phú hơn (“to feel fresh”, “because”, “but it’s also interesting”, “to improve my skills”).","Có cảm xúc & chi tiết hơn (“grateful”, “helpful colleagues”).","🔴 B2 – Trung cấp cao (CEFR B2 / IELTS 5.5–6.0)","English:\u000b My typical day usually begins around six o’clock in the morning. After waking up, I make my bed, wash my face, and brush my teeth to get ready for the day. I like to start my morning with a light breakfast, usually bread or noodles and a glass of milk. While having breakfast, I often talk with my family about our plans for the day.","I work in an office from eight a.m. to five p.m. My job can be quite demanding at times, but I enjoy it because it allows me to learn new things and work with supportive colleagues. During the lunch break, I usually have rice and some vegetables, then take a short nap or read the news online.","After finishing work, I go home, take a relaxing shower, and have dinner with my family. In the evening, I like to unwind by watching TV, reading books, or listening to music. I also spend about half an hour studying English to improve my communication skills.","Before going to bed at around ten, I often reflect on my day and make a small plan for tomorrow. Even though my routine is simple, it brings me balance and happiness.","Ghi chú B2:","Dùng cụm từ tự nhiên & cao cấp hơn: to get ready for the day, talk about our plans, quite demanding, allows me to, unwind, reflect on my day, bring balance.","Biết kết nối ý mượt mà bằng liên từ và trạng ngữ.","Biết bộc lộ cảm xúc & suy nghĩ cá nhân.","📘 TÓM TẮT CẤP ĐỘ NGỮ PHÁP & TỪ VỰNG","Cấp độ","Đặc điểm chính","Ví dụ tiêu biểu","A1","Câu ngắn, cấu trúc đơn giản, từ cơ bản","I get up. I go to work. I eat rice.","A2","Có từ nối, câu dài hơn một chút","After that, I have breakfast. My job is sometimes busy.","B1","Biểu cảm nhẹ, dùng tính từ & cụm mục đích","I’m grateful for my job. I study to improve my skills.","B2","Tự nhiên, mô tả chi tiết, có suy nghĩ cá nhân","I reflect on my day. My job allows me to learn new things.","DAY 2: TOPIC: MY FAMILY","🏠 Chủ đề: Gia đình của tôi (My Family)","Gia đình tôi có bốn người: ba tôi, mẹ tôi, em gái tôi và tôi. Ba tôi là một người hiền lành và chăm chỉ. Ông làm việc ở công ty điện lực trong thành phố. Mỗi sáng, ba tôi dậy sớm để tập thể dục và uống cà phê trước khi đi làm.","Mẹ tôi là giáo viên tiểu học. Mẹ rất dịu dàng và luôn quan tâm đến mọi người trong nhà. Buổi sáng, mẹ chuẩn bị bữa sáng cho cả gia đình, còn buổi tối mẹ nấu bữa ăn rất ngon. Tôi thích nhất là món canh chua và thịt kho của mẹ.","Em gái tôi năm nay mười tuổi. Em học lớp năm ở trường gần nhà. Em rất năng động, thích vẽ tranh và xem phim hoạt hình. Tôi thường giúp em làm bài tập Toán và Tiếng Anh.","Cuối tuần, cả nhà tôi thường cùng nhau đi siêu thị hoặc công viên. Thỉnh thoảng, chúng tôi xem phim hoặc đi ăn kem. Mỗi khi ở bên gia đình, tôi luôn cảm thấy vui và ấm áp. Dù bận rộn với công việc hay học tập, tôi luôn cố gắng dành thời gian cho gia đình mình, vì với tôi, gia đình là nơi hạnh phúc nhất.","🧩 PHẦN 1: CHẤM CHI TIẾT TỪNG CÂU (A1)","Mình chấm theo 5 tiêu chí: ngữ pháp – từ vựng – trật tự từ – chính tả – diễn đạt.","🩷 Câu 1:","My family have 4 people: my dad, my mom, my young sister and me.","❌ Lỗi:","“family” là danh từ số ít → phải dùng has, không phải “have”.","“young sister” sai → phải là younger sister.","Số nhỏ hơn 10 nên viết bằng chữ: four.","✅ Sửa:\u000b 👉 My family has four people: my dad, my mom, my younger sister, and me.","💛 Câu 2:","My dad is nice person and work harder.","❌ Lỗi:","Thiếu mạo từ “a” → a nice person.","“work harder” sai thì và sai ngữ pháp. Nên dùng works hard (hard = chăm chỉ).","✅ Sửa:\u000b 👉 My dad is a nice person and works hard.","💚 Câu 3:","he is work at electric company in city.","❌ Lỗi:","Câu bắt đầu phải viết hoa “He”.","“is work” sai — chỉ dùng works thôi (vì “is” không đi với động từ nguyên mẫu).","“electric company” đúng nhưng thiếu mạo từ và giới từ.","“in city” sai → phải là in the city.","✅ Sửa:\u000b 👉 He works at an electric company in the city.","💙 Câu 4:","Every morning, my dad usualy wakes up early to work out and drinks coffee before go to work.","❌ Lỗi:","“usualy” sai chính tả → usually.","“drinks coffee before go to work” → nên dùng before going to work (sau “before” + V-ing).","✅ Sửa:\u000b 👉 Every morning, my dad usually wakes up early to work out and drinks coffee before going to work.","🧡 Câu 5:"]},{"title":"Phần ôn tập 95 · Topic: My Typical Day","items":["My mom is a primary school techer.","❌ Lỗi:","“techer” sai chính tả → teacher.","✅ Sửa:\u000b 👉 My mom is a primary school teacher.","💜 Câu 6:","She is very gentle and always take care about everyone in the house.","❌ Lỗi:","“take” → phải chia là takes.","Không dùng “care about” trong nghĩa “chăm sóc” → phải là takes care of.","✅ Sửa:\u000b 👉 She is very gentle and always takes care of everyone in the house.","🩵 Câu 7:","In the morning, she prepares breakfast for the whole famil.","❌ Lỗi:","“famil” sai chính tả → family.","✅ Sửa:\u000b 👉 In the morning, she prepares breakfast for the whole family.","💚 Câu 8:","In the evening, my mom cooks very delicious meals. My favorite dishes are my mother's sour soup and braised meat.","✅ Tốt!\u000b – Cấu trúc đúng, ngữ pháp ổn, tự nhiên với trình độ A1–A2.","💙 Câu 9:","My daughter is ten years old this year.","❌ Lỗi logic:\u000b → “Daughter” nghĩa là con gái của bạn, nhưng ở đoạn trên bạn nói “my younger sister”.\u000b => Phải là My younger sister.","✅ Sửa:\u000b 👉 My younger sister is ten years old this year.","🩷 Câu 10:","She is in the fifth grade at a school near our house. She is very energetic, likes drawing and watching cartoon.","❌ Lỗi:","“watching cartoon” → phải là watching cartoons (số nhiều).","✅ Sửa:\u000b 👉 She is in the fifth grade at a school near our house. She is very energetic and likes drawing and watching cartoons.","💛 Câu 11:","I often help her to do math and english homework.","❌ Lỗi:","“english” phải viết hoa: English.","Có thể lược “to” cho tự nhiên hơn.","✅ Sửa:\u000b 👉 I often help her do math and English homework.","💚 Câu 12:","in the weekend, my whole family usualy go to the supermarket and park together.","❌ Lỗi:","Viết hoa đầu câu.","“in the weekend” sai → đúng là on the weekend.","“usualy” sai chính tả → usually.","“go” → phải chia “goes” vì chủ ngữ “my whole family” là số ít.","✅ Sửa:\u000b 👉 On the weekend, my whole family usually goes to the supermarket or the park together.","💙 Câu 13:","Sometimes, we go to the cinema and ice cream.","❌ Lỗi:","“and ice cream” không đúng cấu trúc → nên nói and eat ice cream.","✅ Sửa:\u000b 👉 Sometimes, we go to the cinema and eat ice cream.","💜 Câu 14:","whenever, i am with my family, i always feel happy and warm.","❌ Lỗi:","“whenever” không cần dấu phẩy.","“i” phải viết hoa: I.","✅ Sửa:\u000b 👉 Whenever I am with my family, I always feel happy and warm.","🩵 Câu 15:","Despite being busy with work or study, i always try to spend time for my family, because for me, family is the happiest place.","❌ Lỗi:","“spend time for” sai → đúng là spend time with.","Viết hoa “I”.","✅ Sửa:\u000b 👉 Despite being busy with work or study, I always try to spend time with my family because, for me, family is the happiest place.","✅ PHIÊN BẢN HOÀN CHỈNH – CẤP ĐỘ A1 CHUẨN IELTS LIFE SKILLS","My Family","My family has four people: my dad, my mom, my younger sister, and me. My dad is a nice person and works hard. He works at an electric company in the city. Every morning, my dad usually wakes up early to work out and drinks coffee before going to work.","My mom is a primary school teacher. She is very gentle and always takes care of everyone in the house. In the morning, she prepares breakfast for the whole family. In the evening, my mom cooks very delicious meals. My favorite dishes are my mother’s sour soup and braised meat.","My younger sister is ten years old. She is in the fifth grade at a school near our house. She is very energetic and likes drawing and watching cartoons. I often help her do math and English homework.","On the weekend, my whole family usually goes to the supermarket or the park together. Sometimes, we go to the cinema and eat ice cream. Whenever I am with my family, I feel happy and warm. Despite being busy with work or study, I always try to spend time with my family because, for me, family is the happiest place.","🟡 PHIÊN BẢN A2 – MỞ RỘNG HƠN","My Family","There are four people in my family: my dad, my mom, my younger sister, and me. My dad is a kind and hardworking man. He works at an electric company in the city. Every morning, he gets up early to exercise and drink coffee before going to work.","My mom is a primary school teacher. She is gentle and always takes good care of everyone at home. She makes breakfast in the morning and cooks delicious dinners in the evening. My favorite dishes are her sour soup and braised pork.","My younger sister is ten years old. She studies in the fifth grade at a school near our house. She is very active and likes drawing and watching cartoons. I often help her with math and English homework.","On weekends, my family often goes to the supermarket or the park together. Sometimes, we go to the cinema or eat ice cream. When I am with my family, I feel happy and warm. Even though I am busy with work or study, I always try to spend time with them because my family is my happiest place."]},{"title":"Phần ôn tập 96 · Topic: My Typical Day","items":["✅ Đặc điểm A2:","Từ nối mượt hơn (even though, together, in the evening).","Thêm tính từ mô tả (kind, hardworking, active).","Câu rõ ràng, tự nhiên hơn.","🔵 PHIÊN BẢN B1 – TRUNG CẤP","My Family","I come from a small and loving family of four: my father, my mother, my younger sister, and me. My father is a kind and hardworking man. He works for an electric company in the city. Every morning, he wakes up early to exercise and enjoys a cup of coffee before going to work.","My mother is a primary school teacher. She is gentle, patient, and caring. She prepares breakfast every morning and cooks delicious dinners in the evening. I really love her sour soup and braised pork.","My younger sister is ten years old and studies in the fifth grade. She is full of energy and enjoys drawing and watching cartoons. I often help her with her math and English homework after school.","On weekends, my family likes going out together. We often visit the supermarket, walk in the park, or watch a movie at the cinema. Sometimes, we enjoy ice cream after dinner. Although we are all busy with work and study, we always try to spend quality time together. For me, my family is the warmest and happiest place in the world.","✅ Đặc điểm B1:","Câu phức có liên từ (although, after, because).","Từ vựng đa dạng hơn (patient, caring, full of energy, quality time).","Cảm xúc tự nhiên, giống bài nói hoặc viết trong IELTS 5.0–5.5.","🏡 Chủ đề: Ngôi nhà của tôi (My House / My Room)","(khoảng 280 từ – dễ hiểu, sát thực tế)","Tôi sống trong một ngôi nhà nhỏ cùng với gia đình. Ngôi nhà của tôi có hai tầng và được sơn màu trắng. Ở tầng trệt, có một phòng khách, một nhà bếp và một phòng tắm. Phòng khách có một bộ ghế sofa, một cái bàn và một chiếc tivi lớn. Mỗi buổi tối, cả nhà tôi thường ngồi ở đó xem phim hoặc nói chuyện cùng nhau.","Nhà bếp là nơi mẹ tôi nấu ăn. Trong bếp có tủ lạnh, bếp ga và bàn ăn. Tôi thích phụ mẹ nấu ăn vào cuối tuần. Mùi thức ăn luôn làm cho căn nhà trở nên ấm cúng và dễ chịu.","Trên tầng hai là phòng ngủ của ba mẹ tôi, phòng của em gái tôi và phòng của tôi. Phòng của tôi nhỏ nhưng rất gọn gàng. Trong phòng có một cái giường, một bàn học, và một tủ quần áo. Tôi còn có một chậu cây nhỏ đặt cạnh cửa sổ. Mỗi sáng, tôi mở cửa sổ để đón ánh sáng và không khí trong lành.","Tôi yêu ngôi nhà của mình vì đó là nơi tôi cảm thấy an toàn và hạnh phúc. Dù đi đâu xa, tôi vẫn muốn trở về nhà, nơi có gia đình và nhiều kỷ niệm đẹp.","✅ Nhiệm vụ của bạn:\u000b Dịch đoạn này sang tiếng Anh trình độ A1, thật tự nhiên, ngắn gọn, và đúng ngữ pháp cơ bản nhất.\u000b Sau khi bạn gửi bản dịch, mình sẽ:","Chấm chi tiết từng lỗi (ngữ pháp, từ vựng, cấu trúc)","Giải thích lý do sai","Viết lại cho bạn bản đúng chuẩn A1 – A2 – B1","I live in a small house with my family. My house has two floors. On the ground floor, there is a living room, a kitchen, and a bathroom. The living room has a sofa, a table, and a big TV. Every night, my family sits there to watch movies or talk together.","The kitchen is where my mom cooks. There is a fridge, a gas stove, and a dining table. I like to help my mom cook on weekends. The smell of food makes the house warm and nice.","On the second floor, there are three bedrooms: my parents’ room, my sister’s room, and my room. My room is small but clean. I have a bed, a desk, and a wardrobe. I also have a small plant near the window. Every morning, I open the window for fresh air.","I love my house. It is my safe and happy place","Phiên bản nâng lên A2 (Band 3.5–4.0)","I live in a small, comfortable house with my family. It has two floors and is painted white. On the ground floor, we have a living room, a kitchen, and a bathroom. The living room has a sofa, a table, and a large TV where my family usually sits together to watch movies or talk in the evening.","The kitchen is my mom’s favorite place because she loves cooking. It has a fridge, a gas stove, and a dining table. I often help her prepare food on weekends. The smell of her cooking always makes the house feel warm and cozy.","Upstairs, there are three bedrooms. My room is small but tidy. It has a bed, a desk, and a wardrobe. I also keep a small plant near the window to make the room look fresh. Every morning, I open the window to let sunlight and fresh air in.","I really love my house because it is full of love and memories.","Phiên bản nâng lên B1 (Band 5.0–6.0)","I live in a small but lovely house with my family. It has two floors and is painted white. On the ground floor, there is a cozy living room, a kitchen, and a bathroom. In the evening, my family and I often sit in the living room to watch movies or chat together.","The kitchen is bright and modern. It has all the things we need, like a refrigerator, a gas stove, and a dining table. My mom is a great cook, and I often help her on weekends. The delicious smell of food makes our home feel warm and welcoming.","Upstairs, there are three bedrooms. My room is small, but I love it because it is tidy and peaceful. There is a bed, a desk, a wardrobe, and a little green plant by the window. Every morning, I open the window to enjoy the sunlight and fresh air.","I love my house very much because it’s not only a place to live but also where I feel safe, relaxed, and close to my family.","🩷"]},{"title":"Chủ đề: Sở thích sau giờ làm (My Hobbies After Work)","items":["Chủ đề: Sở thích sau giờ làm (My Hobbies After Work)","Sau giờ làm, tôi thường dành thời gian để thư giãn và làm những việc mình yêu thích. Tôi thường đi tập ở Cali Gym cùng với người yêu. Chúng tôi chơi cầu lông, tập gym và đôi khi cùng nhau xông hơi. Sau khi tập xong, tôi cảm thấy cơ thể khỏe khoắn hơn và tinh thần cũng thoải mái hơn.","Buổi tối khi về nhà, tôi thích nghe nhạc và học tiếng Anh. Âm nhạc giúp tôi giảm căng thẳng sau một ngày làm việc. Tôi thường nghe những bài hát nhẹ nhàng hoặc nhạc không lời để dễ tập trung. Ngoài ra, tôi dành khoảng một giờ mỗi tối để học tiếng Anh vì tôi muốn đạt chứng chỉ IELTS và có cơ hội du học Đức trong tương lai.","Những sở thích này giúp tôi cân bằng cuộc sống giữa công việc và bản thân. Nhờ đó, tôi cảm thấy vui vẻ, yêu đời và có thêm năng lượng cho ngày mới."]}]}</script><script>const {days,groups}=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);let s={};try{s=JSON.parse(localStorage.getItem('dailyEnglish30v1')||'{}')}catch(e){}let day=Math.max(0,Math.min(29,Number(s.current)||0));const save=()=>{s.current=day;try{localStorage.setItem('dailyEnglish30v1',JSON.stringify(s))}catch(e){}};const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=x=>x.toLowerCase().trim().replace(/[.!?,]/g,'').replace(/[’]/g,"'").replace(/\s+/g,' ');function speak(t,rate){if(!window.speechSynthesis){alert('Trình duyệt không hỗ trợ giọng đọc');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=rate;speechSynthesis.speak(u)}const names=['Grammar','Vocabulary','Listening','Speaking','Reading & Writing','Review'];function complete(i){return names.every((_,j)=>s[i]?.checks?.[j])}function nav(){const count=days.filter((_,i)=>complete(i)).length;$('bar').value=count;$('stat').textContent=count+'/30 ngày hoàn thành';$('nav').innerHTML=days.map((d,i)=>'<button data-day="'+i+'" class="'+(i===day?'active':'')+'">'+(complete(i)?'✓ ':'○ ')+(i+1)+'. '+esc(d.title)+'</button>').join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{day=+b.dataset.day;render()})}function task(i,title,body){return '<div class="task"><h3>'+title+'</h3>'+body+'<hr><label><input type="checkbox" data-check="'+i+'" '+(s[day]?.checks?.[i]?'checked':'')+'> Đã thực hành xong</label></div>'}function quiz(key,prompt,answer){return '<p>'+esc(prompt)+'</p><input type="text" data-input="'+key+'" placeholder="Nhập đáp án" value="'+esc(s[day]?.inputs?.[key]||'')+'"><button data-test="'+key+'" data-answer="'+esc(answer)+'">Kiểm tra</button><span id="f'+key+'" role="status"></span>'}function render(){let d=days[day];const examples=d.sentences.map(([en,vi],i)=>'<div class="example"><b>'+esc(en)+'</b><br>'+esc(vi)+'<br><button data-say="'+i+'">▶ Nghe</button></div>').join('');const reading=d.sentences.map(x=>x[0]).join(' ');let html='<div class="muted">DAY '+(day+1)+' / 30 · 60 phút chính + tài liệu mở rộng tùy chọn</div><h2>'+esc(d.title)+'</h2>'+task(0,'01 · Grammar — 10 phút','<p>'+esc(d.rule)+'</p>'+examples+quiz('grammar',d.quiz[0],d.quiz[1]))+task(1,'02 · Vocabulary — 10 phút','<p>Đọc 3 câu mẫu, ghi lại ít nhất 5 từ hoặc cụm từ hữu ích. Che nghĩa và tự nhớ lại.</p>'+examples+'<textarea data-note="vocab" placeholder="Từ / nghĩa / câu của riêng bạn"></textarea>')+task(2,'03 · Listening & Shadowing — 15 phút',d.sentences.map(([en,vi],i)=>'<div><button data-say="'+i+'">▶ Câu '+(i+1)+'</button> <button data-slow="'+i+'">Nghe chậm</button>'+quiz('listen'+i,'Gõ lại câu vừa nghe',en)+'<details><summary>Transcript</summary>'+esc(en)+' — '+esc(vi)+'</details></div>').join('')+'<p>Nghe và nhắc lại từng câu 3 lần.</p>')+task(3,'04 · Speaking — 10 phút','<p><b>'+esc(d.speaking)+'</b></p><p>Trả lời thành 3–5 câu: ý chính → chi tiết → lý do. Nói trước, sau đó ghi lại câu của mình.</p><textarea data-note="speaking" placeholder="Bài nói của bạn"></textarea>')+task(4,'05 · Reading & Writing — 10 phút','<details><summary>Đọc đoạn tiếng Anh và xác định S, V</summary><p>'+esc(reading)+'</p></details>'+d.sentences.map(([en,vi],i)=>quiz('write'+i,vi,en)).join('')+'<p>Viết thêm 2 câu về cuộc sống của bạn.</p><textarea data-note="writing" placeholder="Hai câu mới"></textarea>')+task(5,'06 · Review — 5 phút','<p>Tự nhắc lại quy tắc, nói một câu không nhìn mẫu và ghi lỗi cần sửa.</p><textarea data-note="review" placeholder="Lỗi sai / cách sửa"></textarea>')+'<h3>Ôn thêm từ tài liệu gốc</h3><p class="muted">Các phần liên quan được gắn bên dưới. Một số phần dài hoặc nâng cao: chia nhỏ khi học, không bắt buộc hoàn thành trong 60 phút.</p>'+d.sources.map(n=>'<details><summary>Phần '+n+' · '+esc(groups[n-1].title)+' ('+groups[n-1].items.length+' đoạn)</summary><pre>'+esc(groups[n-1].items.join('\n\n'))+'</pre></details>').join('');$('day').innerHTML=html;$('day').querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{s[day]??={};s[day].checks??={};s[day].checks[e.dataset.check]=e.checked;save();nav()});$('day').querySelectorAll('[data-note]').forEach(e=>{e.value=s[day]?.notes?.[e.dataset.note]||'';e.oninput=()=>{s[day]??={};s[day].notes??={};s[day].notes[e.dataset.note]=e.value;save()}});$('day').querySelectorAll('[data-input]').forEach(e=>e.oninput=()=>{s[day]??={};s[day].inputs??={};s[day].inputs[e.dataset.input]=e.value;save()});$('day').querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>{let k=b.dataset.test,v=$('day').querySelector('[data-input="'+k+'"]').value,ok=norm(v)===norm(b.dataset.answer),f=$('f'+k);f.className=ok?'ok':'bad';f.textContent=ok?' ✓ Chính xác':' Chưa khớp mẫu: '+b.dataset.answer+(k.startsWith('write')?' (cách dịch khác có thể vẫn đúng)':'')});$('day').querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(d.sentences[+b.dataset.say][0],.9));$('day').querySelectorAll('[data-slow]').forEach(b=>b.onclick=()=>speak(d.sentences[+b.dataset.slow][0],.65));$('prev').disabled=day===0;$('next').disabled=day===29;save();nav()}$('prev').onclick=()=>{if(day>0){day--;render();scrollTo(0,0)}};$('next').onclick=()=>{if(day<29){day++;render();scrollTo(0,0)}};$('resume').onclick=()=>{let i=days.findIndex((_,i)=>!complete(i));day=i<0?29:i;render()};render()</script></body></html>
