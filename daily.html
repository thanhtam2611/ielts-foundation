<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily English • 30 ngày</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#203a52;font:16px/1.6 system-ui}header{background:#203a52;color:white;padding:25px 5%}header a{color:#d0eded}main{max-width:1200px;margin:auto;display:grid;grid-template-columns:260px 1fr;gap:20px;padding:20px}aside,section{background:white;border:1px solid #dce5ea;border-radius:14px;padding:20px}aside{align-self:start;position:sticky;top:12px}h1,h2,h3{line-height:1.25}button,input,textarea,select{font:inherit;border:1px solid #ccd8df;border-radius:8px;padding:8px 12px}button{background:white;color:#203a52;cursor:pointer}button:hover,.active{background:#dff0ed}nav{max-height:65vh;overflow:auto}nav button{width:100%;text-align:left;margin:3px 0;font-size:14px}input[type=text],textarea{width:100%;margin:6px 0}textarea{min-height:80px}progress{width:100%;accent-color:#226d70}.task{border:1px solid #e0e9ed;border-radius:12px;padding:16px;margin:14px 0}.example{background:#eef6f5;padding:12px;border-radius:8px;margin:8px 0}.muted{color:#64748b;font-size:14px}.primary{background:#226d70;color:white}.ok{color:#13734b}.bad{color:#a33b28}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}details{margin:10px 0}label{cursor:pointer} @media(max-width:750px){main{grid-template-columns:1fr;padding:10px}aside{position:static}nav{max-height:180px}}</style></head><body><header><a href="./index.html">← Trang chủ</a> · <a href="./library.html">Thư viện đầy đủ</a><h1>Daily English · 30 ngày thực hành</h1><div>Học ít mỗi ngày, nói và viết được câu thực tế.</div></header><main><aside><strong>Tiến độ thực hành</strong><progress id="bar" max="30"></progress><div id="stat"></div><button id="resume" class="primary">Tiếp tục bài chưa hoàn thành</button><p class="muted">Chọn ngày học</p><nav id="nav"></nav></aside><section><div id="day"></div><div><button id="prev">← Ngày trước</button> <button id="next">Ngày tiếp →</button></div></section></main><script id="data" type="application/json">{"days":[{"title":"Giới thiệu bản thân","rule":"S + be + danh từ/tính từ","sentences":[["I am a student.","Tôi là sinh viên."],["I am from Vietnam.","Tôi đến từ Việt Nam."],["My name is Anna.","Tên tôi là Anna."]],"quiz":["I ___ from Vietnam.","am"],"speaking":"What is your name? Where are you from?","sources":[89,90]},{"title":"Một ngày của tôi","rule":"S + V + O; hiện tại đơn diễn tả thói quen","sentences":[["I get up at six.","Tôi thức dậy lúc sáu giờ."],["I study English every day.","Tôi học tiếng Anh mỗi ngày."],["I go to bed early.","Tôi đi ngủ sớm."]],"quiz":["I ___ English every day. (study)","study"],"speaking":"What do you do in the morning?","sources":[88,93]},{"title":"Công việc","rule":"He/she + V-s/es; I work as + nghề nghiệp","sentences":[["I work as an assistant.","Tôi làm trợ lý."],["She answers calls.","Cô ấy trả lời cuộc gọi."],["He works in an office.","Anh ấy làm việc trong văn phòng."]],"quiz":["She ___ calls. (answer)","answers"],"speaking":"What do you do? What do you like about your job?","sources":[6,12]},{"title":"Gia đình","rule":"my/your/her + danh từ; have/has","sentences":[["I live with my family.","Tôi sống cùng gia đình."],["My mother has a job.","Mẹ tôi có công việc."],["We eat dinner together.","Chúng tôi ăn tối cùng nhau."]],"quiz":["My sister ___ a bike. (have)","has"],"speaking":"Who do you live with?","sources":[45,81,95]},{"title":"Nhà và phòng","rule":"There is + số ít; There are + số nhiều","sentences":[["There is a desk in my room.","Có một bàn học trong phòng tôi."],["There are two chairs.","Có hai chiếc ghế."],["My room is tidy.","Phòng tôi gọn gàng."]],"quiz":["There ___ two chairs.","are"],"speaking":"Describe your room in four sentences.","sources":[96]},{"title":"Đồ ăn","rule":"a/an theo âm đầu; danh từ đếm được và không đếm được","sentences":[["I eat an apple for breakfast.","Tôi ăn một quả táo vào bữa sáng."],["I drink water every day.","Tôi uống nước mỗi ngày."],["I like rice and fish.","Tôi thích cơm và cá."]],"quiz":["I eat ___ apple.","an"],"speaking":"What do you usually eat for breakfast?","sources":[77,19,20]},{"title":"Ôn tuần 1","rule":"Kiểm tra be, have, SVO và hiện tại đơn","sentences":[["I am tired after work.","Tôi mệt sau giờ làm."],["My friend works nearby.","Bạn tôi làm việc gần đây."],["There is a fridge in the kitchen.","Có tủ lạnh trong bếp."]],"quiz":["He ___ tired. (be)","is"],"speaking":"Talk about yourself, your job and your home.","sources":[91,92]},{"title":"Lịch và thời gian","rule":"at + giờ; on + ngày; in + tháng/năm","sentences":[["I start work at seven.","Tôi bắt đầu làm lúc bảy giờ."],["I study on Monday.","Tôi học vào thứ Hai."],["My birthday is in November.","Sinh nhật tôi vào tháng Mười Một."]],"quiz":["I start work ___ seven.","at"],"speaking":"When do you study English?","sources":[13,14,86]},{"title":"Thành phố và đường đi","rule":"in/on/next to/opposite + địa điểm","sentences":[["The bank is next to the shop.","Ngân hàng bên cạnh cửa hàng."],["The café is opposite the park.","Quán cà phê đối diện công viên."],["I live in a busy city.","Tôi sống ở một thành phố nhộn nhịp."]],"quiz":["The bank is ___ to the shop.","next"],"speaking":"How do you get to work?","sources":[15,16,84]},{"title":"Mua sắm","rule":"this/that/these/those; số và màu sắc","sentences":[["This shirt is blue.","Áo sơ mi này màu xanh."],["Those shoes are expensive.","Những đôi giày kia đắt."],["I need two white shirts.","Tôi cần hai áo sơ mi trắng."]],"quiz":["___ shoes are expensive. (ở xa, số nhiều)","those"],"speaking":"What clothes do you usually wear?","sources":[79,80]},{"title":"Học tập","rule":"Do/does + S + V?; don't/doesn't + V","sentences":[["Do you study every day?","Bạn học mỗi ngày không?"],["She does not like maths.","Cô ấy không thích toán."],["I learn new words at home.","Tôi học từ mới ở nhà."]],"quiz":["Does she ___ English? (study)","study"],"speaking":"Why are you learning English?","sources":[35,36,37,38,82]},{"title":"Sức khỏe","rule":"should + V; feel + tính từ","sentences":[["I feel tired today.","Hôm nay tôi thấy mệt."],["You should drink more water.","Bạn nên uống nhiều nước hơn."],["I exercise three times a week.","Tôi tập thể dục ba lần mỗi tuần."]],"quiz":["You should ___ early. (sleep)","sleep"],"speaking":"What do you do to stay healthy?","sources":[78,83]},{"title":"Sở thích","rule":"like/enjoy + V-ing; want + to V","sentences":[["I enjoy listening to music.","Tôi thích nghe nhạc."],["I like playing badminton.","Tôi thích chơi cầu lông."],["I want to improve my English.","Tôi muốn cải thiện tiếng Anh."]],"quiz":["I enjoy ___ music. (listen to)","listening to"],"speaking":"What do you do after work?","sources":[64,65,66,97]},{"title":"Ôn tuần 2","rule":"Câu hỏi, phủ định và giới từ","sentences":[["I do not work on Sunday.","Tôi không làm việc vào Chủ nhật."],["Do you like coffee?","Bạn thích cà phê không?"],["The shop is near my house.","Cửa hàng gần nhà tôi."]],"quiz":["She does not ___ coffee. (drink)","drink"],"speaking":"Describe your weekly schedule.","sources":[17,18]},{"title":"Hôm qua","rule":"Past simple: V-ed hoặc động từ bất quy tắc","sentences":[["I went to work yesterday.","Hôm qua tôi đi làm."],["I cooked dinner last night.","Tối qua tôi nấu bữa tối."],["I saw my friend on Sunday.","Tôi gặp bạn vào Chủ nhật."]],"quiz":["I ___ to work yesterday. (go)","went"],"speaking":"What did you do yesterday?","sources":[28]},{"title":"Đang làm gì","rule":"am/is/are + V-ing","sentences":[["I am studying English now.","Tôi đang học tiếng Anh."],["She is cooking dinner.","Cô ấy đang nấu bữa tối."],["They are waiting for the bus.","Họ đang chờ xe buýt."]],"quiz":["She is ___ dinner. (cook)","cooking"],"speaking":"What are you doing now?","sources":[24,25]},{"title":"Trải nghiệm","rule":"have/has + V3; since/for","sentences":[["I have lived here for two years.","Tôi đã sống ở đây hai năm."],["She has finished her homework.","Cô ấy đã làm xong bài tập."],["I have never visited Germany.","Tôi chưa từng đến Đức."]],"quiz":["She has ___ her homework. (finish)","finished"],"speaking":"Have you ever travelled abroad?","sources":[29,30,31,32]},{"title":"Kế hoạch","rule":"be going to + V; will + V","sentences":[["I am going to study tonight.","Tôi dự định học tối nay."],["I will call you tomorrow.","Tôi sẽ gọi bạn ngày mai."],["We are going to visit a museum.","Chúng tôi dự định thăm bảo tàng."]],"quiz":["I will ___ you tomorrow. (call)","call"],"speaking":"What are your plans for next year?","sources":[33,34]},{"title":"Quê hương","rule":"So sánh hơn: adj-er/more adj + than","sentences":[["My hometown is quieter than the city.","Quê tôi yên tĩnh hơn thành phố."],["The city is more crowded.","Thành phố đông đúc hơn."],["I prefer my hometown.","Tôi thích quê mình hơn."]],"quiz":["My room is ___ than yours. (small)","smaller"],"speaking":"Where do you come from?","sources":[21,22,23,26,27]},{"title":"Tự nhiên và động vật","rule":"So sánh nhất: the + adj-est/most adj","sentences":[["The river is beautiful.","Dòng sông đẹp."],["An elephant is bigger than a dog.","Voi lớn hơn chó."],["This is the tallest tree here.","Đây là cây cao nhất ở đây."]],"quiz":["This is the ___ tree. (tall)","tallest"],"speaking":"Do you like spending time in nature?","sources":[75,76,85]},{"title":"Ôn tuần 3","rule":"Ôn các thì và so sánh","sentences":[["I studied yesterday.","Tôi đã học hôm qua."],["I am studying now.","Tôi đang học."],["I will study tomorrow.","Tôi sẽ học ngày mai."]],"quiz":["I ___ yesterday. (study)","studied"],"speaking":"Tell a short story about yesterday and tomorrow.","sources":[94]},{"title":"Tính cách","rule":"Tính từ trước danh từ hoặc sau be; trạng từ bổ nghĩa động từ","sentences":[["She is a curious person.","Cô ấy là người tò mò."],["He drives carefully.","Anh ấy lái xe cẩn thận."],["Helen speaks English fluently.","Helen nói tiếng Anh trôi chảy."]],"quiz":["He drives ___. (careful)","carefully"],"speaking":"Describe a person you admire.","sources":[2,7,87]},{"title":"Word form","rule":"Xác định vị trí N/V/Adj/Adv trước khi chọn từ","sentences":[["Sports are good for our health.","Thể thao tốt cho sức khỏe."],["She made a good choice.","Cô ấy đưa ra lựa chọn tốt."],["The film is interesting.","Bộ phim thú vị."]],"quiz":["Sports are good for our ___. (healthy)","health"],"speaking":"Describe an interesting activity.","sources":[3,4,5,8,9,10,11]},{"title":"Đi chợ và số lượng","rule":"some/any; much/many; a few/a little","sentences":[["I have some apples.","Tôi có vài quả táo."],["Do you have any milk?","Bạn có sữa không?"],["I need a little sugar.","Tôi cần một ít đường."]],"quiz":["How ___ apples do you need?","many"],"speaking":"What do you buy at the supermarket?","sources":[39,40,41,42,43,44]},{"title":"Du lịch","rule":"Phrasal verbs: check in, get on, take off","sentences":[["We check in at the hotel.","Chúng tôi làm thủ tục nhận phòng."],["I get on the bus at seven.","Tôi lên xe buýt lúc bảy giờ."],["The plane takes off at nine.","Máy bay cất cánh lúc chín giờ."]],"quiz":["The plane takes ___.","off"],"speaking":"Describe a trip you enjoyed.","sources":[46,47,48,49,50,51,58]},{"title":"Cảm xúc và lý do","rule":"because + S + V; because of + N/V-ing; -ed/-ing","sentences":[["I am tired because I worked late.","Tôi mệt vì làm việc muộn."],["The film is boring.","Bộ phim nhàm chán."],["I stayed home because of the rain.","Tôi ở nhà vì trời mưa."]],"quiz":["I stayed home ___ of the rain.","because"],"speaking":"Why do you want to improve your English?","sources":[52,53,54,55,56,57]},{"title":"Giao tiếp công việc","rule":"can/could + V; câu yêu cầu lịch sự","sentences":[["Could you repeat that, please?","Bạn có thể nhắc lại không?"],["Can I help you?","Tôi có thể giúp gì?"],["I need to reschedule my appointment.","Tôi cần đổi lịch hẹn."]],"quiz":["Could you ___ that? (repeat)","repeat"],"speaking":"Role-play: ask a customer to wait politely.","sources":[62,70,71,72,73,74]},{"title":"Mở rộng câu","rule":"who/which/that; bị động be + V3 (phần nâng cao tự chọn)","sentences":[["I have a friend who lives nearby.","Tôi có một người bạn sống gần đây."],["This is a book that I like.","Đây là cuốn sách tôi thích."],["English is spoken in many countries.","Tiếng Anh được nói ở nhiều quốc gia."]],"quiz":["English is ___ in many countries. (speak)","spoken"],"speaking":"Describe a friend or a useful object.","sources":[59,60,61,63,67,68,69]},{"title":"Viết đoạn văn ngắn","rule":"S + V; nối ý bằng and, but, because","sentences":[["I work during the day.","Tôi làm việc ban ngày."],["I study English in the evening.","Tôi học tiếng Anh buổi tối."],["I feel tired, but I keep trying.","Tôi thấy mệt nhưng vẫn cố gắng."]],"quiz":["I study English ___ I want to improve.","because"],"speaking":"Speak for one minute about your daily routine.","sources":[93,94,95,96,97]},{"title":"Kiểm tra cuối kỳ","rule":"Tự kiểm chủ ngữ, động từ, thì, mạo từ và giới từ","sentences":[["I have a clear study plan.","Tôi có kế hoạch học tập rõ ràng."],["I practise English every day.","Tôi luyện tiếng Anh mỗi ngày."],["I want to speak more confidently.","Tôi muốn nói tự tin hơn."]],"quiz":["She ___ English every day. (practise)","practises"],"speaking":"Talk about your life, past experience and future goals.","sources":[1]}],"groups":[{"title":"Tổng hợp tài liệu","items":["https://test.ebomb.edu.vn/tests/1624887480/start","TỔNG HỢP LẠI CÁC BÀI TẬP TIẾNG ANH TỪ NGÀY 22-04 ĐẾN NGÀY 22-07"]},{"title":"NGÀY 22-04","items":["NGÀY 22-04","HW Listening: Unit 1 - Part 2 - Ex 2 & 4","He is a ___ boy. He is always asking questions. (curiosity)","✅ Đáp án: curious (adj)\u000b 👉 \"curious\" là tính từ → mô tả \"He\", mang nghĩa \"tò mò\". Danh từ “curiosity” không phù hợp vì cần một tính từ bổ nghĩa cho danh từ “boy”.","All the pupils(tất cả các học sinh) have done the exercises ___. (easy)","✅ Đáp án: easily (adv)\u000b 👉 Trạng từ “easily” bổ nghĩa cho động từ “have done”. \"Do something easily\" = làm gì đó một cách dễ dàng.","Keep ___! The teacher is explaining the lesson. (silence)","✅ Đáp án: silent (adj)\u000b 👉 \"Keep silent\" là một cụm cố định (collocation). Danh từ “silence” không phù hợp sau “keep” nếu là mệnh lệnh trực tiếp như vậy.","Be ___ in your work! (care)","✅ Đáp án: careful (adj)\u000b 👉 Câu mệnh lệnh \"Be + adj\", nên cần tính từ → \"Be careful!\"","Time passes ___ when you are alone. (slow)","✅ Đáp án: slowly (adv)\u000b 👉 Trạng từ “slowly” bổ nghĩa cho động từ “passes”. (Thời gian trôi chậm)","He ___ carefully. He rarely has accidents. (drive)","✅ Đáp án: drives (v)\u000b 👉 Chủ ngữ \"He\" (ngôi thứ 3 số ít) → dùng “drives”.","Ho Chi Minh City is an important ___ center. (commerce)","✅ Đáp án: commercial (adj)\u000b 👉 “Commercial center” (trung tâm thương mại) → cần tính từ “commercial” để bổ nghĩa cho danh từ “center”.","We have a ___ newspaper in this town. (week)","✅ Đáp án: weekly (adj)\u000b 👉 \"Weekly newspaper\" (báo ra hàng tuần) là cụm danh từ, cần tính từ “weekly”.","This exercise seems ___. (difficulty)","✅ Đáp án: difficult (adj)\u000b 👉 “seems + adj” → “difficult” phù hợp, không dùng danh từ “difficulty”.","Mrs. Green can help Alice to make a good ___. (choose)","✅ Đáp án: choice (noun)\u000b 👉 \"Make a choice\" là cụm từ cố định (idiom) → “choice” là danh từ.","He has ___ bought a new car. (recent)","✅ Đáp án: recently (adv)\u000b 👉 Trạng từ “recently” bổ nghĩa cho thì hiện tại hoàn thành “has bought”.","It’s too ___ for me to buy. (expense)","✅ Đáp án: expensive (adj)\u000b 👉 “too + adj + for sb to do sth” → expensive là tính từ phù hợp.","How ___ those shop windows are! (beauty)","✅ Đáp án: beautiful (adj)\u000b 👉 “How + adj + S + V” → beautiful phù hợp.","She has finished her best ___. (perform)","✅ Đáp án: performance (noun)\u000b 👉 Danh từ “performance” là kết quả của hành động “perform”.","The cartoon last night was very ___. (interest)","✅ Đáp án: interesting (adj)\u000b 👉 Bộ phim (vật) gây hứng thú → dùng “interesting”, không dùng “interested”.","She ___ goes to the pictures with her younger sister. (frequency)","✅ Đáp án: frequently (adv)\u000b 👉 Trạng từ “frequently” bổ nghĩa cho động từ “goes”.","Last night the singer sang very ___. (good)","✅ Đáp án: well (adv)\u000b 👉 “Sang” là động từ → cần trạng từ “well”, không dùng “good” (adj).","The story is about an ___ trip. (excite)","✅ Đáp án: exciting (adj)\u000b 👉 \"Trip\" là vật → cần tính từ “exciting”.","👉 \"Trip\" là vật → cần tính từ “exciting”.","19.  In May the days often ________. (long)\u000b ✅ Đáp án: lengthen (verb)\u000b 👉 Động từ “lengthen” mang nghĩa làm dài ra, bổ nghĩa cho động từ “often” diễn tả hành động của ngày tháng.","20. He got rid of the ________ by opening a window. (smell)\u000b ✅ Đáp án: smell (noun)\u000b 👉 “Smell” là danh từ, chỉ mùi hôi mà anh ấy đang cố gắng loại bỏ.","21. Nobody showed them to their ________. (sit)\u000b ✅ Đáp án: seats (noun)\u000b 👉 “Seats” là danh từ số nhiều, bổ nghĩa cho vị trí ngồi của mọi người.","22. Helen speaks English very ________. (fluent)\u000b ✅ Đáp án: fluently (adverb)\u000b 👉 “Fluently” là trạng từ, bổ nghĩa cho động từ “speaks,” miêu tả cách thức Helen nói tiếng Anh.","23. This is the most ________ machine in our field. (value)\u000b ✅ Đáp án: valuable (adjective)\u000b 👉 “Valuable” là tính từ, bổ nghĩa cho danh từ “machine,” miêu tả tính chất của máy.","24. We can keep the land in ________ condition by killing weeds. (well)\u000b ✅ Đáp án: good (adjective)\u000b 👉 “Good” là tính từ, miêu tả trạng thái của mảnh đất.","25. The huge windows gave us a ________ view of the grounds. (splendidly)\u000b ✅ Đáp án: splendid (adjective)\u000b 👉 “Splendid” là tính từ, bổ nghĩa cho danh từ “view,” miêu tả vẻ đẹp của cảnh vật.","26. The ball was followed with great ________. (excite)\u000b ✅ Đáp án: excitement (noun)\u000b 👉 “Excitement” là danh từ, chỉ sự hào hứng theo sau quả bóng.","27. That was an ________ match, wasn’t it? I was ________ to see it. (excite)\u000b ✅ Đáp án: exciting (adjective), excited (adjective)\u000b 👉 “Exciting” là tính từ miêu tả trận đấu thú vị, “excited” là tính từ miêu tả cảm giác của người xem.","28. ________ is a good career. I want to become a ________. (teach)\u000b ✅ Đáp án: Teaching (noun), teacher (noun)\u000b 👉 “Teaching” là danh từ, chỉ nghề nghiệp, và “teacher” là danh từ chỉ người làm nghề.","29. Rubber trees are very ________. (use)\u000b ✅ Đáp án: useful (adjective)\u000b 👉 “Useful” là tính từ, miêu tả sự có ích của cây cao su.","30. Sports are very good for our ________. (healthy)\u000b ✅ Đáp án: health (noun)\u000b 👉 “Health” là danh từ, chỉ tình trạng sức khỏe.","31. Who will take ________ of the baby when you go away? (careful)\u000b ✅ Đáp án: care (noun)\u000b 👉 “Care” là danh từ, chỉ sự chăm sóc.","32. Don’t worry about her ________. (complain)\u000b ✅ Đáp án: complaints (noun)\u000b 👉 “Complaints” là danh từ số nhiều, chỉ các lời phàn nàn của cô ấy.","33. What is the real ________ of the house? (wide)--(adj, adv), widen(v)\u000b ✅ Đáp án: width (noun)\u000b 👉 “Width” là danh từ, chỉ chiều rộng của ngôi nhà.","34. I want to make new dresses but I don’t have a ________ machine. (sew)- n\u000b ✅ Đáp án: sewing ( adj )\u000b 👉 “Sewing” là danh từ, chỉ máy may.","35. She danced so ________ that the audience clapped their hands many times. (beauty)\u000b ✅ Đáp án: beautifully (adverb)\u000b 👉 “Beautifully” là trạng từ, bổ nghĩa cho động từ “danced,” miêu tả cách cô ấy nhảy.","36. I’ll have Tom repair our electric ________. (cook)\u000b ✅ Đáp án: cooker (noun)\u000b 👉 “Cooker” là danh từ, chỉ thiết bị nấu ăn.","37. Water has no color. It is a ________ liquid. (color)\u000b ✅ Đáp án: colorless (adjective)\u000b 👉 “Colorless” là tính từ, miêu tả đặc tính của nước không có màu.","38. Please don’t make ________. (noisy)\u000b ✅ Đáp án: noise (noun)\u000b 👉 “Noise” là danh từ, chỉ âm thanh ồn ào.","39. Mr. Green works in this factory as a ________. (account)\u000b ✅ Đáp án: accountant (noun)\u000b 👉 “Accountant” là danh từ, chỉ nghề nghiệp kế toán.","40. Ky Hoa lake is one of the areas of ________. (entertain)\u000b ✅ Đáp án: entertainment (noun)\u000b 👉 “Entertainment” là danh từ, chỉ khu vực giải trí.","41. Butter is one of the ________ of milk. (produce)\u000b ✅ Đáp án: products (noun)\u000b 👉 “Products” là danh từ số nhiều, chỉ các sản phẩm từ sữa.","42. He is a ________ person. He often makes me laugh. (fun)\u000b ✅ Đáp án: funny (adjective)\u000b 👉 “Funny” là tính từ, miêu tả tính cách hài hước của anh ấy.","43. I didn’t know how you ________ your birthday party. (celebration)\u000b ✅ Đáp án: celebrated (verb)\u000b 👉 “Celebrated” là động từ, chỉ hành động tổ chức buổi tiệc sinh nhật.","44. On Christmas day, I often send my close friends ________ cards. (greet)\u000b ✅ Đáp án: greeting (noun)\u000b 👉 “Greeting” là danh từ, chỉ những tấm thiệp chúc mừng.","45. He is a famous ________ in this country. (act)\u000b ✅ Đáp án: actor (noun)\u000b 👉 “Actor” là danh từ, chỉ người diễn viên.","46. He often writes stories. He is a ________. (write)\u000b ✅ Đáp án: writer (noun)\u000b 👉 “Writer” là danh từ, chỉ người viết lách.","47. These flowers look ________. (nature)\u000b ✅ Đáp án: natural (adjective)\u000b 👉 “Natural” là tính từ, miêu tả vẻ đẹp tự nhiên của hoa.","48. Air ________ makes us unhealthy. (pollute)\u000b ✅ Đáp án: pollution (noun)\u000b 👉 “Pollution” là danh từ, chỉ sự ô nhiễm không khí.","49. His plays were ________ on the stage in London. (performance)\u000b ✅ Đáp án: performed (verb)\u000b 👉 “Performed” là động từ, chỉ hành động trình diễn các vở kịch."]},{"title":"Phần ôn tập 3 · NGÀY 22-04","items":["50. The film is ________ so I’m ________. (bore)\u000b ✅ Đáp án: boring (adjective), bored (adjective)\u000b 👉 “Boring” miêu tả tính chất của bộ phim, còn “bored” miêu tả cảm giác của người xem.","51. The Sword Lake is one of the ________ places in Hanoi. (history)\u000b ✅ Đáp án: historical (adjective)\u000b 👉 “Historical” là tính từ, miêu tả giá trị lịch sử của Hồ Gươm.","52. He devoted all his ________ to writing. (live)\u000b ✅ Đáp án: life (noun)\u000b 👉 “Life” là danh từ, chỉ cuộc sống mà anh ấy đã dành cho việc viết.","53. How ________ the street is! (danger)\u000b ✅ Đáp án: dangerous (adjective)\u000b 👉 “Dangerous” là tính từ, miêu tả sự nguy hiểm của con phố.","54. She lives ________ although her parents are very poor. (happy)\u000b ✅ Đáp án: happily (adverb)\u000b 👉 “Happily” là trạng từ, bổ nghĩa cho động từ “lives,” miêu tả cách cô ấy sống mặc dù gia đình nghèo khó.","II. Fill in the blank with a suitable idiomatic expression.","(make fun of, feel regret for, pay attention to, take care of, take leave of, catch sight off, set fire to)","1. She was furious that she was being ________.\u000b Đáp án: made fun of\u000b 👉 Cụm động từ “made fun of” nghĩa là \"chế giễu\" hoặc \"chọc ghẹo\", bổ nghĩa cho hành động mà cô ấy đang bị làm tổn thương, vì vậy cô ấy tức giận.","2. This man was sent to prison for ________ his house.\u000b Đáp án: setting fire to\u000b 👉 Cụm động từ “setting fire to” có nghĩa là \"châm lửa\" hoặc \"phóng hỏa\". Câu này ám chỉ người đàn ông bị kết án vì hành động phóng hỏa ngôi nhà của mình.","3. He left home without ________ anybody.\u000b Đáp án: taking leave of\u000b 👉 Cụm động từ “taking leave of” nghĩa là \"chào tạm biệt\". Câu này ám chỉ anh ấy đã rời khỏi nhà mà không nói lời tạm biệt với ai.","4. The woman of whom you ________ at the bus stop this morning is my aunt.\u000b Đáp án: caught sight of\u000b 👉 Cụm động từ “caught sight of” có nghĩa là \"nhìn thấy\". Câu này miêu tả việc bạn đã nhìn thấy người phụ nữ tại điểm dừng xe buýt sáng nay, và cô ấy là dì của bạn.","5. The children are old enough to ________ themselves.\u000b Đáp án: take care of\u000b 👉 Cụm động từ “take care of” có nghĩa là \"chăm sóc\". Câu này ám chỉ rằng những đứa trẻ đủ lớn để có thể tự chăm sóc bản thân.","6. I ________ having deceived her.\u000b Đáp án: feel regret for\u000b 👉 Cụm động từ “feel regret for” có nghĩa là \"hối hận\". Câu này miêu tả cảm giác hối hận của người nói vì đã lừa dối cô ấy.","HW Listening: Unit 1 - Part 2 - Ex 2 & 4","I. Supply the correct word form","(Biến đổi từ loại: danh từ, tính từ, trạng từ, động từ...)","He is a ____ boy. He is always asking questions. (curiosity)\u000b → Từ gốc: curiosity (danh từ)\u000b → Cần: tính từ mô tả người\u000b → Đáp án: curious\u000b ✔️ He is a curious boy.","All the pupils have done the exercises _____. (easy)\u000b → Từ gốc: easy (adj)\u000b → Cần: trạng từ bổ nghĩa cho “have done”\u000b → Đáp án: easily\u000b ✔️ They did the exercises easily.","Keep ____! The teacher is explaining the lesson. (silence)\u000b → Cần: tính từ sau “Keep” để diễn tả trạng thái\u000b → Đáp án: silent\u000b ✔️ Keep silent!","Be ____ in your work! (care)\u000b → Cần: tính từ chỉ tính cách, thái độ\u000b → Đáp án: careful\u000b ✔️ Be careful in your work!","Time passes ____ when you are alone. (slow)\u000b → Cần: trạng từ chỉ cách thức thời gian trôi\u000b → Đáp án: slowly\u000b ✔️ Time passes slowly.","He ____ carefully. He rarely has accidents. (drive)\u000b → Cần: động từ chia hiện tại đơn\u000b → Đáp án: drives\u000b ✔️ He drives carefully.","Ho Chi Minh City is an important ____ center. (commerce)\u000b → Cần: tính từ mô tả loại trung tâm\u000b → Đáp án: commercial\u000b ✔️ commercial center","We have a ____ newspaper in this town. (week)\u000b → Đáp án: weekly\u000b ✔️ a weekly newspaper","This exercise seems ____. (difficulty)\u000b → Đáp án: difficult\u000b ✔️ This exercise seems difficult.","Mrs. Green can help Alice to make a good ____. (choose)\u000b → Đáp án: choice (danh từ)\u000b ✔️ make a good choice","He has ____ bought a new car. (recent)\u000b → Đáp án: recently (trạng từ)\u000b ✔️ He has recently bought a new car.","It’s too ____ for me to buy. (expense)\u000b → Đáp án: expensive\u000b ✔️ It’s too expensive.","How ____ those shop windows are! (beauty)\u000b → Đáp án: beautiful\u000b ✔️ How beautiful those windows are!","She has finished her best ____. (perform)\u000b → Đáp án: performance\u000b ✔️ her best performance","The cartoon last night was very ________. (interest)\u000b → Đáp án: interesting (vì phim làm người ta thấy thú vị)\u000b ✔️ The cartoon was very interesting.","She ________ goes to the pictures with her younger sister. (frequency)\u000b → Đáp án: frequently\u000b ✔️ She frequently goes...","Last night the singer sang very ________. (good)\u000b → Đáp án: well\u000b ✔️ sang very well","The story is about an ________ trip. (excite)\u000b → Đáp án: exciting\u000b ✔️ an exciting trip","In May the days often ________. (long)\u000b → Đáp án: lengthen (động từ)\u000b ✔️ The days lengthen.","He got rid of the ________ by opening a window. (smell)\u000b → Đáp án: smell\u000b ✔️ got rid of the smell","Nobody showed them to their ________. (sit)\u000b → Đáp án: seats\u000b ✔️ to their seats","Helen speaks English very ________. (fluent)\u000b → Đáp án: fluently\u000b ✔️ speaks very fluently","This is the most ________ machine. (value)\u000b → Đáp án: valuable\u000b ✔️ most valuable machine","We can keep the land in ________ condition. (well)\u000b → Đáp án: good\u000b ✔️ in good condition","The huge windows gave us a ________ view. (splendidly)\u000b → Đáp án: splendid\u000b ✔️ a splendid view","The ball was followed with great ________. (excite)\u000b → Đáp án: excitement\u000b ✔️ with great excitement","That was an ________ match. I was ________ to see it. (excite)\u000b → Đáp án: exciting – excited\u000b ✔️ an exciting match – I was excited","________ is a good career. I want to become a ________. (teach)\u000b → Đáp án: Teaching – teacher\u000b ✔️ Teaching is a good career.","Rubber trees are very ________. (use)\u000b → Đáp án: useful\u000b ✔️ very useful","Sports are good for our ________. (healthy)\u000b → Đáp án: health\u000b ✔️ good for our health","Who will take ________ of the baby? (careful)\u000b → Đáp án: care\u000b ✔️ take care of the baby","Don’t worry about her ________. (complain)\u000b → Đáp án: complaint\u000b ✔️ her complaint","What is the real ________ of the house? (wide)\u000b → Đáp án: width\u000b ✔️ real width of the house","I don’t have a ________ machine. (sew)\u000b → Đáp án: sewing\u000b ✔️ a sewing machine","She danced so ________. (beauty)\u000b → Đáp án: beautifully\u000b ✔️ danced beautifully","He’ll repair our electric ________. (cook)\u000b → Đáp án: cooker\u000b ✔️ electric cooker","It is a ________ liquid. (color)\u000b → Đáp án: colorless\u000b ✔️ a colorless liquid","Please don’t make ________. (noisy)\u000b → Đáp án: noise\u000b ✔️ don’t make noise","He works as a ________. (account)\u000b → Đáp án: accountant\u000b ✔️ as an accountant","Ky Hoa lake is an area of ________. (entertain)\u000b → Đáp án: entertainment\u000b ✔️ area of entertainment","Butter is a ________ of milk. (produce)\u000b → Đáp án: product (hoặc by-product tùy ngữ cảnh)\u000b ✔️ product of milk","He is a ________ person. (fun)\u000b → Đáp án: funny\u000b ✔️ a funny person","How did you ________ your birthday party? (celebration)\u000b → Đáp án: celebrate\u000b ✔️ How did you celebrate...?","I send my friends ________ cards. (greet)\u000b → Đáp án: greeting\u000b ✔️ greeting cards","He is a famous ________. (act)\u000b → Đáp án: actor\u000b ✔️ a famous actor","He often writes stories. He is a ________. (write)\u000b → Đáp án: writer\u000b ✔️ a writer","These flowers look ________. (nature)\u000b → Đáp án: natural\u000b ✔️ look natural","Air ________ makes us unhealthy. (pollute)\u000b → Đáp án: pollution\u000b ✔️ Air pollution","His plays were ________ on stage. (performance)\u000b → Đáp án: performed\u000b ✔️ were performed","The film is ________, I’m ________. (bore)\u000b → Đáp án: boring – bored\u000b ✔️ film is boring – I’m bored","The Sword Lake is a ________ place. (history)\u000b → Đáp án: historical\u000b ✔️ a historical place","He devoted all his ________ to writing. (live)\u000b → Đáp án: life\u000b ✔️ his life","How ________ the street is! (danger)\u000b → Đáp án: dangerous\u000b ✔️ How dangerous!","She lives ________ though poor. (happy)\u000b → Đáp án: happily\u000b ✔️ lives happily"]},{"title":"Phần ôn tập 4 · NGÀY 22-04","items":["II. Fill in the blank with a suitable idiomatic expression","Idioms to use:\u000b make fun of, feel regret for, pay attention to, take care of, take leave of, catch sight of, set fire to","She was furious that she was being ________.\u000b → Đáp án: made fun of\u000b ✔️ ...being made fun of.","This man was sent to prison for ________ his house.\u000b → Đáp án: setting fire to\u000b ✔️ for setting fire to...","He left home without ________ anybody.\u000b → Đáp án: taking leave of\u000b ✔️ without taking leave of...","The woman of whom you ________ at the bus stop is my aunt.\u000b → Đáp án: caught sight of\u000b ✔️ you caught sight of...","The children are old enough to ________ themselves.\u000b → Đáp án: take care of\u000b ✔️ take care of themselves","I ________ having deceived her.\u000b → Đáp án: feel regret for\u000b ✔️ I feel regret for...","Tom and Dick are discussing, I want to ________.\u000b → Đáp án: pay attention to\u000b ✔️ want to pay attention to it.","Bài 1: Fill in the blank with the correct form of the word","(Noun – Verb – Adjective)","Her performance was extremely impressive, so she won the first prize.\u000b  → to be + adj","Her death made her family very sad.\u000b  → tính từ sở hữu + N","There are many different kinds of pollution these days such as: air pollution, noise pollution, or land pollution.\u000b  → sau giới từ + N/gerund","The event has received a donation of a total 500,000$ in a week.\u000b  → mạo từ + N","Some of these phenomena seem to be explainable now, but not in the past.\u000b  → adj phù hợp với nghĩa","Bài 2: Điền đúng dạng từ (Noun – Verb – Adjective)","(1) assume : to think something that is true, although you do not have definite","Verb: assume","Noun: assumption","Adjective: assumptive, assumed, assumable","(2) Dựa vào cột \"Verb\" là \"assume\", ta có thể suy ra adjective tương ứng là: assumptive, assumed, hoặc assumable. Tuy nhiên, assumed thường được dùng để miêu tả cái gì đó được cho là đúng mà không cần bằng chứng.","(3) consumption","Noun: consumption","Verb: consume","Adjective: consumptive, consumable, consumed","(4) Dựa vào cột \"Noun\" là \"consumption\", ta có thể suy ra adjective tương ứng là: consumptive, consumable, hoặc consumed. Consumptive có nghĩa là có xu hướng tiêu thụ hoặc liên quan đến bệnh lao phổi (nghĩa cổ). Consumable có nghĩa là có thể tiêu thụ hoặc sử dụng hết. Consumed là dạng quá khứ phân từ của \"consume\" và có thể được dùng như một tính từ mang nghĩa đã được tiêu thụ hết.","(5) suggested","Adjective: suggested","Verb: suggest","Noun: suggestion","(6) Dựa vào cột \"Adjective\" là \"suggested\", ta có thể suy ra verb nguyên thể là: suggest.","(7) establish","Verb: establish","Noun: establishment","Adjective: established, establishable","(8) Dựa vào cột \"Verb\" là \"establish\", ta có thể suy ra adjective tương ứng là: established hoặc establishable. Established có nghĩa là đã được thành lập vững chắc, có tiếng tăm. Establishable có nghĩa là có thể thành lập được.","(9) predict","Verb: predict","Noun: prediction, predictor (người dự đoán)","Adjective: predictable, predictive","(10) Dựa vào cột \"Verb\" là \"predict\", ta có thể suy ra adjective tương ứng là: predictable hoặc predictive. Predictable có nghĩa là có thể đoán trước được. Predictive có nghĩa là có khả năng dự đoán.","Bài 3: Điền dạng đúng của động từ vào chỗ trống","People have (1) (differ) views on whether high school students should be allowed to evaluate and criticize their teachers. Although this could be perceived as being (2) (disrespect) , I believe constructive feedback from students could do wonders for our education system.","On the one hand, (3) (propose) of the idea that students should not be allowed to make comments regarding their teachers claim that this can result in disrespect and lead to poorly (4) (behavior) students. It is common knowledge that students should look up to their teachers and obey all of their (5) (instructive). Having a student, who is (6) … (impulse) and inexperienced, criticizing a professional teacher is not appropriate in many cultures. In addition, even the (7) (major) of high school students are usually not mature enough to make objective judgments. Their feedback might end up being (8) (person) criticism, which contributes nothing to the improvement of the quality of the education.","On the other hand, many people, including myself, believe that it is (9) (benefit) for both students and teachers if there is an open environment where students can freely express their opinions, including their thoughts about their teachers. This two-way (10) (communicate) allows students to (11) (active) think about the lessons, and (12) (specific) what they want their teachers to improve. Moreover, thanks to student feedback, teachers might recognise their own (13)  (weak) and find ways to make (14) (adjust) to their pedagogical skills. Consequently, their lessons are likely to become more (15) (interest) as it suits both parties, which might result in a better learning outcome.","In conclusion, students might not be the best people to comment on their teachers. However, I strongly believe that encouraging students to provide relevant feedback about their teacher’s teaching methods is advantageous for the education system.","(1) different","People have different views...","Giải thích: \"have + adj + noun\" → cần một tính từ để bổ nghĩa cho “views” → \"different\" là tính từ của \"differ\".","(2) disrespectful","...could be perceived as being disrespectful.","Giải thích: “being + adj” → cần một tính từ để mô tả hành vi → \"disrespectful\" là tính từ của \"disrespect\".","(3) proponents","❌ Trong đoạn bạn gửi là proposal, nhưng đúng nhất là \"proponents\" (những người ủng hộ).\u000b \"Proposals of the idea\" không tự nhiên bằng \"Proponents of the idea\".","Giải thích: chủ ngữ của câu là \"những người đề xuất ý tưởng\", nên dùng danh từ chỉ người → \"proponents\".","(4) behaved","...lead to poorly behaved students.","Giải thích: \"poorly\" là trạng từ → cần một tính từ phân từ sau để mô tả \"students\" → \"behaved\" (được hành xử) là đúng.","(5) instructions","...obey all of their instructions.","Giải thích: “obey + danh từ số nhiều” (nhiều chỉ dẫn), nên dùng danh từ đếm được số nhiều → \"instructions\".","(6) impulsive","...a student, who is impulsive and inexperienced...","Giải thích: cần một tính từ để mô tả “student” → \"impulsive\" (bốc đồng) là adj đúng của \"impulse\".","(7) majority","...even the majority of high school students...","Giải thích: “majority of + danh từ số nhiều” → “majority” là danh từ đúng.","(8) personal","...might end up being personal criticism..."]},{"title":"Phần ôn tập 5 · NGÀY 22-04","items":["Giải thích: “personal + noun” → cần tính từ bổ nghĩa cho \"criticism\".","(9) beneficial","...it is beneficial for both students and teachers...","Giải thích: “It is + adj + for sb” → cần tính từ mô tả tính chất có lợi.","(10) communication","...two-way communication allows students...","Giải thích: “two-way + danh từ” → cần danh từ \"communication\" (sự giao tiếp).","(11) actively","...allows students to actively think...","Giải thích: “to + động từ → cần trạng từ để bổ nghĩa cho động từ ‘think’”.","(12) specify","...and specify what they want...","Giải thích: “and” nối hai động từ cùng cấu trúc → sau “to think” là “to specify”.","(13) weaknesses","...recognize their own weaknesses...","Giải thích: “recognize + danh từ” → cần danh từ số nhiều “weaknesses” (các điểm yếu).","(14) adjustments","...make adjustments to their skills...","Giải thích: “make + danh từ” → cụm “make adjustments” là cụm cố định (thực hiện sự điều chỉnh).","(15) interesting","...lessons are likely to become more interesting...","Giải thích: “become + tính từ” → cần adj để mô tả \"lessons\".","Bài 4: Chọn đáp án đúng nhất trong các câu dưới đây","Linda is interested in buying a new house for her parents.\u000b  → to be + interested in + O","Everybody is surprised that his younger brother passed the TOEIC test the last day.","This film is boring.\u000b  → vật dùng adj-ing","My mother is a busy teacher. At the end of the day’s work, she is often exhausted.","Sandy is starting a new job next Monday. She’s quite excited about it.","Bài 5: Hoàn chỉnh câu sau với tính từ thích hợp ở trong ngoặc","I find horror films really frightening and not at all fun to watch. (frighten)","Sometimes I get really frustrated when I can’t express myself well in English. (frustrate)","The film was so depressing! There was no happy ending for any of the characters. (depress)","If I feel stressed, I find watching a romantic comedy is often relaxing. (stress – relax)","The news was so shocking that she burst into tears. (shock)","Bài 6: Choose the correct answers.","I had such a tiring day I went straight to bed.","Everyone’s very excited about the news.","That lamp produces a very pleasing effect.","Dad always arrives home from work thoroughly exhausted.","He’s always showing off. It’s really annoying."]},{"title":"Buổi 2_Review & SP1_Job","items":["Buổi 2_Review & SP1_Job"]},{"title":"NGÀY 24-04","items":["NGÀY 24-04","He has (adv) bought a new car. (recent)","Câu hỏi: He has ___ bought a new car.","Đáp án: recently","Giải thích: Sau động từ \"has\", cần một trạng từ (adv) để bổ nghĩa cho hành động \"bought\".","Word form:","Noun: recency","Adjective: recent","Adverb: recently ✅","It’s too (adj) for me to buy. (expense)","Câu hỏi: It’s too ___ for me to buy.","Đáp án: expensive","Giải thích: Cần tính từ (adj) sau \"too\" để bổ nghĩa cho danh từ không nêu rõ.","Word form:","Noun: expense","Adjective: expensive ✅","Adverb: expensively","How (adj) those shop windows are! (beauty)","Câu hỏi: How ___ those shop windows are!","Đáp án: beautiful","Giải thích: Sau \"how\", cần một tính từ để mô tả danh từ \"windows\".","Word form:","Noun: beauty","Adjective: beautiful ✅","Adverb: beautifully","She has finished her best (noun). (perform)","Câu hỏi: She has finished her best ___.","Đáp án: performance","Giải thích: Sau \"her best\", cần một danh từ (noun).","Word form:","Verb: perform","Noun: performance ✅","Adjective: performing/performative","The cartoon last night was very (adj). (interest)","Câu hỏi: The cartoon last night was very ___.","Đáp án: interesting","Giải thích: Cần một tính từ mô tả bộ phim.","Word form:","Verb: interest","Adjective: interesting ✅ / interested (người)","Noun: interest","She (adv) goes to the pictures with her younger sister. (frequency)","Câu hỏi: She ___ goes to the pictures...","Đáp án: frequently","Giải thích: Cần trạng từ chỉ tần suất (adv of frequency).","Word form:","Noun: frequency","Adjective: frequent","Adverb: frequently ✅","Last night the singer sang very (adv). (good)","Câu hỏi: The singer sang very ___.","Đáp án: well","Giải thích: Cần một trạng từ để mô tả động từ \"sang\".","Word form:","Adjective: good","Adverb: well ✅","The story is about an (adj) trip. (excite)","Câu hỏi: The story is about an ___ trip.","Đáp án: exciting","Giải thích: \"Trip\" là vật => dùng \"exciting\" để mô tả.","Word form:","Verb: excite","Noun: excitement","Adjective: exciting ✅ / excited","In May the days are often (verb). (long)","Câu hỏi: The days are often ___.","Đáp án: lengthen","Giải thích: \"lengthen\" là động từ, dùng để chỉ quá trình ngày dài ra.","Word form:","Noun: length"]},{"title":"Phần ôn tập 8 · NGÀY 24-04","items":["Adjective: long","Verb: lengthen ✅","He got rid of the (noun) by opening a window. (smell)","Câu hỏi: He got rid of the ___.","Đáp án: smell","Giải thích: Sau \"the\", cần danh từ chỉ đối tượng bị loại bỏ.","Word form:","Verb: smell","Noun: smell ✅","Adjective: smelly","1. Nobody showed them to their __seats (N). (sit)","Câu hỏi: Nobody showed them to their what?","Câu trả lời: Nobody showed them to their seats.","Giải thích: Sau tính từ sở hữu \"their\", chúng ta cần một danh từ số nhiều để chỉ những vật thuộc về họ. Từ \"sit\" là một động từ, dạng danh từ số nhiều của nó là \"seats\", chỉ những chỗ để ngồi.","Phân tích từ loại:","sit (V): ngồi","seats (N): những chỗ ngồi","2. Helen speaks English very _fluently. (fluent) (noun: fluency)","Câu hỏi: How does Helen speak English?","Câu trả lời: Helen speaks English very fluently.","Giải thích: Chúng ta cần một trạng từ để bổ nghĩa cho động từ \"speaks\", diễn tả cách thức hành động nói. Từ \"fluent\" là một tính từ, dạng trạng từ của nó là \"fluently\".","Phân tích từ loại:","fluent (ADJ): trôi chảy","fluently (ADV): một cách trôi chảy","fluency (N): sự trôi chảy","3. This is the most valuable__ machine in our field. (value)","Câu hỏi: What kind of machine is this in our field?","Câu trả lời: This is the most valuable machine in our field.","Giải thích: Chúng ta cần một tính từ để bổ nghĩa cho danh từ \"machine\", mô tả đặc điểm của nó. Từ \"value\" là một danh từ, dạng tính từ của nó là \"valuable\". \"Most\" là một trạng từ so sánh nhất, nó bổ nghĩa cho tính từ \"valuable\".","Phân tích từ loại:","value (N): giá trị","valuable (ADJ): có giá trị","4. We can keep the land in good____ condition by killing weeds. (well)","Câu hỏi: In what condition can we keep the land by killing weeds?","Câu trả lời: We can keep the land in good condition by killing weeds.","Giải thích: Chúng ta cần một tính từ để bổ nghĩa cho danh từ \"condition\", mô tả trạng thái của đất. Từ \"well\" có thể là trạng từ hoặc tính từ (khi nói về sức khỏe), nhưng trong trường hợp này, \"good\" là tính từ phù hợp hơn để miêu tả một trạng thái tốt.","Phân tích từ loại:","well (ADV): tốt (khi bổ nghĩa cho động từ), khỏe mạnh (khi nói về sức khỏe)","good (ADJ): tốt","5. The huge windows gave us a _splendid view of the grounds. (splendidly)","Câu hỏi: What kind of view did the huge windows give us?","Câu trả lời: The huge windows gave us a splendid view of the grounds.","Giải thích: Chúng ta cần một tính từ để bổ nghĩa cho danh từ \"view\", mô tả vẻ đẹp của nó. Từ \"splendidly\" là một trạng từ, dạng tính từ của nó là \"splendid\".","Phân tích từ loại:","splendidly (ADV): một cách tráng lệ, tuyệt vời","splendid (ADJ): tráng lệ, tuyệt vời","6. The ball was followed with great excitement__. (excite)","Câu hỏi: With what feeling was the ball followed?","Câu trả lời: The ball was followed with great excitement.","Giải thích: Sau tính từ \"great\", chúng ta cần một danh từ để chỉ một cảm xúc. Từ \"excite\" là một động từ, dạng danh từ của nó là \"excitement\".","Phân tích từ loại:","excite (V): gây ra sự phấn khích","excitement (N): sự phấn khích","7. That was an exciting__ match, wasn’t it? I was excited to see it. (excite)","Câu hỏi 1: What kind of match was that?","Câu trả lời 1: That was an exciting match.","Giải thích 1: Chúng ta cần một tính từ để bổ nghĩa cho danh từ \"match\", miêu tả tính chất của trận đấu. \"Exciting\" là tính từ mang nghĩa chủ động, trận đấu gây ra sự phấn khích.","Câu hỏi 2: How did you feel to see it?","Câu trả lời 2: I was excited to see it.","Giải thích 2: Chúng ta cần một tính từ để miêu tả cảm xúc của chủ ngữ \"I\". \"Excited\" là tính từ mang nghĩa bị động, tôi cảm thấy bị kích thích, phấn khích.","Phân tích từ loại:","excite (V): gây ra sự phấn khích","exciting (ADJ): gây ra sự phấn khích","excited (ADJ): cảm thấy phấn khích","8. Teaching (gerund/danh động từ) is a good career. I want to become a teacher__.","Câu hỏi 1: What is a good career?","Câu trả lời 1: Teaching is a good career.","Giải thích 1: Chúng ta cần một danh từ hoặc cụm danh từ làm chủ ngữ của động từ \"is\". Dạng danh động từ (gerund) của \"teach\" là \"teaching\", đóng vai trò như một danh từ.","Câu hỏi 2: What do you want to become?","Câu trả lời 2: I want to become a teacher."]},{"title":"Phần ôn tập 9 · NGÀY 24-04","items":["Giải thích 2: Sau động từ \"become\", chúng ta thường cần một danh từ chỉ nghề nghiệp. \"Teacher\" là danh từ chỉ người làm nghề dạy học.","Phân tích từ loại:","teach (V): dạy","teaching (N - gerund): việc dạy học","teacher (N): giáo viên","9. Rubber trees are very useful. (use)","Câu hỏi: What are rubber trees like?","Câu trả lời: Rubber trees are very useful.","Giải thích: Sau trạng từ \"very\", chúng ta cần một tính từ để bổ nghĩa cho chủ ngữ \"Rubber trees\". Từ \"use\" là một động từ hoặc danh từ, dạng tính từ của nó là \"useful\".","Phân tích từ loại:","use (V): sử dụng","use (N): sự sử dụng, ích lợi","useful (ADJ): hữu ích","10. Sports are very good for our health__. (healthy)","Câu hỏi: What are sports very good for?","Câu trả lời: Sports are very good for our health.","Giải thích: Sau tính từ sở hữu \"our\", chúng ta cần một danh từ chỉ một khía cạnh nào đó của chúng ta. Từ \"healthy\" là một tính từ, dạng danh từ của nó là \"health\". Sau giới từ \"for\", chúng ta cũng cần một danh từ làm tân ngữ.","Phân tích từ loại:","healthy (ADJ): khỏe mạnh","health (N): sức khỏe","11. Who will take care (N) of the baby when you go away? (careful)","Câu hỏi: Who will take what of the baby when you go away?","Câu trả lời: Who will take care of the baby when you go away?","Giải thích: Trong cụm động từ \"take care of\", \"care\" là một danh từ chỉ sự chăm sóc. \"Careful\" là một tính từ, không phù hợp trong cấu trúc này.","Phân tích từ loại:","careful (ADJ): cẩn thận","care (N): sự chăm sóc","care (V): quan tâm, chăm sóc","12. Don’t worry about her complaint (N). (complain)","Câu hỏi: Don’t worry about what of her?","Câu trả lời: Don’t worry about her complaint.","Giải thích: Sau tính từ sở hữu \"her\" và giới từ \"about\", chúng ta cần một danh từ chỉ điều gì đó mà người khác có thể lo lắng. \"Complain\" là một động từ, dạng danh từ của nó là \"complaint\".","Phân tích từ loại:","complain (V): phàn nàn","complaint (N): lời phàn nàn, sự than phiền","13. What is the real width (N) of the house? (wide)","Câu hỏi: What is the real what of the house?","Câu trả lời: What is the real width of the house?","Giải thích: Sau tính từ \"real\", chúng ta cần một danh từ chỉ một đặc điểm, kích thước của ngôi nhà. \"Wide\" là một tính từ, dạng danh từ của nó là \"width\".","Phân tích từ loại:","wide (ADJ): rộng","width (N): chiều rộng","14. I want to make new dresses but I don’t have a sewing (adj) machine. (sew)","Câu hỏi: What kind of machine don’t you have to make new dresses?","Câu trả lời: I want to make new dresses but I don’t have a sewing machine.","Giải thích: Chúng ta cần một tính từ để bổ nghĩa cho danh từ \"machine\", chỉ mục đích của chiếc máy. \"Sew\" là một động từ, dạng tính từ (present participle dùng như tính từ) của nó là \"sewing\".","Phân tích từ loại:","sew (V): may","sewing (ADJ - present participle): dùng để may","15. She danced so beautifully (adj) that the audience clapped their hands many times. (beauty)","Câu hỏi: How did she dance that the audience clapped their hands many times?","Câu trả lời: She danced so beautifully that the audience clapped their hands many times.","Giải thích: Chúng ta cần một trạng từ để bổ nghĩa cho động từ \"danced\", diễn tả cách thức hành động. \"Beauty\" là một danh từ, \"beautiful\" là một tính từ, dạng trạng từ của \"beautiful\" là \"beautifully\".","Phân tích từ loại:","beauty (N): vẻ đẹp","beautiful (ADJ): đẹp","beautifully (ADV): một cách đẹp đẽ","16. I’ll have Tom repair our electric cooker (N)____. (cook)","Câu hỏi: What electric appliance will you have Tom repair?","Câu trả lời: I’ll have Tom repair our electric cooker.","Giải thích: Sau tính từ \"electric\", chúng ta cần một danh từ chỉ một loại thiết bị. \"Cook\" là một động từ hoặc danh từ (đầu bếp), dạng danh từ chỉ thiết bị là \"cooker\".","Phân tích từ loại:","cook (V): nấu","cook (N): đầu bếp","cooker (N): nồi cơm điện, bếp điện","17. Water has no color. It is a colorless (adj) liquid. (color)","Câu hỏi: What kind of liquid is water?","Câu trả lời: Water has no color. It is a colorless liquid.","Giải thích: Chúng ta cần một tính từ để bổ nghĩa cho danh từ \"liquid\", mô tả đặc điểm của nó. \"Color\" là một danh từ, dạng tính từ mang nghĩa \"không có màu\" là \"colorless\".","Phân tích từ loại:"]},{"title":"Phần ôn tập 10 · NGÀY 24-04","items":["color (N): màu sắc","colorless (ADJ): không màu","18. Please don’t make ________. (noisy)","Câu hỏi: Please don’t make what?","Câu trả lời: Please don’t make noise.","Giải thích: Sau động từ \"make\", chúng ta cần một danh từ làm tân ngữ. \"Noisy\" là một tính từ, dạng danh từ của nó là \"noise\".","Phân tích từ loại:","noisy (ADJ): ồn ào","noise (N): tiếng ồn","19. Mr. Green works in this factory as a accountant (N). (account)","Câu hỏi: What does Mr. Green work as in this factory?","Câu trả lời: Mr. Green works in this factory as an accountant.","Giải thích: Sau giới từ \"as\", chúng ta cần một danh từ chỉ nghề nghiệp. \"Account\" là một danh từ, dạng danh từ chỉ người làm kế toán là \"accountant\".","Phân tích từ loại:","account (N): tài khoản, sự tính toán","accountant (N): kế toán viên","20. Ky Hoa lake is one of the areas of entertainment (N)___. (entertain)","Câu hỏi: Ky Hoa lake is one of the areas of what?","Câu trả lời: Ky Hoa lake is one of the areas of entertainment.","Giải thích: Sau giới từ \"of\", chúng ta cần một danh từ làm tân ngữ, chỉ mục đích của khu vực. \"Entertain\" là một động từ, dạng danh từ chỉ sự giải trí là \"entertainment\".","Phân tích từ loại:","entertain (V): giải trí","entertainment (N): sự giải trí","21. Butter is one of the products of milk. (produce)","Câu hỏi: Butter is one of the what of milk?","Câu trả lời: Butter is one of the products of milk.","Giải thích: Sau cấu trúc \"one of the\", chúng ta cần một danh từ số nhiều chỉ những thứ được tạo ra từ sữa. \"Produce\" là một động từ hoặc danh từ (nông sản), dạng danh từ số nhiều chỉ sản phẩm là \"products\".","Phân tích từ loại:","produce (V): sản xuất","produce (N): nông sản","products (N): các sản phẩm","22. He is a funny (adj) person. He often makes me laugh. (fun)","Câu hỏi: What kind of person is he?","Câu trả lời: He is a funny person.","Giải thích: Sau mạo từ \"a\", chúng ta cần một tính từ để bổ nghĩa cho danh từ \"person\", miêu tả tính cách của anh ấy. \"Fun\" là một danh từ, dạng tính từ của nó là \"funny\".","Phân tích từ loại:","fun (N): niềm vui, sự hài hước","funny (ADJ): buồn cười, hài hước","23. I didn’t know how you celebrated (V)___ your birthday party. (celebration)","Câu hỏi: What didn’t you know how I did with my birthday party?","Câu trả lời: I didn’t know how you celebrated your birthday party.","Giải thích: Sau trợ động từ \"did\" trong mệnh đề \"how you...\", chúng ta cần một động từ nguyên thể để hoàn thành câu hỏi (nếu viết lại thành câu hỏi trực tiếp). Tuy nhiên, trong câu khẳng định này, \"didn't know\" ở thì quá khứ đơn, nên động từ trong mệnh đề sau \"how\" cũng cần ở thì quá khứ đơn: \"celebrated\". \"Celebration\" là một danh từ.","Phân tích từ loại:","celebration (N): sự kỷ niệm, lễ kỷ niệm","celebrate (V): kỷ niệm, tổ chức lễ","24. On Christmas day, I often send my close friends greeting (adj)__ cards. (greet)","Câu hỏi: What kind of cards do you often send your close friends on Christmas day?","Câu trả lời: On Christmas day, I often send my close friends greeting cards.","Giải thích: Chúng ta cần một tính từ để bổ nghĩa cho danh từ \"cards\", chỉ mục đích của những tấm thiệp. \"Greet\" là một động từ, dạng tính từ (present participle dùng như tính từ) của nó là \"greeting\".","Phân tích từ loại:","greet (V): chào hỏi","greeting (ADJ - present participle): dùng để chào hỏi","greeting (N): lời chào","25. He is a famous actor (N)__ in this country. (act)","Câu hỏi: What is his famous profession in this country?","Câu trả lời: He is a famous actor in this country.","Giải thích: Sau tính từ \"famous\", chúng ta cần một danh từ chỉ người hoặc nghề nghiệp. \"Act\" là một động từ, dạng danh từ chỉ người diễn xuất là \"actor\".","Phân tích từ loại:","act (V): diễn xuất","actor (N): diễn viên nam","26. He often writes stories. He is a (N)_. (write)","Câu hỏi: What is someone who often writes stories called?","Câu trả lời: He often writes stories. He is a writer.","Giải thích: Sau động từ liên kết \"is\" và mạo từ \"a\", chúng ta cần một danh từ chỉ người hoặc nghề nghiệp. \"Write\" là một động từ, dạng danh từ chỉ người viết là \"writer\".","Phân tích từ loại:","write (V): viết","writer (N): nhà văn, người viết","27. These flowers look (adj)__. (nature)","Câu hỏi: How do these flowers look?","Câu trả lời: These flowers look natural."]},{"title":"Phần ôn tập 11 · NGÀY 24-04","items":["Giải thích: Sau động từ liên kết \"look\", chúng ta cần một tính từ để miêu tả trạng thái hoặc vẻ bề ngoài của chủ ngữ \"These flowers\". \"Nature\" là một danh từ, dạng tính từ của nó là \"natural\".","Phân tích từ loại:","nature (N): tự nhiên, bản chất","natural (ADJ): tự nhiên","28. Air (N)_ makes us unhealthy. (pollute)","Câu hỏi: What of the air makes us unhealthy?","Câu trả lời: Air pollution makes us unhealthy.","Giải thích: Chúng ta cần một danh từ làm chủ ngữ của động từ \"makes\". \"Pollute\" là một động từ, dạng danh từ của nó là \"pollution\", chỉ sự ô nhiễm.","Phân tích từ loại:","pollute (V): gây ô nhiễm","pollution (N): sự ô nhiễm","29. His plays were _(adj) on the stage in London. (performance)","Câu hỏi: What happened to his plays on the stage in London?","Câu trả lời: His plays were performed on the stage in London.","Giải thích: Trong câu bị động \"were...\", chúng ta cần dạng quá khứ phân từ của động từ. \"Performance\" là một danh từ, \"perform\" là một động từ, dạng quá khứ phân từ của \"perform\" là \"performed\". Trong ngữ cảnh này, \"performed\" đóng vai trò như một tính từ miêu tả trạng thái của những vở kịch (đã được trình diễn). \"Performative\" là một tính từ khác liên quan đến hành động biểu diễn nhưng mang ý nghĩa \"thực hiện một hành động cụ thể\" hoặc \"có tính chất biểu diễn\", không phù hợp trong ngữ cảnh này.","Phân tích từ loại:","performance (N): buổi biểu diễn","perform (V): biểu diễn","performed (V - past participle dùng như tính từ): đã được biểu diễn","performative (ADJ): có tính chất biểu diễn, thực hiện một hành động cụ thể","30. The film is _____ so I’m ____. (bore)","Câu hỏi 1: What is the film like?","Câu trả lời 1: The film is boring.","Giải thích 1: Chúng ta cần một tính từ để miêu tả tính chất của bộ phim, gây ra cảm giác chán cho người xem. \"Bore\" là một động từ, dạng tính từ mang nghĩa chủ động (gây ra cảm giác) là \"boring\".","Câu hỏi 2: How do you feel because of the film?","Câu trả lời 2: The film is boring so I’m bored.","Giải thích 2: Chúng ta cần một tính từ để miêu tả cảm xúc của chủ ngữ \"I\". \"Bore\" là một động từ, dạng tính từ mang nghĩa bị động (cảm thấy) là \"bored\".","Phân tích từ loại:","bore (V): làm cho ai đó cảm thấy chán","boring (ADJ): gây ra sự chán nản","bored (ADJ): cảm thấy chán nản"]},{"title":"SPEAKING BUỔI 1 - NGÀY 24-04","items":["SPEAKING BUỔI 1 - NGÀY 24-04","What do you do?","Outline:","Start with your job title (e.g., “I work as a software developer”).","Briefly describe your main responsibilities (e.g., “My role involves designing and developing applications to improve user experience”).","Mention industry or company (if applicable), like “I work in the tech industry at [Company Name]”","Why did you choose this job?/Why do you like the subject (môn học)?","Outline:","Mention your interest or passion related to the field (e.g., “I’ve always been passionate about technology”).","Explain how the job aligns with your skills or strengths (e.g., “This job allows me to use my analytical skills”).","Highlight any long-term goals the job helps you achieve (e.g., “I chose this role because it offers great growth opportunities in my career”).","What do you like about this job/your study?","Outline:","Mention what you like about the job (e.g., “I enjoy the creative freedom and the challenges”).","Describe any downsides or challenges (e.g., “Sometimes the deadlines can be stressful”).","Emphasize how you deal with the negatives or how the positives outweigh them (e.g., “Even though it’s challenging, I find it rewarding”).","Do you have any plans to change your job/study in the future?","Outline:","Mention if you are open to new opportunities (e.g., “I am open to change if it offers better growth”).","Explain what type of job change you are considering, if any (e.g., “I’d like to move into a project management role in the future”).","Provide a reason for this plan, like career advancement or personal goals (e.g., “I believe it will help me develop my leadership skills”).","Question","Vocabulary/Collocations","What do you like or dislike about your job?","the best aspect of my job, enjoy the challenge of, job satisfaction, can be overwhelming, a steep learning curve, sense of accomplishment","Do you like your job? If you don’t, what kind of job would you prefer?","fulfilling experience, prefer a role that offers, would be more suited to, career aspirations, ideal job, satisfaction from","Do you have any plans to change your job in the future?","career advancement, long-term plans, open to new opportunities, upward mobility, professional development, pursue a different path"]},{"title":"Buổi 3: PREPOSITIONS - ARTICLE","items":["Buổi 3: PREPOSITIONS - ARTICLE"]},{"title":"NGÀY 29-04","items":["NGÀY 29-04","Giới từ là từ hoặc nhóm từ thường được dùng trước danh từ, cụm danh từ hoặc đại từ để chỉ sự liên hệ giữa danh từ hoặc đại từ này với các thành phần khác trong câu.","Ex: I’m really angry with Joe.\u000b (Tôi rất giận Joe.)\u000b They live in a small village.\u000b (Họ sống trong một ngôi làng nhỏ.)","1. Giới từ chỉ nơi chốn (Prepositions of place)","• AT : ở; tại\u000b – At được dùng để chỉ vị trí tại một điểm.","at home; at the station/airport/door/crossroad/office/seaside …","at the top/bottom (of a page/hill …);","at the front/back (of a building/group of people);","at the beginning/end (of a lesson);","at the corner (of a street)","Ex: They arrived late at the airport.\u000b (Họ đến sân bay trễ.)\u000b There’s someone at the door.\u000b (Có ai đứng ở cửa kia.)","– Đôi khi At còn chỉ một khu vực lớn hơn, khi ta xem đó như một “điểm” 🗺️trên hành trình hoặc địa điểm gặp gỡ. Ví dụ:","+ The train stops for an hour at Hồ Chí Minh City (station in HCMC).","[= at Frankfurt station]","(Tàu lửa dừng ở Frankfurt một giờ.)","+ She lives in Frankfurt.","(Bà ấy sống ở Frankfurt.)","+ Let’s meet at the club.","(Chúng ta hãy gặp nhau ở câu lạc bộ.)","– At chỉ sự hiện diện (của một người) tại một sự kiện:","at the party, at the meeting, at the concert, at the match, at the lecture","Ex: We were at the party last night when you called.","(Tối qua, khi bạn gọi điện chúng tôi đang dự tiệc.)","• IN : trong; ở trong","– In dùng để chỉ vị trí bên trong một diện tích hoặc không gian ba chiều (khi vật bị bao quanh):","in the room/building/kitchen/garden/restaurant/office/park/pool","mountains/sea/river/forest/field/desert/village/town/country/city","Ex: There are 400 seats in the theater/cinema.\u000b (Có 400 chỗ ngồi trong rạp hát/rạp chiếu bóng.)\u000b Look at the children who are swimming in the pool/river/sea.\u000b (Hãy trông chừng những đứa trẻ đang bơi trong hồ/sông/biển.)","– In dùng trước tên làng, thị trấn, thành phố, quốc gia,…\u000b Ex: When we were in France, we spent a few days in Paris.\u000b (Khi ở Pháp, chúng tôi đã ở Paris vài ngày.)\u000b Atlanta is in Georgia.\u000b (Atlanta thuộc bang Georgia.)","– In cũng được dùng với tên đường (người Mỹ thường nói on):","in the street/road/avenue; in Wall Street","Ex: Her house is in Albert Street.\u000b (Nhà cô ấy ở đường Albert.)","– In dùng với phương tiện di chuyển bằng ô tô và taxi: in a car/taxi","Ex: They arrived in a taxi.","(Họ đến bằng taxi.)","– In được dùng không có mạo từ để nói rằng một người đang ở một nơi nào đó:in bed / hospital / prison / church","• ON : trên; ở trên\u000b – On dùng để chỉ vị trí trên bề mặt:","on the table / carpet / wall / ceiling / blackboard / screen /","pavement / door / shirt / map / page","Ex: I sat on the grass / on the chair / on the ground.\u000b (Tôi ngồi trên cỏ / trên ghế / trên mặt đất.)","– On dùng để chỉ nơi chốn hoặc số tầng (nhà):","on the platform / railway / farm / island / river / beach / coast /","on the ground / on the (1st, 2nd, 3rd) floor","Ex: They have lived on this farm for twenty years.\u000b (Họ sống ở trang trại này 20 năm rồi.)\u000b Portsmouth is on the south coast of England.\u000b (Portsmouth nằm ở bờ biển phía nam nước Anh.)\u000b He works on the railway.\u000b (Ông ấy làm việc ở ngành đường sắt.)\u000b My office is on the fifth floor.\u000b (Văn phòng của tôi ở tầng năm.)","– On dùng trước tên đường (Mỹ): on the street; on Wall Street","Ex: Her house is on Albert Street.\u000b (Nhà cô ấy ở đường Albert.)","– On dùng với phương tiện giao thông công cộng hoặc cá nhân (ngoại trừ car/taxi): on a bus / train / plane / ship / motorbike / bicycle / horse","Ex: There were too many people on the bus.\u000b (Có quá nhiều người trên xe buýt.)\u000b Mary passed me on her bicycle.\u000b (Mary đạp xe ngang qua tôi.)","– On (bên)dùng trong một số cụm từ chỉ vị trí tương đối: on the left / right; on the front / back (of a letter/piece of paper/…);","Ex: In Britain people drive on the left.","(Ở nước Anh, người ta chạy xe bên trái.)","Write your name on the back of the envelope.","(Hãy viết tên anh ở phía sau phong bì.)","ON: ngày tháng (on 30th April, nhấn mạnh ngày trong dịp), thứ (on Monday), Dùng \"on\" khi nói về mục đích của chuyến đi.","IN: tháng (in January), năm (in 2000), mùa (in Spring), buổi (in the morning/afternoon/evening), thế kỷ (in 21st century)","AT: giờ (at 8 o’clock), dịp (at Tet holiday [10 ngày], nhấn mạnh toàn bộ cái dịp), thời gian trong ngày (at night, at midnight)","• ABOVE : cao hơn; trên (nhưng không nhất thiết phải ngay trên)\u000b Ex: We were flying above/over the clouds.\u000b (Chúng tôi đang bay bên trên những đám mây.)","• BELOW : thấp hơn; dưới (nhưng không nhất thiết phải ngay dưới)\u000b Ex: The lake is almost 900 feet below sea level.\u000b (Cái hồ này thấp hơn mực nước biển gần 900 feet.)","• OVER : ngay trên (nhưng không tiếp xúc)\u000b Ex: The Simpsons live in an apartment over the store.\u000b (Gia đình Simpson sống trong căn hộ ngay trên cửa hàng.)","• UNDER : dưới; ngay dưới\u000b Ex: My puppy is sleeping under the table.\u000b (Chó con của tôi đang ngủ dưới bàn.)","• NEAR : gần (khoảng cách ngắn)\u000b – Near dùng để chỉ khoảng cách ngắn giữa hai vật hoặc người.\u000b Ex: Don’t sit near the door.\u000b (Đừng ngồi gần cửa ra vào.)","• BY, BESIDE, NEXT TO : bên cạnh\u000b – By, beside, next to đều dùng để nói “ở ngay cạnh” ai/cái gì.\u000b Ex: Come and sit by / beside / next to me.\u000b (Hãy đến ngồi cạnh tôi.)","• INSIDE : bên trong\u000b – Inside dùng để chỉ “bên trong” một không gian, nơi chốn.\u000b Ex: Let’s go inside the house.\u000b (Chúng ta hãy đi vào trong nhà.)","• OUTSIDE : bên ngoài\u000b – Outside dùng để chỉ “bên ngoài” một không gian, nơi chốn.\u000b Ex: He was sitting at a table outside the café.\u000b (Anh ta đang ngồi ở bàn bên ngoài quán giải khát.)","• BETWEEN : ở giữa (hai người, hai vật, hai nơi…)\u000b – Between dùng để chỉ “ở giữa” hai đối tượng.\u000b Ex: Who is the girl standing between Alice and Mary?\u000b (Cô gái đứng giữa Alice và Mary là ai vậy?)","– Between cũng có thể dùng khi một người/vật ở giữa từng cá thể riêng rẽ trong một nhóm không thành khối.\u000b Ex: Our house is between the woods, the river and the village.\u000b (Nhà chúng tôi nằm giữa khu rừng, con sông và ngôi làng.)","• AMONG : ở giữa (một đám đông hoặc một nhóm người, vật)\u000b – Among dùng để chỉ “ở trong đám” hoặc “giữa một nhóm”.\u000b Ex: She was sitting among a crowd of children.\u000b (Cô ấy ngồi giữa đám trẻ.)","• AGAINST : tựa vào\u000b – Against dùng khi một vật tựa hoặc dựa vào một bề mặt khác.\u000b Ex: I put the ladder against the wall.\u000b (Tôi đặt cái thang tựa vào tường.)","• IN FRONT OF : phía trước\u000b – In front of dùng để chỉ “phía trước” của ai/cái gì.\u000b Ex: There’s a garden in front of my house.\u000b (Trước nhà tôi có một khu vườn.)","• BEHIND : phía sau\u000b – Behind dùng để chỉ “phía sau” ai/cái gì.\u000b Ex: The car behind us was flashing its lights.\u000b (Chiếc ô tô phía sau chúng tôi đang nháy đèn.)"]},{"title":"Phần ôn tập 15 · NGÀY 29-04","items":["• OPPOSITE : đối diện\u000b – Opposite dùng để chỉ “đối diện với” ai/cái gì.\u000b Ex: The bank is opposite the supermarket.\u000b (Ngân hàng ở đối diện siêu thị.)","• ACROSS : bên kia\u000b – Across dùng để chỉ “bên kia” một không gian hoặc con đường.\u000b Ex: My house is just across the street.\u000b (Nhà tôi ở ngay bên kia đường.)","Adjective + preposition (Tính từ + giới từ)","• OF\u000b – ashamed of: xấu hổ (về)\u000b – afraid of: sợ, e ngại\u000b – ahead of: trước\u000b – confident of: tin tưởng\u000b – tired of: chán\u000b – fond of: thích\u000b – full of: đầy\u000b – sick of: chán ngấy\u000b – hopeful of: hy vọng\u000b – suspicious of: nghi ngờ\u000b – proud of: tự hào\u000b – aware/conscious of: nhận thức\u000b – (in)capable of: (không) có khả năng\u000b – envious of: đố kỵ, ghen tị\u000b – guilty of: phạm tội, có tội\u000b – terrified of: sợ hãi, khiếp sợ\u000b – certain/sure of: chắc chắn\u000b – joyful of: vui mừng (về)\u000b – jealous of: ghen tị với\u000b – frightened of: hoảng sợ\u000b – scared of: bị hoảng sợ\u000b – independent of: độc lập\u000b – short of: thiếu, không đủ","• TO\u000b – important to: quan trọng\u000b – likely to: có khả năng\u000b – agreeable to: có thể đồng ý\u000b – next to: kế bên\u000b – open to: mở\u000b – pleasant to: hài lòng\u000b – clear to: rõ ràng\u000b – contrary to: trái lại, đối lập\u000b – addicted to: đam mê\u000b – engaged to: đính hôn với\u000b – grateful to (sb): biết ơn ai\u000b – responsible to (sb): có trách nhiệm với ai\u000b – harmful to (sb)/for (sth): có hại cho ai/cho cái gì\u000b – acceptable to: có thể chấp nhận\u000b – accustomed to: quen với\u000b – useful to (sb): có ích cho ai\u000b – rude to: thô lỗ, cộc cằn\u000b – delightful to (sb): thú vị đối với ai\u000b – familiar to (sb): quen thuộc đối với ai\u000b – preferable to: đáng thích hơn\u000b – similar to: giống, tương tự\u000b – equal to: tương đương với, bằng\u000b – available to (sb): sẵn cho ai\u000b – favourable to: tán thành, ủng hộ","• FOR\u000b – difficult for: khó…\u000b – late for: trễ…\u000b – dangerous for: nguy hiểm…\u000b – famous for: nổi tiếng (về…)\u000b – greedy for: ham làm…\u000b – perfect for: hoàn hảo\u000b – fit for: thích hợp cho\u000b – ready for sth: sẵn sàng cho việc gì\u000b – sorry for sb/doing sth: tiếc (cho ai/vì đã làm điều gì)\u000b – responsible for sth: chịu trách nhiệm về việc gì\u000b – available for sth: có sẵn (cái gì…)\u000b – grateful for sth: biết ơn về việc…\u000b – convenient for: thuận lợi cho…\u000b – qualified for: có phẩm chất\u000b – necessary for: cần thiết\u000b – suitable for: thích hợp\u000b – helpful/useful for: có ích, có lợi\u000b – good/bad for: tốt/không tốt cho…","• AT\u000b – good at: giỏi (về…)\u000b – bad at: dở (về…)\u000b – clever at: khéo léo…\u000b – quick at: nhanh…\u000b – excellent at: xuất sắc về…\u000b – skillful at: khéo léo, có kỹ năng về…\u000b – angry at/about sth: khó chịu về điều gì\u000b – amazed at: kinh ngạc\u000b – surprised at: ngạc nhiên\u000b – shocked at: bị sốc\u000b – present at: hiện diện\u000b – amusing at: vui vẻ","• WITH\u000b – busy with: bận\u000b – popular with: phổ biến\u000b – pleased with: hài lòng\u000b – familiar with: quen thuộc\u000b – friendly with: thân mật\u000b – satisfied with: thỏa mãn với\u000b – disappointed with sth: thất vọng (về điều gì)\u000b – crowded with: đông đúc…\u000b – angry with sb: giận dữ (với ai)\u000b – contrasted with: tương phản với\u000b – annoyed with sb: khó chịu (với ai)\u000b – furious with sb: phẫn nộ\u000b – impressed with/by: ấn tượng","• ABOUT\u000b – sad about: buồn\u000b – upset about: thất vọng\u000b – doubtful about: nghi ngờ\u000b – angry about sth: tức giận (về…)\u000b – serious about: nghiêm túc\u000b – disappointed about sth: thất vọng về điều gì\u000b – happy about/with sb/sth: hạnh phúc, vui, hài lòng\u000b – confused about: bối rối (về…)\u000b – excited about: hào hứng\u000b – sorry about sth: xin lỗi (về điều gì)\u000b – worried about: lo lắng\u000b – anxious about: lo lắng","• IN\u000b – rich in: giàu về\u000b – successful in: thành công (về…)\u000b – confident in: tin cậy, tin tưởng (vào ai/cái gì)\u000b – interested in: thích, quan tâm\u000b – involved in sth: có liên quan tới…","• FROM\u000b – isolated from: bị cô lập\u000b – far from: xa\u000b – safe from: an toàn\u000b – absent from: vắng mặt (khỏi…)\u000b – different from: khác\u000b – divorced from: ly dị, làm xa rời","Some Cases to Note","Be tired of: chán\u000b Example:\u000b I'm tired of doing the same work every day.\u000b (Tôi chán làm cùng một công việc mỗi ngày.)","Be tired from: mệt vì\u000b Example:\u000b I'm tired from walking for a long time.\u000b (Tôi mệt vì phải đi bộ lâu.)","Be grateful to sb for sth: biết ơn ai về việc gì\u000b Example:\u000b I'm grateful to you for your help.\u000b (Tôi biết ơn vì sự giúp đỡ của bạn.)","Be responsible to sb for sth: chịu trách nhiệm với ai về việc gì\u000b Example:\u000b You have to be responsible to me for your actions.\u000b (Anh phải chịu trách nhiệm với tôi về hành động của mình.)","Good/Bad for: tốt/xấu cho...","Good/Bad at: giỏi/dở về...\u000b Example:\u000b Milk is good for health.\u000b (Sữa tốt cho sức khỏe.)\u000b He is good at English.\u000b (Anh ấy giỏi môn tiếng Anh.)","Be kind/nice to sb: tử tế/tốt với ai\u000b Example:\u000b Mary is very kind to me.\u000b (Mary rất tử tế với tôi.)","It's kind/nice of sb: thật tốt\u000b Example:\u000b It's very kind of you to help me.\u000b (Bạn thật tốt khi giúp đỡ tôi.)","DANH TỪ + GIỚI TỪ","FOR","a request for: sự yêu cầu","a wish for: sự mơ ước","preference for: sự ưu đãi","a need for: nhu cầu","an appetite for: sự khao khát","an order for: sự yêu cầu/mệnh lệnh","a demand for: nhu cầu (đối với sản phẩm)","a reason for: lý do (về điều gì đó)","a desire for: sự mong muốn","an application for: đơn xin","a cheque for: một tấm ngân phiếu","OF","a cause of: nguyên nhân (của ...)","a cost of: giá (của ...)","a hope of: niềm hy vọng (về ...)","a lack of: sự thiếu hụt (về ...)","an example of: ví dụ","an experience of: kinh nghiệm (về ...)","an opinion of: ý kiến (về ...)","an advantage/disadvantage of: điểm thuận lợi/bất lợi","a photograph/picture/map/plan... of: một tấm ảnh/một bức tranh/một tấm bản đồ/một kế hoạch (của ...)","IN","an increase/a decrease/a reduction/a rise/a fall in (the price/number of sth): sự gia tăng/sự sụt giảm (giá cả/số lượng của cái gì)\u000b Example:\u000b An increase/rise in the price.\u000b (Sự tăng giá.)\u000b A reduction/fall in the number of unemployment.\u000b (Sự sụt giảm số người thất nghiệp.)\u000b But:","An increase/rise of £10 (tăng 10 bảng)","A reduction/fall of 3% (giảm 3%)","TO","a damage to: sự hư hại (đối với ...)","a solution to/for (a problem): biện pháp giải quyết (một vấn đề)","a key to (a door): chìa khóa (mở cửa)","an answer to (a question): câu trả lời (cho một câu hỏi)","a reply to (a letter): thư phúc đáp","a damage to: sự hư hại (đối với ...)","a solution to/for (a problem): biện pháp giải quyết (một vấn đề)","a key to (a door): chìa khóa (mở cửa)","an answer to (a question): câu trả lời (cho một câu hỏi)","a reply to (a letter): thư phúc đáp","a reaction to: sự phản ứng (đối với ...)","an attitude to/towards: thái độ (đối với ...)","a contrast to: sự tương phản; sự trái ngược (với)","an invitation to (a party/a wedding, etc.): lời mời, thư mời (dự tiệc/đám cưới)","WITH/BETWEEN ***","a relationship/a connection/contact with (somebody/something): mối liên hệ/sự liên quan/sự tiếp xúc với (người nào đó/điều gì đó)","Tuy nhiên: a relationship/a connection/contact/contrast/difference between (two things or people): mối liên hệ/sự liên quan/sự tiếp xúc/sự trái ngược/sự khác nhau giữa (hai người/hai vật)","ĐỘNG TỪ + GIỚI TỪ","FOR","a request for: sự yêu cầu","a wish for: sự mơ ước","preference for: sự ưu đãi"]},{"title":"Phần ôn tập 16 · NGÀY 29-04","items":["a need for: nhu cầu","an appetite for: sự khao khát","an order for: sự yêu cầu/mệnh lệnh","a demand for: nhu cầu (đối với sản phẩm)","a reason for: lý do (về điều gì đó)","a desire for: sự mong muốn","an application for: đơn xin","a cheque for: một tấm ngân phiếu","OF","a cause of: nguyên nhân (của ...)","a cost of: giá (của ...)","a hope of: niềm hy vọng (về ...)","a lack of: sự thiếu hụt (về ...)","an example of: ví dụ","an experience of: kinh nghiệm (về ...)","an opinion of: ý kiến (về ...)","an advantage/disadvantage of: điểm thuận lợi/bất lợi","a photograph/picture/map/plan... of: một tấm ảnh/một bức tranh/một tấm bản đồ/một kế hoạch (của ...)","IN","an increase/a decrease/a reduction/a rise/a fall in (the price/number of sth): sự gia tăng/sự sụt giảm (giá cả/số lượng của cái gì)\u000b Example:\u000b An increase/rise in the price.\u000b (Sự tăng giá.)\u000b A reduction/fall in the number of unemployment.\u000b (Sự sụt giảm số người thất nghiệp.)\u000b But:","An increase/rise of £10 (tăng 10 bảng)","A reduction/fall of 3% (giảm 3%)","TO","a damage to: sự hư hại (đối với ...)","a solution to/for (a problem): biện pháp giải quyết (một vấn đề)","a key to (a door): chìa khóa (mở cửa)","an answer to (a question): câu trả lời (cho một câu hỏi)","a reply to (a letter): thư phúc đáp","a damage to: sự hư hại (đối với ...)","a solution to/for (a problem): biện pháp giải quyết (một vấn đề)","a key to (a door): chìa khóa (mở cửa)","an answer to (a question): câu trả lời (cho một câu hỏi)","a reply to (a letter): thư phúc đáp","a reaction to: sự phản ứng (đối với ...)","an attitude to/towards: thái độ (đối với ...)","a contrast to: sự tương phản; sự trái ngược (với)","an invitation to (a party/a wedding, etc.): lời mời, thư mời (dự tiệc/đám cưới)","WITH/BETWEEN ***","a relationship/a connection/contact with (somebody/something): mối liên hệ/sự liên quan/sự tiếp xúc với (người nào đó/điều gì đó)","Tuy nhiên: a relationship/a connection/contact/contrast/difference between (two things or people): mối liên hệ/sự liên quan/sự tiếp xúc/sự trái ngược/sự khác nhau giữa (hai người/hai vật)","Put in at, on or in","1. Mozart was born in Salzburg ___IN____ 1756.","2. I haven’t seen Kate for a few days. I last saw her ___on____ Tuesday.","3. The price of electricity is going up ___in___ October.","4. I’ve been invited to the wedding ___ON__ 14 February.","5. Hurry up! We’ve got to go __IN__ five minutes. in + khoảng thgian = trong bao lâu đó","6. I’m busy now but I’ll be with you in_______ a moment.","7. Jenny’s brother is out of work __at_ the moment = now.","8. There are usually a lot of parties ___at____ New Year’s Eve.","9. I hope the weather will be nice ____at___ the weekend.","10. Saturday night I went to bed ___at___ 11 o’clock.","11. I don’t like travelling ___at___ night. in the evening","12. We travelled overnight to Paris and arrived ____at___ 5 o’clock _______in the morning.","13. The course begins ___on___ 7 January and ends sometime ___in____ April.","14. It was quite a short book and easy to read. I read it ____in___ a day.  in + khoảng thgian = trong bao lâu đó","15. The telephone and the door bell rang ____at___ the same time = cùng một lúc","16. I might not be at home ___on__ Tuesday morning but I’ll probably be there ___in____ the afternoon.","17. Mary and Henry always go out for a meal ____at/on___ their wedding anniversary.","18. Henry is 63. He’ll be retiring from his job ___in____ two years’ time.","19. My car is being repaired at the garage. It will be ready ___in____ two hours.","20. We sat ___in___ the shade. It was too hot to sit ___in/under___ the sun.","21. Did you go to Germany ___on___ business or ___on___ holiday?","22. Can I pay ___by___ credit card? → Yes, of course. But it’s cheaper if you pay ___in___ cash.","23. He got married ___at___ 17, which is rather young to get married.","24. There was an interesting program ___on___ the radio this morning.","25. __In____ my opinion, violent films should not be shown ___on___ television.","26. When you do the exam, you’re not allowed to write ___on___ pencil.","27. The earth travels around the sun ___at___ a speed of 107,000 kilometers an hour.","28. Look! That car is ___on___ fire! Please call the fire brigade.","29. I pressed the wrong number ___by___ mistake."]},{"title":"Phần ôn tập 17 · NGÀY 29-04","items":["30. It’s a long journey. Let’s stop somewhere ___on___ the way and have a meal.","Complete the advertisement for a supermarket. Put in between, for, in, of, with.","Student 1:","Why not shop at Greenway Supermarket? You’ll find the cost (1) __of____ your weekly shopping is much lower. There’s quite a contrast (N)(2) __between___ other stores. Here’s one example (3) ___of___ this: from today many of our products have a price reduction (4) __of___ five percent! But this is not the only one reason (5) ___for___ Greenway’s success. We’re proud of our good relationship (6) ___with___ our customers. We believe there is simply no substitute (7) ___for___ quality. And there is no lack (8) ___of___ choice at Greenway. That’s the difference (9) __between____ Greenway and ordinary stores.","Say what these people’s feelings are. Use the adjective in brackets and a preposition.","Student example:","The children are going on a trip to the zoo. (excited)\u000bThey’re excited about the trip to the zoo.","Vicky doesn’t like the dark. (afraid)\u000bShe’s afraid of the dark.","Student 1:\u000b3. Nick is watching a video, but he is going to switch it off. (bored)\u000bHe’s bored of watching a video","4. Emma is readi
