ng about computers. (interested)\u000bShe’s interested in reading about computers","Student 2:\u000b5. Mark has just heard some news that he didn’t expect. (surprised)\u000bHe’s surprised at some news","United have won a victory. (proud)\u000bThey’re proud of their victory","Student 3:\u000b7. Olivia’s children are being very silly. (annoyed)\u000bShe’s annoyed with her children for being very silly","The Zedco staff don’t think their pay increase is big enough. (satisfied)\u000bThey aren’t satisfied with their pay increase","Student 4:\u000b9. I’m not used to speaking in front of the crowd. (nervous)\u000bI’m nervous about speaking in front of the crowd","10. Our team lost in the final. (disappointed)\u000b\tWe’re all disappointed about the loss in the final","Fill in the Blanks","The book is _on__ the table. (on/in/under)","She arrived _at__ the airport just in time. (to/at/in)","We are going _at__ a picnic tomorrow. (on/for/at)","He is good __at_ playing the guitar. (at/on/in)","The cat jumped _over__ the wall. (off/on/over)","Choose the Correct Preposition","She is afraid _of__ spiders.","(of, to, with)","This gift is _for__ my best friend.","(for, to, with)","They have been living here _in__ 2010.","(since, for, by)","The train goes _through__ the tunnel.","(through, over, under)","He will come _at__ 5 PM.","(on, at, in)","Correct the Errors","He is interested in learning new languages.","We are going on a vacation next week.","The keys are on the tables.","She is married to a doctor.","Please listen to what I am saying.","Match the Prepositions","Match the sentences to the correct preposition:","I will meet you _a__ (a) at the mall.","The ball rolled _b__ (b) to the garden.","She is always kind _e__ (c) under the bed.","The dog is hiding _c__ (d) with her neighbors.","He is moving _d__ (e) towards people.","Answers: (Match each sentence with the correct preposition.)","Create Your Own Sentences","Write three sentences using the preposition in.","The keys are in the drawer.","I’m live in HCM city","I.m going to hang out in the afternoon.","Write three sentences using the preposition on.","I’m planning to eat outside with my friend on the weekend.","I’m arrange all the things on my desk.","I’m live on 40 street, 10 10 number, Bình Thuận Ward, District 7, HCM, city","Write three sentences using the preposition under.","My dog ís hiding under the table","The building center is under construction in the summer.","My younger sister is under age to drive a motorbike.","Prepositions of Time","Fill in the blanks with appropriate prepositions:","She was born __in_ July. (in/on/at)","The meeting is scheduled _at__ 5 PM. (in/on/at) _giờ cụ thể","He goes jogging _in__ the morning. (on/in/at)","They moved to this city _in__ 2005. (in/on/at)","The event will take place __on_ Monday. (on/in/at)","PRACTICE MORE","Phần 1: Điền từ đúng vào chỗ trống","The cause of the fire at the hotel last night is still unknown.\u000b → Cause of = the reason something happened."]},{"title":"Phần ôn tập 18 · NGÀY 29-04","items":["The advantage of living alone is that you can do what you like.\u000b → Advantage of = a benefit or positive side of something.","Money isn’t the solution to every problem.\u000b → Solution to = the answer or fix for a problem.","There has been an increase in the number of road accidents recently.\u000b → Increase in = a rise or growth in the quantity or number of something.","There are some differences between British and American English.\u000b → Differences between = ways in which two things are not the same.","When Paul left home, his attitude towards his parents seemed to change.\u000b → Attitude towards = someone's feelings or opinions about someone or something.","The firm closed down because there wasn’t enough demand for its product.\u000b → Demand for = how much people want or need a product.","When I opened the envelope, I was delighted to find a cheque for £500.\u000b → Cheque for = a written order to pay a specific amount of money.","Bill and I used to be good friends but I don’t have much contact with him now.\u000b → Contact with = communication or connection with someone.","Carol has decided to give up her job. I don’t know her reason for doing this.\u000b → Reason for = the explanation or cause behind an action.","I’ve had an invitation to Laura’s barbecue.\u000b → Invitation to = a request to attend an event.","The accident caused some damage to the car.\u000b → Damage to = harm or injury to something.","Unfortunately there was some difficulty with the arrangement.\u000b → Difficulty with = a problem or trouble related to something.","We need to provide more shelters for the homeless, so there’s a need for more houses.\u000b → Need for = something necessary or required.","The two companies are completely independent. There is no connection between them.\u000b → Connection between = a relationship or link between two things.","Phần 2: Put in the correct preposition","I was delighted with the present you gave me.","It was very nice of you to do my shopping.","Were you disappointed with your exam results?","We always have the same food every day. I’m fed up with it.","I can’t understand the people who are cruel to animals.","Linda doesn’t look very well. I’m worried about her.","It was a bit careless of you to leave the door unlocked.","Are you angry about what happened?","I’m sorry about what I said. I hope you’re not angry with me.","The people next door are furious with us for making so much noise last night.","Are you excited about going on holiday next week?","I was shocked at what I saw.","We weren’t very impressed with his appearance.","I felt sorry for the children when we went on holiday.","His letter was full of mistakes.","The Italian city of Florence is famous for its art treasures.","Kate is very fond of her younger brother.","Are you afraid of snakes? – Yes, I’m terrified of them.","You don’t seem interested in what I’m saying.","Did you know that Liz is engaged to a friend of mine?","I’m not ashamed of what I did. In fact, I’m quite proud of it.","I suggested we should all go out for a meal but nobody else was keen on the idea.","These days everybody is aware of the dangers of smoking.","The station was crowded with people waiting for the train.","Why are you always so jealous of other people?","I’m tired of doing the same thing every day.","Her children have all been successful in their chosen careers.","I’m a bit short of money. Can you lend me some?","I’m not very good at repairing things.","The film is different from what I’d expected.","I’m sure you are capable of passing the exam.","Who was responsible for all that noise last night?","Our house is similar to yours. Perhaps yours is a bit larger.","She’s totally dependent on her parents.","Many young people want to be independent of their parents nowadays.","He didn’t trust me. He was suspicious of me.","Mạo từ - A đi với phụ âm","-AN đi với nguyên âm uể oải","a table","an iphone","—-----","THE","A boy walked into a park. The boy saw a snake in the park. The snake bit the boy.","Mạo từ trong tiếng Anh (Articles) là những từ dùng để nhận biết danh từ được nhắc đến là xác định hay không xác định. Mạo từ đứng trước danh từ và chức năng của nó là dùng để bổ nghĩa cho danh từ.","Mạo từ bất định (Indefinite article)","Mạo từ bất định gồm “a” và “an”","Mạo từ “a” thường đi kèm với danh từ đếm được số ít, và đứng trước danh từ bắt đầu bằng một phụ âm.","Ví dụ: a dog (một con chó), a pencil (một cây bút chì), a person (một người).","Mạo từ “an” thường đi kèm với danh từ đếm được số ít và danh từ bắt đầu bằng nguyên âm (e, u, i, o, a) hoặc âm “h” câm.","Ví dụ: an elephant (một con voi), an orange (một quả cam),…","Mạo từ xác định (Definite article)","Mạo từ xác định “the” thường dùng cho những đối tượng được xác định cụ thể, cả người nói và người nghe đều biết rõ về đối tượng được đề cập. “The” đứng trước danh từ và thường sử dụng cho danh từ đếm được ở số ít hoặc danh từ không đếm được ở số nhiều.","Ví dụ: the girl (cô gái), the cat (con mèo),…","Trường hợp không sử dụng mạo từ","– Không sử dụng mạo từ với các quốc gia, tiểu bang, tỉnh, hồ, núi,… in Vietnam, in HCMC,"]},{"title":"Phần ôn tập 19 · NGÀY 29-04","items":["– Không sử dụng mạo từ với danh từ số nhiều và danh từ không đếm được để nói về các đối tượng một cách tổng quát.","He writes books.","She likes sweets.","Do you like jazz music?","She ate bread with butter in the morning.","I drink water","I. Put in a/an where necessary. If no word is necessary, leave an empty space. 9h18 sửa","What’s wrong with you? Have you got_a__  headache?","I know __a_lot of people. Most of them are  ___students.","When I was _a_child, I used to be very shy.","Would you like to be _a_actor?    a/an + nghề nghiệp","I don’t like _xxx__violence (trừu tượng).","Do you collect _xx__stamps?","I don’t feel very well this morning. I’ve got __a_sore throat.","I’ve been walking for three hours. I’ve got _a__sore feet.","Jack is __an_engineer. His parents were _xx__engineers too.","I don’t believe him. He’s __a_liar. He’s always telling ___lies.","What _a_beautiful garden!","I clean_xxx_my teeth with _xxx__toothpaste. I use _a__toothbrush to clean___my teeth.","Enjoy your holiday! I hope you have _xxx__good weather.","John has got __an_interview for _the_job tomorrow.","II. Put in the where necessary. If you don’t need it, leave an empty space.","I haven’t been to __a_cinema for ages.","I lay down on _a__ground and looked up at _the__sky.","She spends most of her free time watching _a__television.","_A__television was on but nobody was watching it.","Have you had _a__dinner yet?","Mary and I arrived at _the__same time.","You’ll find _ân__information you need at _the__top of page 15.","Peru is a country in _the__South America. _the__capital is Lima.","What is _the__longest river in _the__world?","_A__man is in _a__prison. He went to _the__prison two years ago. His wife goes to _the__prison to visit him every month.","III. Complete this story. Put in a/an or the.","_A_ man decided to rob (2) _a___ bank in the town where he lived. He walked into (3) ___the_ bank and handed (4) __a__ note to one of (5) __the__ cashiers. (6) _A_ cashier read (7) __the__ note, which told her to give (8) __the__ man some money. Afraid that he might have (9) __a__ gun, she did as she was told. (10) _the___ man then walked out of (11) __the__ building, leaving (12) __the__ note behind. However, he had no time to spend (13) _the_ money because he was arrested (14) __the__ same day. He had made (15) __a__ mistake. He had written (16) __the__ note on (17) __the__ back of (18) __a__ envelope. And on (19) __the_ other side of (20) _the_ envelope was his name and address. This clue was quite enough for (21) __the__ detectives on the case. (theo vụ án này)","Fill in the Blanks","I saw _an__ elephant at the zoo. (a/an/the)","She bought __an_ apple and _a__ banana from the market. (a/an/the)","We stayed at __the_ hotel near the beach. (a/an/the)","_A__ moon looks beautiful tonight. (a/an/the)","He is _a__ honest man. (a/an/the)","Choose the Correct Article","I need _an__ hour to finish this work.","(a, an, the)","She is reading _an__ interesting book.","(a, an, the)","_The__ sun rises in the east.","(a, an, the)","We went to __a_ park yesterday.","(a, an, the)","He saw _an__ unique opportunity and seized it.","(a, an, the)","Correct the Errors","I saw an eagle flying in the sky.","Please give me an pen from the table.=>a","She is an actress in a famous movie.=>the","The lion is the king of the jungle.=> a","We are looking for a house near the school.","Complete the Sentences","There is _the__ cat sitting on the wall.","We stayed in _an__ expensive hotel during our trip.","_The__ Amazon River is one of the longest rivers in the world.","He wants to buy __an_ umbrella because it’s raining.","_The__ earth revolves around the sun.","Match the Rule","Match the sentence to the correct rule for using articles:","Use \"a\" before singular nouns that start with a consonant sound.","Use \"an\" before singular nouns that start with a vowel sound.","Use \"the\" for specific or unique things.","Sentences:","_An__ elephant walked through the forest."]},{"title":"Phần ôn tập 20 · NGÀY 29-04","items":["He ate _an__ apple for breakfast.","_The__ Eiffel Tower is in Paris.","Write Your Own Sentences","Write three sentences using \"a.\"","I see a drone in the sky","I want to buy a new laptop","I have a gift from a new friend","Write three sentences using \"an.\"","I'm taking an interesting new course","I need an envelope to send this letter.","I spent an hour practicing speaking by myself.","Write three sentences using \"the.\"","The sun rises in the east","We visited the pagoda on the upcoming buddhist holiday.","There are many stray dogs in the city so i’m just walk past, it bit me and ran away.","PRACTICE MORE","1.","A: Look outside. The sky is getting very dark.\u000b B: I hope there isn’t going to be a storm.","2.","A: I’m going out for a walk. Have you seen my shoes?\u000b B: Yes, they’re on the floor in the kitchen.","3.","A: Would you like a tomato? There’s one in the fridge.\u000b B: Oh, yes, please. I’ll make myself a cheese and tomato sandwich.","4.","A: If you are going into the city center, can you post these letters for me?\u000b B: Yes, I’ll take them to the main post office.","5.","A: I’ve got a problem with my phone bill. Can I see someone about it?\u000b B: Yes, go to the fifth floor. The lift is along the corridor.","6.","A: I didn’t know Melanie had a dog.\u000b B: It isn’t hers. She’s just taking it for a walk while the owner is away.","7.","A: I’ve got a headache. I’ve had it all day.\u000b B: Why don’t you go to the health center?","8.","A: Guess what I found. A £50 note on the pavement this morning.\u000b B: You really ought to take it to the police station.","9.","A: How was your trip to the coast?\u000b B: Wonderful. The sun shone all day. We had a great time.","10.","A: What’s your brother doing now? Has he got a good job?\u000b B: Yes, he’s a soldier. He’s in the army. He loves it. It’s a great life, he says.","11.","A: I went to see Doctor Pascoe yesterday. She’s the best doctor I’ve ever had.\u000b B: She’s very nice, isn’t she? You couldn’t meet a nicer person.","12.","A: Why were you late for your meeting?\u000b B: Well, first I had to go to the hotel I’d booked into. I took a taxi from the airport, and the driver got completely lost. It was a terrible nuisance. The man was a complete idiot.","13.","A: Is this the book you were telling me about?\u000b B: Yes, it’s a really interesting story.","14.","A: What did you say it’s about?\u000b B: It’s a science fiction story. It’s about the beginning of the universe.","15.","A: You were waiting for a long time at the supermarket.\u000b B: Yes, I know. There was an enormous queue. I was thinking of complaining to the manager."]},{"title":"Buổi 4: Comparison - Listening carnation, ordination","items":["Buổi 4: Comparison - Listening carnation, ordination"]},{"title":"NGÀY 06-05","items":["NGÀY 06-05","Slide:","Homework Comparison: https://forms.gle/CmWR8Eqnof7z91Y18","Homework Cardinals_Ordinals: https://forms.gle/Y3iJrJkP8DVKZvEb7","📘 1. So sánh hơn (Comparative Form)","✅ Công thức:","Tính từ ngắn: adj + er + than (nếu có so sánh)","Tính từ dài: more + adj + than","Một số trường hợp đặc biệt cần gấp đôi phụ âm cuối hoặc đổi y → ier","📝 Bài tập:","It’s too noisy here. Can we go somewhere quieter?\u000b  → adj “quiet” → thêm “er” → “quieter” (trường hợp đặc biệt)","The dining room is so small. I like it a bit bigger.\u000b  → “big” có cấu trúc CVC (nguyên âm kẹp giữa 2 phụ âm) → gấp đôi phụ âm cuối","The exam was surprisingly easy. I expected it to be harder.\u000b  → “hard” là tính từ ngắn → thêm “-er”","The weather is too cold. I’d like to live somewhere warmer.\u000b  → “warm” là tính từ ngắn → thêm “-er”","You were a bit depressed. You look happier today.\u000b  → “happy” → bỏ “y” thêm “ier”","You’re too near the camera. Can you move farther/further away?\u000b  → Cả “farther” và “further” đều đúng","Your work isn’t very good. I’m sure you can do better.\u000b  → So sánh bất quy tắc của “good” → “better”","You’re driving too fast. Could you drive slower / more slowly?\u000b  → Cả hai đều đúng, “slower” (adj), “more slowly” (adv)","My job is boring. I’d like to do something more interesting.\u000b  → “interesting” là tính từ dài → more + adj","You hardly ever phone me. Why don’t you phone me more often?\u000b  → Trạng từ “often” → more often","Don’t worry. The situation isn’t so bad. It could be worse.\u000b  → So sánh bất quy tắc của “bad” → “worse”","The hotel was cheap. I expected it to be more expensive.\u000b  → “expensive” là tính từ dài → more + adj","This coffee is weak. I like it a bit stronger.\u000b  → “strong” là tính từ ngắn → thêm “-er”","📘 2. So sánh nhất (Superlative Form)","✅ Công thức:","Complete the sentences. Use a superlative (-est or most) and a preposition (if necessary).","✏️ Ví dụ & Giải thích chi tiết:","This room is nice.\u000b 👉 It’s the nicest room in the hotel.\u000b 🔍 Giải thích: \"Nice\" là tính từ ngắn → thêm “-est” → \"nicest\".","Susan is very beautiful.\u000b 👉 She’s the most beautiful girl I’ve ever met.\u000b 🔍 Giải thích: \"Beautiful\" là tính từ dài (≥ 3 âm tiết) → dùng \"the most + adj\".","It was a very happy day.\u000b 👉 It was the happiest day of my life.\u000b 🔍 Giải thích: \"Happy\" → đổi \"y\" thành \"i\" + est = \"happiest\".","She’s a very intelligent student.\u000b 👉 She’s the most intelligent student in the class.","The speech was very boring.\u000b 👉 It was the most boring speech I’ve ever heard.","It’s a very large company.\u000b 👉 It’s the largest in the town.\u000b 🔍 Giải thích: \"Large\" kết thúc bằng một phụ âm sau nguyên âm → gấp đôi phụ âm → \"largest\".","August is very wet.\u000b 👉 It’s the wettest month of the year.\u000b 🔍 Giải thích: \"Wet\" → gấp đôi \"t\" → \"wettest\".","The meal was delicious.\u000b 👉 That was the most delicious meal I’ve had for a long time.","Matthew always drives carefully.\u000b 👉 He drives the most carefully of all the drivers.\u000b 🔍 Giải thích: “Carefully” là trạng từ → dùng “the most + adv”.","She is a very good player.\u000b 👉 She is one of the best players on the team.\u000b 🔍 Giải thích: \"Good\" là bất quy tắc → so sánh nhất là “best”.","Manchester United is a very famous football team.\u000b 👉 They’re one of the most famous in the world.","Melanie is a quick child.\u000b 👉 She reacts the quickest of the three sisters.\u000b 🔍 Giải thích: “Quick” là tính từ ngắn → thêm “-est”.","It was a very bad experience.\u000b 👉 It is one of the worst in my life.\u000b 🔍 Giải thích: “Bad” là tính từ bất quy tắc → so sánh nhất là “worst”.","It’s a very valuable painting.\u000b 👉 It’s the most valuable painting in the gallery.\u000b 🔍 Sửa lỗi: Câu gốc thiếu danh từ “painting” và giới từ “in”.","Spring is a very busy time for me.\u000b 👉 It’s the busiest time of the year.\u000b 🔍 Giải thích: “Busy” → bỏ “y” + iest = \"busiest\".","💡 Mẹo ghi nhớ:","Tính từ ngắn (1 âm tiết): ➕ -est\u000b → tall → the tallest","Tính từ dài (≥2 âm tiết): ➕ the most + adj\u000b → intelligent → the most intelligent","Bất quy tắc:\u000b → good → the best\u000b → bad → the worst","So sánh bằng","Complete the sentences using    ...   . Choose one of the following words.","expensive, comfortable, fast, long, quietly, soon, well, often, quickly, much, strong, exciting","📘 So sánh bằng (As...as)","✅ Yêu cầu:\u000b Hoàn thành các câu sau bằng cách sử dụng cấu trúc so sánh bằng:","as + tính từ/trạng từ + as\u000b Chọn từ phù hợp trong danh sách sau:\u000b 📌 expensive, comfortable, fast, long, quietly, soon, well, often, quickly, much, strong, exciting","✏️ Bài làm + Giải thích chi tiết:","I don’t earn as much as I’d like.\u000b 🔍 Giải thích: \"Much\" dùng cho số lượng → so sánh số tiền kiếm được.","Oh, don’t sit there. The stool isn’t as comfortable as the armchair.\u000b 🔍 So sánh tính từ \"comfortable\" (thoải mái) giữa 2 đồ vật.","I didn’t want to wake anybody, so I came in as quietly as I could.\u000b 🔍 So sánh trạng từ \"quietly\" (một cách yên lặng).","We can’t do crosswords as well as you do.\u000b 🔍 So sánh trạng từ \"well\" (giỏi, tốt) giữa người nói và \"you\".","I’m sorry I’m a bit late. I got here as soon as I could.\u000b 🔍 So sánh trạng từ \"soon\" (sớm).","We like to keep fit, so we go swimming as often as we can.\u000b 🔍 So sánh trạng từ \"often\" (thường xuyên).","It was a difficult question. I answered it as quickly as I could.\u000b 🔍 So sánh trạng từ \"quickly\" (một cách nhanh chóng).","I prefer surfing to swimming. Swimming isn’t as exciting as surfing.\u000b 🔍 So sánh tính từ \"exciting\" (thú vị) giữa 2 môn thể thao.","How long can we stay with you?\u000b ~ You can stay as long as you like.\u000b 🔍 So sánh thời gian (long).","Why don’t you buy a motorbike? A motorbike isn’t as expensive as a car.\u000b 🔍 So sánh tính từ \"expensive\" (đắt tiền).","I need the information quickly, so please let me know as soon as possible.\u000b 🔍 Cụm cố định: as soon as possible (càng sớm càng tốt).","I don’t like these plastic screws. Plastic isn’t as strong as metal.\u000b 🔍 So sánh tính từ \"strong\" (bền chắc).","📘 So sánh lũy tiến (Comparative Progressive Form)","✅ Cấu trúc:","Với tính từ ngắn (1 âm tiết) → ...er and ...er\u000b (e.g., bigger and bigger)","Với tính từ dài (≥2 âm tiết) → more and more + adjective\u000b (e.g., more and more beautiful)","✏️ Bài tập + Giải thích chi tiết"]},{"title":"Phần ôn tập 23 · NGÀY 06-05","items":["This subject gets harder and harder all the time.\u000b 🔍 \"Hard\" là tính từ ngắn → dùng -er and -er.","I’m just getting more and more confused.\u000b 🔍 \"Confused\" là tính từ dài → dùng more and more.","It’s becoming more and more difficult for me to keep up.\u000b 🔍 \"Difficult\" là tính từ dài → more and more.","The textbook just gets more and more complicated.\u000b 🔍 \"Complicated\" dài → more and more.","I spend more and more time on my work.\u000b 🔍 \"Much\" → danh từ không đếm được → dùng more and more.","My list of things to do gets longer and longer.\u000b 🔍 \"Long\" là tính từ ngắn → -er and -er.","I waited for my interview, I became more and more nervous.\u000b 🔍 \"Nervous\" là tính từ dài → more and more.","My problem is just getting worse and worse.\u000b 🔍 \"Bad\" có dạng so sánh bất quy tắc là worse → worse and worse.","Since she has been in Britain, her English has got better and better.\u000b 🔍 \"Good\" → bất quy tắc: better → better and better.","My bags seemed to get heavier and heavier as I carried them.\u000b 🔍 \"Heavy\" → tận cùng bằng y chuyển thành -ier and -ier.","Travelling is becoming more and more expensive.\u000b 🔍 \"Expensive\" là tính từ dài → more and more.","That hole in your pullover is getting bigger and bigger.\u000b 🔍 \"Big\" là tính từ ngắn → -er and -er.","💡 Ghi nhớ nhanh:","Trường hợp","Cấu trúc","Ví dụ","Tính từ ngắn (1 âm tiết)","Adj-er and Adj-er","colder and colder","Tính từ dài (≥2 âm tiết)","More and more + Adj","more and more beautiful","Bất quy tắc","Ví dụ: good → better and better","worse and worse","So sánh kép (càng … càng …)","Complete each sentence using the information in brackets and the structure with two comparatives.","Example: (The rent is high.)\u000bThe bigger a flat is, the higher the rent is.","The + comparative + S + V, The + comparative + S + V","Không có tính từ so sánh","The more + S + V, The + comparative + S + V","(You learn quickly.)\u000bThe younger you are, the more quickly you learn.","(The roads are quiet.)\u000bThe earlier you leave, the quieter the roads are.","(The choice is wide.)\u000bThe bigger a supermarket is, the wider the choice is.","(I get confused.)\u000bThe more I try to work this out, the more confused I get_____.","(You can speak fluently.)\u000bThe more you practice, the more fluently you can speak_____.","(The beaches get crowded.)\u000bThe better the weather is, the more crowded the beaches get_____.","(She became impatient.)\u000bThe longer she waited, the more impatient she became___.","(It’s hard to concentrate.)\u000bThe more tired you are, the harder it is to concentrate","(The product is reliable.)\u000bThe higher the price, the more reliable the product is","fvvdfb","📘 So sánh kép (Double Comparative)","✅ Cấu trúc 1:","The + comparative adj/adv + S + V, the + comparative adj/adv + S + V\u000b ➡ Dùng khi có tính từ/trạng từ so sánh.","🔸 The bigger a city is, the more expensive it is to live in.","✅ Cấu trúc 2 (Không dùng tính từ trực tiếp):","The more + S + V, the + comparative + S + V\u000b ➡ Dùng khi cần dùng mệnh đề làm chủ ngữ.","🔸 The more you study, the better your results will be.","✏️ Bài tập + Giải thích chi tiết","(The flat is big – The rent is high)\u000b 👉 The bigger a flat is, the higher the rent is.\u000b 🔍 “Big” và “high” là tính từ ngắn → dùng comparative adj + S + V.","(You learn quickly – You are young)\u000b 👉 The younger you are, the more quickly you learn.\u000b 🔍 So sánh tuổi và trạng từ “quickly” → áp dụng cả 2 cấu trúc.","(The roads are quiet – You leave early)\u000b 👉 The earlier you leave, the quieter the roads are.","(The choice is wide)\u000b 👉 The bigger a supermarket is, the wider the choice is.","(I get confused – I try to work this out)\u000b 👉 The more I try to work this out, the more confused I get.","(You can speak fluently – You practice)\u000b 👉 The more you practice, the more fluently you can speak.","(The beaches get crowded – The weather is good)\u000b 👉 The better the weather is, the more crowded the beaches get.","(She became impatient – She waited)\u000b 👉 The longer she waited, the more impatient she became.","(It’s hard to concentrate – You are tired)\u000b 👉 The more tired you are, the harder it is to concentrate.","(The product is reliable – The price is high)\u000b 👉 The higher the price, the more reliable the product is.","📌 Mẹo học nhanh:","Mẫu câu","Dùng khi","The + adj/adv (so sánh hơn), the + adj/adv (so sánh hơn)","So sánh 2 tính từ/trạng từ","The more + S + V, the + adj/adv (so sánh hơn) + S + V","Khi chủ ngữ là hành động, câu dài","Slide:","Homework Present Simple, Present Continuous, and Speaking Part 1_Hometown: https://forms.gle/R2mP6zEujdSuv6C79\u000b\u000b1. The River Nile flows into the Mediterranean. (sự thật hiển nhiên)","🔹 Giải thích: “flow” → diễn tả một sự thật hiển nhiên, dùng hiện tại đơn.","2. This book is mine. That one belongs to Pierre."]},{"title":"Phần ôn tập 24 · NGÀY 06-05","items":["🔹 Giải thích: “belong” là động từ chỉ trạng thái, không dùng ở thì tiếp diễn → dùng hiện tại đơn.","3. Look at Joan. She is biting her fingernails. She must be nervous.","🔹 Giải thích: hành động đang diễn ra ngay lúc nói → dùng hiện tại tiếp diễn.","4. We usually grow vegetables in our garden.","🔹 Giải thích: “usually” → chỉ thói quen → dùng hiện tại đơn.","5. Let’s go out. It is not raining now.","🔹 Giải thích: hành động xảy ra ngay bây giờ, có “now” → dùng hiện tại tiếp diễn (phủ định).","6. Every morning, the sun shines in my bedroom window and wakes me up.","🔹 Giải thích: “every morning” → thói quen lặp lại → dùng hiện tại đơn cho cả hai động từ.","7. Jim is very untidy. He (always) is always leaving his things all over the place.","🔹 Giải thích: “always + V-ing” dùng để phàn nàn về thói quen gây khó chịu → dùng hiện tại tiếp diễn đặc biệt.","8. Ann seems very happy at the moment.","🔹 Giải thích: “seem” là động từ chỉ trạng thái, không dùng thì tiếp diễn → dùng hiện tại đơn.","9. He’s a photographer. He takes a lot of photos.","🔹 Giải thích: Nói về nghề nghiệp / thói quen thường xuyên → dùng hiện tại đơn.","10. Oh! What’s the matter with your hand? It is bleeding.","🔹 Giải thích: Hành động đang xảy ra ngay lúc nói → dùng hiện tại tiếp diễn.","Put the verb in the correct form, present simple or present progressive:","A: What are you doing (you/do)?\u000b B: I am writing (write) to my parents. I write (write) to them every weekend.","A: Look, it is snowing (snow).\u000b B: It’s beautiful! This is the first time I’ve ever seen snow. It doesn’t snow (not snow) in my country.","A: Oh, that’s Adrian. He’s new here.\u000b B: Really? Where does he live (he/live)? Do you know (you/know)?\u000b A: Yes. He lives (live) in Milan, but now he is staying (stay) with his aunt on Shirley Road.","A: What time do you usually finish (you/usually/finish) work?\u000b B: Normally I finish (finish) work at five o’clock, but this week I am working (work) until six to earn a bit more money.","A: How do you travel (you/travel) to work?\u000b B: I haven’t got a car at the moment, so I am going (go) to work on the bus this week. Usually, I drive (drive) to work.","A: I think we’re going the wrong way.\u000b B: I don’t think so. The sun rises (rise) in the east, remember. It’s behind us, so we are travelling (travel) west.","A: Are you looking (you/look) for someone?\u000b B: Yes, I need (need) to speak to Neil. Is he in?\u000b A: Yes, but I think (think) he’s busy. He is talking (talk) to the boss at the moment.","A: I want (want) a new computer. I am saving (save) up to buy one.\u000b B: But computers cost (cost) so much money. What’s wrong with the one we’ve got?\u000b A: It is getting (get) out of date now.","A: Your new dress looks (look) very nice.\u000b B: Thank you. The trouble is it doesn’t fit (not fit) properly. I don’t know (not know) why I bought it, really.","A: What are you doing (you/do)?\u000b B: I am tasting (taste) the sauce. It tastes (taste) too salty.","A: I think (think) this road is really dangerous. Look how fast that lorry is going (go).\u000b B: I agree (agree). People shouldn’t go so fast.","A: My two children don’t get along. It seems they are always fighting (always/fight) about something.\u000b B: Don’t worry. It will be better when they grow (grow) up.","A: Could you post the goods to me, please?\u000b B: Yes, certainly.\u000b A: I am living (live) at a guest house at the moment as I am looking (look) for a flat. So could you send it to my work address?\u000b B: Of course. And you’ll have the goods by the end of the week, I promise (promise).","A: I am always falling (always/fall) asleep. I just can’t keep awake.\u000b A: What time do you go (you/go) to bed?\u000b B: About ten o’clock usually. But it doesn’t make (not/make) any difference.","A: Why do you want (you/want) to change the whole plan?\u000b B: I’m just not happy with it.\u000b A: And I don’t understand (not/understand) why you are (be) so difficult about it.","Supply the correct verb form: Present tenses:","Listen! I think (think) someone is knocking (knock) at the door.","We don’t know (not/know) why Sarah is upset now, but she hasn’t spoken (not/speak) to us for ages.","The earth circles (circle) the sun once every 365 days.","Why are you staring (you/stare) at me? I suppose you haven’t seen (not/see) a woman on a motorbike before!","How many times have you seen (you/see) him since he went to Edinburgh?","Trevor and Laura like Scrabble. They play (play) it most evenings.","The number of vehicles on the road is increasing (increase).","“Sorry I’m late.” – “That’s all right. I haven’t been waiting (not/wait) long.”","Mrs. Green always goes (go) to work by car, but this week she is travelling (travel) by bus.","We are (be) from France. We have been (be) there for 20 years.","These flowers are dying. You haven’t watered (not/water) them for ages.","Mai has lost (lose) her keys, so she can’t get into the house.","I’m afraid I haven’t finished (not/finish) typing those letters yet. I have been dealing (deal) with customers all morning.","A: What does your father do (your father/do)?\u000b B: He is (be) an architect but he isn’t working (not/work) at the moment.","A: Have you ever seen (you/ever see) a lion?\u000b B: Yes, I have seen (see) it since I was a child.","PRACTICE MORE:\u000b🧠 Chủ đề 1: Thì Hiện Tại Đơn (Present Simple) & Thì Hiện Tại Tiếp Diễn (Present Progressive)","📌Lưu ý nhanh:","Present Simple (thì hiện tại đơn) dùng để nói về thói quen, sự thật.","✅ I go to school every day.","✅ She likes coffee.","Present Progressive (thì hiện tại tiếp diễn) dùng để nói về hành động đang diễn ra ngay lúc nói.","✅ I am studying now.","✅ Look! She is dancing.","I. Chọn đáp án đúng cho mỗi câu sau:","1. Listen! My mother (sing) ___________________ a song.\u000b 🔘 A. sings\u000b ✅ B. is singing\u000b → Giải thích: “Listen!” là dấu hiệu của thì hiện tại tiếp diễn, dùng khi hành động đang xảy ra ngay bây giờ.","2. Every night, we (go) ___________________ to bed at 10 p.m.\u000b ✅ A. go\u000b 🔘 B. are going\u000b → Giải thích: “Every night” là thói quen → dùng hiện tại đơn.","3. Giang (like) __________ music but I (like) __________ math.\u000b ✅ A. likes, like\u000b 🔘 B. like, likes\u000b → Giải thích: “Giang” là ngôi số ít → “likes”. “I” luôn đi với “like”.","4. Now, they (stay) ___________________ in Hue.\u000b ✅ A. are staying\u000b 🔘 B. stay\u000b → Giải thích: “Now” → hành động đang diễn ra → hiện tại tiếp diễn.","5. My father (read) ___________________ a newspaper in the morning.\u000b ✅ A. reads\u000b 🔘 B. is reading\u000b → Giải thích: “In the morning” chỉ thói quen → dùng hiện tại đơn.","6. Look! Ha (run) ___________________.\u000b ✅ A. is running\u000b 🔘 B. runs\u000b → Giải thích: “Look!” → hành động ngay bây giờ → dùng hiện tại tiếp diễn.","7. Trang usually __________ to the teacher in class, but she (not listen) __________________ now.\u000b ✅ A. listens, is not listening\u000b 🔘 B. listen, isn't listen\u000b → Giải thích:","“Usually” → thói quen → hiện tại đơn.","“Now” → đang diễn ra → hiện tại tiếp diễn phủ định.","8. Where __________ your father (be)?\u000b ✅ A. is\u000b 🔘 B. are\u000b → Giải thích: “Your father” → số ít → dùng “is”.","9. He (be) _______________ in the living room.\u000b ✅ A. is\u000b 🔘 B. are\u000b → Giải thích: “He” đi với “is”.","10. He (watch) _______________ TV.\u000b ✅ A. is watching\u000b 🔘 B. watches\u000b → Giải thích: Hành động đang xảy ra → hiện tại tiếp diễn."]},{"title":"Phần ôn tập 25 · NGÀY 06-05","items":["II. Mô tả tình huống (Dạng văn mô tả)","11. It (be) ______ Sunday evening and my friends and I (be) ______ at Jane's birthday party.\u000b ✅ A. is, are\u000b → Giải thích:","“It” dùng với “is”.","“My friends and I” là “we” → dùng “are”.","12. Jane (wear) ______ a beautiful long dress and (stand) ______ next to her boyfriend.\u000b ✅ A. is wearing, is standing\u000b → Giải thích: Đang mô tả hành động đang diễn ra tại thời điểm nói → hiện tại tiếp diễn.","13. Some guests (drink) ______ wine or beer.\u000b ✅ A. are drinking","14. Some of her relatives (dance) ______ in the middle of the room.\u000b ✅ A. are dancing","15. Most people (sit) ______ on chairs, (enjoy) ______ foods and (chat) ______ with one another.\u000b ✅ A. are sitting, are enjoying, are chatting","16. We often (go) ______ to our friends’ birthday parties.\u000b ✅ A. go\u000b → Giải thích: “Often” là trạng từ tần suất → dùng thì hiện tại đơn.","17. We always (dress) ______ well and (travel) ______ by taxi.\u000b ✅ A. dress, travel","18. Parties never (make) ______ us bored.\u000b ✅ A. make\u000b → Giải thích: “Parties” là số nhiều → động từ không thêm “s”.","III. Viết lại câu hoàn chỉnh (0/10 điểm)","❗ Ghi nhớ: Viết hoa chữ cái đầu và thêm dấu chấm (.) cuối câu.","19. My parents/not allow/me/stay up late.\u000b ✅ My parents do not allow me to stay up late.\u000b → Sai ở câu cũ: thiếu “to” trước động từ “stay”.","20. What/she/like?\u000b ✅ What does she like?","21. They/often/go camping?\u000b ✅ Do they often go camping?","22. When/the lesson/start?\u000b ✅ When does the lesson start?","23. House/belong/my parents.\u000b ✅ This house belongs to my parents.","🧠 Chủ đề 2: Thì hiện tại đơn & tiếp diễn (phần nâng cao)","24. We _____________ the herbs in the garden at present.\u000b ✅ aren’t planting\u000b → Giải thích: “at present” → hiện tại tiếp diễn phủ định.","25. My son (wear) __________ suit today.\u000b ✅ is wearing\u000b → Giải thích: “today” → chỉ thời điểm hiện tại → tiếp diễn.","26. Look! We __________ card in the class.\u000b ✅ are playing","27. My grandfather __________ some plants in the garden.\u000b ✅ is watering","28. Thanh __________ two poems at the moment?\u000b ✅ is writing","29. While I (do) ______ my housework, my daughter (play) ______ piano.\u000b ✅ am doing / is playing","30. Hoang has just started evening classes. He __________ Japanese.\u000b ✅ is learning","31. Listen! The teacher __________ a new lesson.\u000b ✅ is explaining","32. They __________ tomorrow.\u000b ✅ are coming","33. Thuy has just started evening classes. She __________ English.\u000b ✅ is learning","34. It __________ late. Shall we go home?\u000b ✅ is getting","35. “Are you ready, Belle?” – “Yes, I __________.”\u000b ✅ am coming","36. Look! That guy __________ to break the door.\u000b ✅ is trying","🧠 Chủ đề 3: Động từ bất quy tắc – Chia ở thì quá khứ","37. be → ✅ was\u000b 38. become → ✅ became\u000b 39. begin → ❌ bega → ✅ began\u000b 40. break → ✅ broke\u000b 41. bring → ✅ brought\u000b 42. build → ✅ built\u000b 43. buy → ✅ bought\u000b 44. choose → ✅ chose\u000b 45. come → ✅ came\u000b 46. cost → ✅ cost"]},{"title":"SPEAKING BUỔI 5: HOMETOWN","items":["SPEAKING BUỔI 5: HOMETOWN","1. Where do you come from? (Bạn đến từ đâu?)","located in: nằm ở","culturally rich: giàu văn hóa","known for: được biết đến với","situated in: tọa lạc ở","surrounded by: được bao quanh bởi","2. Can you describe your hometown? (Bạn có thể mô tả quê hương của mình không?)","vibrant city: thành phố sôi động","bustling area: khu vực nhộn nhịp","calm and peaceful: yên tĩnh và thanh bình","historical landmarks: các địa danh lịch sử","friendly atmosphere: bầu không khí thân thiện","3. Can you compare your hometown with big modern cities like Beijing? (Bạn có thể so sánh quê hương mình với những thành phố hiện đại lớn như Bắc Kinh không?)","fast-paced lifestyle: lối sống nhịp độ nhanh","less crowded: ít đông đúc hơn","modern infrastructure: cơ sở hạ tầng hiện đại","public transport system: hệ thống giao thông công cộng","tranquil atmosphere: bầu không khí yên bình","Copy thẻ, đặt tên mình, và hoàn thành bảng Hometown","Home town","Where are you from?","What is your hometown famous for?","I am from Bến Tre, a city located in southern Vietnam..","I’m from Bến Tre, a peaceful city located in southern Vietnam. It’s best known for its coconut plantations and delicious coconut-based products like candy and rice paper. People there are warm and welcoming, and the fresh air makes it a relaxing place to live.","Number of years in home town","How long have you lived in your home town?","I’ve lived in Bến Tre since I was two years old. Now I’m living in Ho Chi Minh City to study and work, but I sometimes go back to visit my family on special occasions or holidays.","Population","Is your hometown a busy place?","Bến Tre has a modest population, so It’s not neither as densely populated as Hồ Chí Minh city nor as sparsely populated as rural areas. It’s neither too quiet nor too hectic, which makes it feel comfortable and relaxed.","Famous for…","What is your home town famous for?","My hometown is famous for natural beauty, it’s known for coconut trees. Many tourists visit to explore coconut gardens, go on boat tours along the river, and enjoy fresh tropical fruits at local markets.","One interesting place","Describe one interesting place in your home town.","One fascinating spot is the Cồn Phụng Island. It’s a peaceful river island where you can ride boats, visit temples, and learn about local history and crafts. The atmosphere is calm, and it offers a great escape from city life.","Comparison to Ho Chi Minh City","How would you compare your home town to Ho Chi Minh City?","Compared to Ho Chi Minh City, Bến Tre is much more relaxed and less polluted. The pace of life is slower, and people seem to have more time for family and community. However, HCM City definitely offers more career opportunities and modern conveniences.","Interviewee","Home town","Where are you from?","What is your hometown?","I am from Hue, a city located in central Vietnam.","My hometown is Hue, which is known for its rich history and beautiful landscapes.","Number of years in home town","How long have you lived in your hometown?","I’ve spent most of my life in Hue; I’ve been living here for approximately 20 years.","Weather","What is the weather like?","Hue has a modest population,  with around 350,000 residents. It's neither as densely populated as the big cities nor as sparsely populated as rural areas, which makes it feel comfortable and relaxed.","Famous for…","What is your home town famous for?","Hue is famous for its historical monuments, especially the ancient Imperial City and royal tombs.","One interesting place","Describe one interesting place in your home town.","One fascinating place in Hue is the Perfume River. It’s not just a scenic spot but a significant part of the city’s identity. Visitors can take boat trips along the river, enjoying picturesque views and experiencing traditional music performances onboard.","Comparison to Ho Chi Minh City","How would you compare your home town to Ho Chi Minh City?","Compared to Ho Chi Minh City, Hue is smaller and much quieter. While Ho Chi Minh City is bustling and modern, Hue has a slower pace and is steeped in history.","1. Where do you come from? (Bạn đến từ đâu?)","located in: nằm ở","culturally rich: giàu văn hóa","known for: được biết đến với","situated in: tọa lạc ở","surrounded by: được bao quanh bởi","2. Can you describe your hometown? (Bạn có thể mô tả quê hương của mình không?)","vibrant city: thành phố sôi động","bustling area: khu vực nhộn nhịp"]},{"title":"Phần ôn tập 27 · SPEAKING BUỔI 5: HOMETOWN","items":["calm and peaceful: yên tĩnh và thanh bình","historical landmarks: các địa danh lịch sử","friendly atmosphere: bầu không khí thân thiện","3. Do you know something about the history of your hometown? (Bạn biết gì về lịch sử của quê hương mình không?)","historical significance: ý nghĩa lịch sử","famous events: các sự kiện nổi tiếng","ancient monuments: di tích cổ","heritage sites: các di sản","royal heritage: di sản hoàng gia","4. What is the weather like there? (Thời tiết ở đó như thế nào?)","tropical climate: khí hậu nhiệt đới","seasonal changes: thay đổi theo mùa","rainy season: mùa mưa","mild winters: mùa đông ôn hòa","hot summers: mùa hè nóng","5. Are there any interesting places I can visit? (Có những địa điểm thú vị nào mà tôi có thể ghé thăm không?)","tourist attraction: điểm thu hút khách du lịch","scenic spot: danh lam thắng cảnh","famous landmark: địa danh nổi tiếng","must-visit place: nơi nhất định phải ghé thăm","local market: chợ địa phương","6. What do you miss the most about your hometown? (Bạn nhớ nhất điều gì về quê hương mình?)","traditional cuisine: ẩm thực truyền thống","local customs: phong tục địa phương","friendly community: cộng đồng thân thiện","nostalgic memories: ký ức hoài niệm","unique culture: văn hóa độc đáo","7. Can you compare your hometown with big modern cities like Beijing? (Bạn có thể so sánh quê hương mình với những thành phố hiện đại lớn như Bắc Kinh không?)","fast-paced lifestyle: lối sống nhịp độ nhanh","less crowded: ít đông đúc hơn","modern infrastructure: cơ sở hạ tầng hiện đại","public transport system: hệ thống giao thông công cộng","tranquil atmosphere: bầu không khí yên bình","Slide:","HW PS&PC: https://forms.gle/Rgbbgb98joFt3ZzL9","🟡 I. Choose the correct form of the verbs (Hiện tại đơn - Hiện tại tiếp diễn)","Câu hỏi:\u000b A: Hello, Jane. What (1) are you doing/do you do in this part of London?\u000b Jane: Well, (2) I’m looking/I look at flats round here.\u000b A: Flats? (3) Are you wanting/Do you want to move?\u000b Jane: Yes, in fact, Adam and I (4) are getting/get married.\u000b A: That’s great! Congratulations. When (5) have you decided/did you decide?\u000b Jane: Only last week. It was while we (6) were staying/stayed with his family in Scotland. Now (7) we try/we’re trying to find a suitable flat.\u000b A: It’s great to have you as neighbours. (8) I hope/I’m hoping you manage to find one soon.\u000b Jane: Oh, thanks. We’re going to move by May. We (9) don’t have/aren’t having much time to find one and move. I (10) quite hate/am quite hating living in the hostel now.","Đáp án + Giải thích:","are you doing – Hỏi về điều đang xảy ra lúc nói → hiện tại tiếp diễn","I’m looking – Hành động đang diễn ra hiện tại","Do you want – “Want” là động từ chỉ cảm xúc, không dùng ở tiếp diễn","are getting – “Get married” là quá trình sắp diễn ra → hiện tại tiếp diễn","did you decide – Hỏi về quá khứ cụ thể (last week)","were staying – Hành động dài hơn trong quá khứ, trong lúc đó có việc xảy ra","we’re trying – Hành động đang diễn ra","I hope – “Hope” là động từ chỉ cảm xúc → hiện tại đơn","don’t have – “Have” trong nghĩa “có” → không dùng ở tiếp diễn","quite hate – “Hate” là cảm xúc → dùng hiện tại đơn","🔵 II. Past Simple or Past Progressive (QKD & QKTD)","Mẫu giải:","✅ When Martin arrived home, Ann was talking to someone on the phone.\u000b → QKD + QKTD: Hành động đang diễn ra bị chen ngang","✅ It was cold when we left the house that day, and a light snow was falling.\u000b → Miêu tả khung cảnh quá khứ → dùng QKTD cho hành động đang diễn ra","✅ I called Roger at nine last night, but he wasn’t at home. He was studying at the library.","✅ I saw Sue in town yesterday but she didn’t see me. She was looking the other way.","✅ When I opened the cupboard door, a pile of books fell out.","✅ A: How did you break your arm?\u000b B: I slipped on the ice while I was crossing the street.","✅ A: What were you doing this time yesterday?\u000b B: We were driving to London, but on the way we heard about a bomb scare. So we drove back.","✅ I met Tom and Ann at the airport. They were going to Berlin and I was going to Madrid. We had a chat while we were waiting.","✅ I was cycling home when a man stepped out. I was going fast but managed to stop and didn’t hit him.","🔴 III. Complete with past forms","Flight 2001:\u000b ✅ Flight 2001 was flying from London to New York when it suddenly encountered turbulence and was dropped 15,000 feet. The plane was carrying over 300 passengers.","Divers:\u000b ✅ While divers were working, they discovered a shipwreck. It contained gold. They were filming when they found it.","Ambulance:\u000b ✅ The driver made a call when the thief was starting up the ambulance. He was speeding when the driver saw him and called the police.","Police and snakes:\u000b ✅ Police stopped a woman who was speeding. While they were searching, they found( tìm thấy rồi) snakes. She was taking them to a pet fair.","UFO:\u000b ✅ Last night we were coming down the hill, we saw a strange object. It appeared, we stopped and got out. As we were watching, it flew away.( see- thấy ngắn, look chủ động nhìn, watch : theo dõi hành động)","First day:\u000b ✅ I finally found the room. It was full. Some students were talking, others were speaking, some were conversing. Some were just sitting. I chose a seat and sat. The teacher walked in and all talk stopped.","🟢 IV. Make sentences (Past simple or progressive)","✅ When Don arrived, we were having coffee.","✅ He sat down while I was painting it.","✅ The students were playing a game when the professor arrived."]},{"title":"Phần ôn tập 28 · SPEAKING BUỔI 5: HOMETOWN","items":["✅ Felix phoned the fire brigade when the cooker caught fire.","✅ While he was walking, Henry saw a bear.","✅ When the starter fired, the race began.","✅ I was walking home when it started to rain.","✅ When Margaret opened the door, the phone rang.","✅ He was sitting in the garden when a wasp stung him.","✅ While he was running, he collided with a lamp post.","✅ Vicky was having a dream when the alarm clock rang.","✅ When Alex saw the question, he knew the answer.","✅ The train was waiting when we arrived.","✅ Sarah had a shock when she touched the wire.","✅ When the campers woke, they saw the sun shining.","🟣 V. Put into Past Simple","✅ It was cloudy yesterday.","✅ In 1990, we moved to another city.","✅ When did you get the first gift?","✅ She did not go to the church five days ago.","✅ How was he yesterday?","Tiếp diễn: be + Ving","Hoàn thành: have + V3/ed","hoàn thành tiếp diễn: have + been + V-ing","HT hoàn thành tiếp diễn: have/has + been + V-ing","QK hoàn thành tiếp diễn: had been Ving","Warm up with Present Perfect","Exercise 1: Chia động từ trong ngoặc.","My mother hasn't played (not/play) any sport since last year.\u000b=> Giải thích: Hành động bắt đầu từ quá khứ (năm ngoái) và kéo dài đến nay → dùng Present Perfect.","I’d better have a shower. I haven’t had (not/have) one since Monday.\u000b=> Giải thích: Không có hành động tắm kể từ thứ Hai","Lan doesn’t live with her family now and we haven’t seen (not/see) each other for five years.\u000b=> Giải thích: “For + khoảng thời gian” → dùng thì Present Perfect. Chủ ngữ là “we” nên dùng “haven’t”.","I have just realized (realize) that there are only five weeks to the end of term.\u000b => Giải thích: Có “just” → dùng thì Present Perfect, cấu trúc: have/has + just + V3 (Hành động vừa mới xảy ra (just, recently, lately))","Thuy has finished (finish) reading three books this week.\u000b=> Giải thích: “This week” vẫn chưa kết thúc → dùng thì Present Perfect để nói hành động vẫn có thể tiếp diễn.","We have been (be) in London many times.\u000b=> Giải thích: Hành động đã xảy ra nhiều lần trong quá khứ, không nói rõ thời điểm → dùng Present Perfect.","It is the second time I have traveled (travel) to Da Lat.\u000b ✅ Giải thích: \"It is the second time\" → luôn đi với thì Present Perfect.","📌 Tổng kết từ vựng cần nhớ:","since + mốc thời gian → since Monday, since last year","for + khoảng thời gian → for five years","just, recently, lately: vừa mới","this week/month/year: khoảng thời gian chưa kết thúc","the first/second time → dùng với Present Perfect","Exercise 2: Tìm lỗi sai và sửa lại cho đúng","1. I haven’t cutted my hair since last May.","=>  I haven’t cut my hair since last May.","Chú ý : Chưa đúng ngữ pháp vì từ \"cutted\" là sai dạng quá khứ phân từ của động từ cut.","2. My mother has not working as a teacher for almost 5 years.","=> My mother hasn’t worked as a teacher for  almost 5 years\u000bChú ý : Sai ngữ pháp  Dạng:","(+): S + have/has + V3/ed","(-): S + have/has not (haven’t/hasn’t) + V3/ed","(?): Have/Has + S + V3/ed?","3. The lesson haven’t started yet.","=> The lesson hasn’t started yet","Chú ý :  Có một lỗi nhỏ về chia động từ với chủ ngữ số ít. Vì “lesson” là danh từ số ít → phải dùng hasn't chứ không phải haven’t.","4. Has the dog eat yet? ate eaten","=> Has the dog eaten yet?","Dạng:","(+): S + have/has + V3/ed","(-): S + have/has not (haven’t/hasn’t) + V3/ed","(?): Have/Has + S + V3/ed?","5. I am worried that I still hasn’t finished my housework yet.","=> I am worried that i still haven’t finished my housework yet.\u000bChú ý : hasn’t là sai vì chủ ngữ “I” luôn đi với have, không dùng has.","6. I have just decided to start working next week.","=> I have just decided to start working next week.","7. Long has been at his computer since seven hours.","=> Long has been at his computer for /for seven hours","Chú ý: since + mốc thời gian → since Monday, since last year:::::for + khoảng thời gian → for five years","8. Thao hasn’t received any good news since a long time.","=> Thao hasn’t received any good news For a long time.","Chú ý : since + mốc thời gian → since Monday, since last year:::::for + khoảng thời gian → for five years","9. My brother hasn’t played any sport for last year.","=>  My brother hasn’t played any sport since last year.\u000bSince là khoảng thời gian cụ thể như năm, thứ, giờ cụ thể: 2025, since monday, I have lived in Ho Chi Minh City since I was two years old.","For là khoảng tg dài bao lâu không cần cụ thể như đặt mục tiêu khoảng two years, 3 days, for a week….ex: I have lived in Ho Chi Minh City for 20 years.","10. I’d better have a shower. I hasn’t had one since Sunday."]},{"title":"Phần ôn tập 29 · SPEAKING BUỔI 5: HOMETOWN","items":["=> I’d better have a shower. I haven't had one since Sunday.","Exercise 3: Sắp xếp các từ để ghép thành câu hoàn chỉnh","1. We/ play /tennis/ 4 years.","=> We have played tennis for 4 years.","2. She/ go/ the library/ today.","=> She has gone to the library for today","3. My brother/ move/ a new house/ near/ his girlfriend’s flat.","=> My brother has moved to a new house near his girlfriend’s flat.","✅ Động từ “move” + giới từ “to” + nơi chốn.","4. Her teacher/ not/ explain/ this lesson /yet.","=> Her teacher has not explained this lesson yet.","5. This/ good/ film/ I/ ever/ watch.","=> This is the best film I have ever watched.\u000b ✅ Câu so sánh dùng Present Perfect với “ever” để nói về kinh nghiệm.","6. Quan/ just/ leave/ office/ 3 hours.","=> Quan has just left the office for 3 hours. (vừa mới rời)","7. They/ write/ a report/ since/ last Sunday?","=> Have they been writing a report since last Sunday? ( Câu hỏi dùng Present Perfect Continuous với “since last Sunday” (hành động kéo dài).)","8. you / answer / the question","=> Have you answered the question?","9. Tony / lock / the door","=> Tony has locked the door.","Warm up with Present Perfect","Exercise 1: Chia động từ trong ngoặc vào các câu sau","1. I… have studied…..… English for 5 years. (study)","2. They ……have been talking… …… talking for the last hour. (talk) => hành động kéo dài liên tục → dùng Present Perfect Continuous","3. He ….has been swimming.… for one hour.(swim) → hành động liên tục kéo dài 1 giờ","4. It …has been raining..… since last night. (rain) → hành động liên tục","5. Linda (work) …has worked.. here for six years.=> has worked: nhấn mạnh kết quả → Linda vẫn còn làm. còn has been working: nhấn mạnh quá trình kéo dài.","6. We (study) …..have studied…  all day.","7. They (live) …have lived..… in the USA for 5 months.","8. June (go) …has been going.… to the supermarket every weekend for years.","=> Nếu June thường xuyên đi siêu thị mỗi cuối tuần, ta phải dùng has been going (Present Perfect Continuous – thói quen lặp lại trong khoảng thời gian dài).","9. They (not/exercise) …have not exercised..… enough.","10. I (not/drink) …have not drunk..…. enough water, that's why I feel tired.","=> nói về kinh nghiệm gần đây ảnh hưởng hiện tại.","Exercise 2: Tìm lỗi sai và sửa lại cho đúng","1. My older brother have been working since noon.","My older brother has been working since noon.","2. My mom have been writing to me since last summer due to her busy schedule.","- My mom has been writing to me since last summer due to her busy schedule.","3. I has been cleaning my house the whole day, so i am very tired now.\u000b-  I have been cleaning my house the whole day, so i am very tired now.","4. Everyone ̣̣̣(số ít)  have been waiting for them for hours.","Everyone has been waiting for them for hours.","5. It’s midnight now, someone next door have been singing since 11pm.\u000b-  It’s midnight now, someone next door has been singing since 11pm","Exercise 3: Hoàn thành các câu hỏi dưới đây ở thì hiện tại hoàn thành tiếp diễn","1. How long …...have you been waiting...………. for us? (you | wait)","How long have you waited for us? tới rồi, ko đợi nữa","2. What …..has.helen been doing.………. since she returned? (Helen | do)","3. How long …have you....been learning..………. English? (you | learn)","4. How long ….....has she been working.………. in the garden? (she | work)","HOw long has she worked in the garden?","5. …....Have you been using..………. my computer again? (You | use)","6. Mel looks really tired. …....has she been working..………. all night? (she | work)","Put the verbs into the correct form, past simple or past perfect.  HERE","The house was very quiet when I _got__ ____ (get) home. Everybody _had gone_____ (go) to bed.","( Giải thích: Hành động “had gone” xảy ra trước, “got” xảy ra sau nên dùng Past Perfect cho hành động trước và Past Simple cho hành động sau.)","The apartment was hot when I got home, so I  turned_____ (turn) on the air conditioner.","(Giải thích: Đây là hành động xảy ra ngay tại thời điểm trong quá khứ, không phải hành động xảy ra trước một hành động khác, nên dùng Past Simple (turned).)","A: __Did you meet_____ (you/ meet) Tom at the party last night?\u000bB: No, he _had already gone_______ (already/ go) home when I __arrived_____ (arrive) at the party.\u000b(Giải thích: Dùng Past Simple cho câu hỏi có mốc thời gian cụ thể. Hành động “had already gone” xảy ra trước hành động “arrived”, nên dùng Past Perfect.)","I _ felt_______ (feel) a little better after I ___had taken____ (take) the medicine.","(Giải thích: Hành động uống thuốc xảy ra trước (Past Perfect), cảm thấy tốt hơn xảy ra sau (Past Simple).)","I was late. The teacher _had already given_______ (already/ give) a quiz when I ___got_____ (get) to class.","It was raining hard, but by the time the class _was____ (be) over, the rain ____had stopped____ (stop).","(Giải thích: “Be over” là trạng thái kết thúc, xảy ra sau hành động mưa dừng, nên dùng Past Simple “was” cho lớp kết thúc, Past Perfect cho mưa dừng.)","When I saw that Mike was having trouble, I _had helped___ (help) him. He ___had____ (be) very appreciative.","We were driving along the road when we ___saw____ (see) a car which __had broken______ (break) down, so we __stopped_____ (stop) to see if we could help.","We ___arrived_____ (arrive) at work in the morning and ___found____ (find) that somebody __had broken_____ (break) into the office during the night. So we ___called___ (call) the police.\u000b(Giải thích: “Had broken into” xảy ra trước khi bạn đến, “arrived”, “found”, “called” đều là hành động tiếp theo trong quá khứ, nên dùng Past Simple.)","Yesterday I ____went___ (go) to my daughter’s dance recital. I ___have never been_____ (be/ never) to a dance recital before (Giải thích: Khi nói trải nghiệm đến hiện tại, không kèm mốc thời gian rõ ràng, dùng Present Perfect.)",".I  hadn’t taken_______ (not/ take) dancing lessons when I __was______ (be) a child",".( Hành động chưa từng học xảy ra trước một thời điểm trong quá khứ, nên dùng Past Perfect.)"]},{"title":"Phần ôn tập 30 · SPEAKING BUỔI 5: HOMETOWN","items":["11. By the time she found (find) her keys, the bus had already left (already/leave).","12. When we opened (open) the fridge, we realized someone had eaten (eat) the last slice of cake.\u000b 🔎 Sửa “had opened” → “opened”, “ate” → “had eaten” để đúng thì: hành động ăn xảy ra trước khi mở tủ lạnh.","13. They had never visited (never/visit) Paris before they went (go) there last summer.\u000b 🔎 Sửa “have never visitted” → “had never visited”: thì quá khứ hoàn thành; và “visitted” sai chính tả, đúng là “visited”.","14. The thief had escaped (escape) before the police arrived (arrive).","15. After he had fixed (fix) the car, he took (take) it for a test drive.\u000b 🔎 Hành động sửa xe xảy ra trước, nên dùng quá khứ hoàn thành.","16. When the guests arrived (arrive), the host had already prepared (already/prepare) the meal.\u000b 🔎 Dùng quá khứ đơn cho hành động sau (“arrived”), và quá khứ hoàn thành cho hành động đã hoàn tất trước đó (“had prepared”).","17. She cried (cry) because she had lost (lose) her favorite necklace.\u000b 🔎 “Crying” là phản ứng sau khi làm mất, nên “lost” phải là quá khứ hoàn thành.","18. Before we got (get) to the cinema, the film had already started (already/start).","19. I realized (realize) I had left (leave) my phone at home only when I reached the bus stop.","20. The teacher was (be) disappointed to find that most students had not done (not/do) their homework.\u000b 🔎 “had not done” thể hiện việc chưa làm bài đã xảy ra trước khi giáo viên thất vọng.","Put the verbs into the suitable form, the present perfect or the present perfect progressive.","A: How long ____have you studied____ (you/ study) English?","→ Hành động bắt đầu trong quá khứ và vẫn tiếp diễn đến hiện tại → dùng Present Perfect (have studied).\u000bB: I ___have been learning_____ (learn) English since I was twelve.","→ Nhấn mạnh quá trình học kéo dài → dùng Present Perfect Progressive.","A: Are you waiting for someone?\u000bB: Yes, I ____have been waiting____ (wait) for two hours, but my friend ____hasn’t come____ (not come) yet.","→ “Have been waiting”: Hành động kéo dài liên tục đến hiện tại → Perfect Progressive.","→ “Hasn't come”: Hành động chưa xảy ra cho đến nay → Perfect.","A: I ___have lost_____ (lose) my address book. ____Have you seen____ (you/ see) it anywhere?","→ “Have lost”: Hành động vừa xảy ra, ảnh hưởng hiện tại (mất sổ).\u000b → “Have you seen”: Hành động đã từng xảy ra, chưa rõ thời điểm cụ thể → dùng Perfect.","B: Yes, I ___have just seen____ (just/ see) it on the bookshelf.","A: You look tired. ___Have you been working_____ (you/ work) so hard?","→ Hỏi về một quá trình kéo dài, dấu hiệu là “tired” → Perfect Progressive.\u000bB: Yes, I ___have been studying____ (study) for four hours and probably won’t finish until midnight.","→ Nhấn mạnh quá trình học lâu dài → dùng Perfect Progressive.","A: ___Have you seen_____ (you/ see) Mark recently?","→ “Recently” → dấu hiệu của Perfect (đã xảy ra nhưng không rõ khi nào).","B: No, I ____have not seen____ (not/ see) him since Christmas. I wonder where he ___has been living_____ (live) since then.","→ “Since Christmas”: hành động bắt đầu từ quá khứ → Perfect.","→ “Has been living”: nhấn mạnh quá trình sống kéo dài đến nay → Perfect Progressive.","A: I feel really tired.\u000bB: It’s because you ____have been doing____ (do) too much.","→ Nhấn mạnh hoạt động đang kéo dài, gây mệt mỏi → Perfect Progressive.\u000bA: Well, at least I ___have finished_____ (finish) that report now, and I can relax.","→ Hành động vừa kết thúc, kết quả rõ ràng ở hiện tại → Perfect.","A: Someone ____has left____ (leave) the ladder outside, look.","→ Hành động đã xảy ra gần đây, ảnh hưởng hiện tại → Perfect.\u000bB: I expect that’s Mike. He ____has been cleaning____ (clean) the windows. I don’t think he ___has finished____ (finish) yet.","→ “Has been cleaning”: nhấn mạnh quá trình hành động chưa kết thúc.","→ “Has finished”: dùng Perfect vì nói về kết quả.","A: You’ve got mud on your shoes.\u000bB: It’s all right, I’ll take them off. I _______have been working________ (work) in the garden.","→ Nhấn mạnh quá trình làm vườn gây bẩn giày → Perfect Progressive.","A: Yes, it looks a lot tidier. Well done. You ___have done____ (do) a good job.","→ Nhấn mạnh kết quả, thành tựu → Perfect.","A: I ____have heared____ (hear) that you and Harriet are building a garage.","→ Hành động nghe thông tin gần đây → Perfect.","How long ____have you been doing____ (you/ do) that?","→ Hỏi về quá trình kéo dài đến hiện tại → Perfect Progressive.\u000bB: Oh, for about a month now. We ____have done____ (do) about half of it.","→ Nhấn mạnh kết quả (đã làm được một nửa) → Perfect.","A: You’re still reading that book, aren’t you? How long ___have you been reading____ (you/ read) it?","→ Hỏi về quá trình đang diễn ra → Perfect Progressive.\u000bB: I _____have been reading___ (read) it for three days, but I ___haven’t finshed_____ (not/ finish) it yet.","→ Quá trình → Perfect Progressive,\u000b → Kết quả chưa xảy ra → Perfect (haven’t finished).","A: How long ___have you known____ (you/ know) Jane?\u000bB: We ___have known_____ (know) each other for over ten years.","→ “Know” là stative verb (động từ trạng thái) → không dùng tiếp diễn, dùng Perfect để nói mối quan hệ kéo dài.","A: ___Have John always lived_____ (John/ always/ live) in London?","→ “Always” + hành động kéo dài → dùng Perfect.","B: No, he ___has lived_____ (live) in London for the last few years.","→ Hành động kéo dài đến nay → dùng Perfect.","1. Hiện tại hoàn thành (Present Perfect)","Cấu trúc:","Khẳng định: S + have/has + V3 (past participle)","Phủ định: S + haven’t/hasn’t + V3","Nghi vấn: Have/Has + S + V3 ?","Cách dùng:","Hành động xảy ra trong quá khứ nhưng còn liên quan đến hiện tại:\u000b Ví dụ:","I have finished my homework. (Tôi đã hoàn thành bài tập, bây giờ nó xong rồi)","Kinh nghiệm trong đời:\u000b Ví dụ:","She has visited Japan twice. (Cô ấy đã từng đến Nhật 2 lần)","Hành động xảy ra trong khoảng thời gian chưa kết thúc:\u000b Ví dụ:","They have lived here for 5 years. (Họ đã sống ở đây 5 năm và vẫn còn sống)","Hành động vừa mới hoàn thành (thường dùng với “just”):\u000b Ví dụ:","I have just eaten. (Tôi vừa mới ăn xong)","2. Hiện tại hoàn thành tiếp diễn (Present Perfect Continuous)","Cấu trúc:","Khẳng định: S + have/has + been + V-ing"]},{"title":"Phần ôn tập 31 · SPEAKING BUỔI 5: HOMETOWN","items":["Phủ định: S + haven’t/hasn’t + been + V-ing","Nghi vấn: Have/Has + S + been + V-ing ?","Cách dùng:","Diễn tả hành động bắt đầu trong quá khứ và vẫn đang tiếp tục đến hiện tại:\u000b Ví dụ:","She has been studying for three hours. (Cô ấy đã học suốt 3 tiếng và vẫn đang học)","Nhấn mạnh tính liên tục, hoặc sự kéo dài của hành động:\u000b Ví dụ:","I have been working here since 2019. (Tôi đã làm việc ở đây từ năm 2019 đến bây giờ)","Dùng để giải thích nguyên nhân của một trạng thái hiện tại:\u000b Ví dụ:","I am tired because I have been running. (Tôi mệt vì tôi đã chạy)","So sánh Present Perfect và Present Perfect Continuous","Điểm khác biệt","Present Perfect","Present Perfect Continuous","Nhấn mạnh kết quả, trạng thái","Hành động đã hoàn thành, kết quả rõ ràng","Nhấn mạnh hành động kéo dài, đang diễn ra","Ví dụ","I have written 5 emails. (Tôi đã viết 5 email)","I have been writing emails all morning. (Tôi đã viết email cả buổi sáng)","Hành động hoàn toàn kết thúc","Đúng","Không, hành động có thể vẫn tiếp diễn","Tính liên tục, kéo dài","Ít nhấn mạnh","Rất nhấn mạnh","Ví dụ thực tế để phân biệt:","Present Perfect:","I have read that book. (Tôi đã đọc xong quyển sách đó)","Present Perfect Continuous:","I have been reading that book for two hours. (Tôi đã đọc quyển sách đó suốt 2 tiếng và vẫn đang đọc)","PRACTICE MORE:","🎯 PHẦN 1: PRESENT PERFECT (Thì Hiện Tại Hoàn Thành)","✅ Tổng điểm: 7/11","Bạn đã đúng 7 câu, nhưng có 4 câu sai, mình sẽ giúp bạn sửa:","✔️ Câu đúng:","✅ She has finished her homework already.\u000b → Cô ấy đã hoàn thành bài tập rồi.\u000b (→ \"already\" thường dùng trong thì hiện tại hoàn thành.)","✅ They have never visited Paris before.\u000b → Họ chưa bao giờ đến Paris trước đây.","✅ I have lost my keys. Can you help me find them?\u000b → Tôi làm mất chìa khóa rồi. Bạn có thể giúp tôi tìm không?","✅ He has worked here since 2010.\u000b → Anh ấy làm việc ở đây từ năm 2010.\u000b (→ “Since + mốc thời gian” đi với hiện tại hoàn thành.)","✅ We have not seen that movie yet.\u000b → Chúng tôi chưa xem bộ phim đó.","✅ Have you ever been to New York?\u000b → Bạn đã từng đến New York chưa?\u000b (→ Sau \"ever\", dùng “been” là quá khứ phân từ của “be” khi nói về trải nghiệm.)","✅ She has just called me.\u000b → Cô ấy vừa mới gọi cho tôi.","❌ Câu sai & Sửa lại:","❌ I have not eatten sushi for last two years.\u000b 👉 Sai ở \"eatten\" (đúng là \"eaten\") & \"for last two years\" sai cấu trúc.\u000b ✅ Đúng: I have not eaten sushi for two years.\u000b → Tôi đã không ăn sushi trong 2 năm.\u000b (→ Không dùng \"for the last two years\" nếu phía trước là phủ định. Có thể dùng \"in two years\" hoặc \"for two years\" tuỳ ngữ cảnh.)","❌ She has been playing the piano since 2015..\u000b 👉 Bạn dùng thì hiện tại hoàn thành tiếp diễn trong khi đề yêu cầu hiện tại hoàn thành.\u000b ✅ Đúng: She has played the piano since 2015.\u000b → Cô ấy đã chơi piano từ năm 2015.","❌ They have moved to this city since 2000.\u000b 👉 Sai vì: \"since\" không đi với “moved”.\u000b ✅ Đúng: They have lived in this city since 2000.\u000b → Họ đã sống ở thành phố này từ năm 2000.","✅ We haven’t completed the project yet.\u000b → Chúng tôi vẫn chưa hoàn thành dự án.\u000b (→ “yet” dùng trong câu phủ định với thì hiện tại hoàn thành.)","🟢 TỔNG KẾT THÌ HIỆN TẠI HOÀN THÀNH:","Công thức","S + have/has + PII (past participle)","Dấu hiệu","already, yet, just, ever, never, since, for","🎯 PHẦN 2: PRESENT PERFECT CONTINUOUS","✅ Tổng điểm: 5/10","Bạn đã đúng hầu hết các câu, nhưng có vài lỗi nhỏ. Mình sẽ sửa và giải thích nhé.","✔️ Câu đúng:","✅ She has been studying for hours.","✅ They have been waiting for the bus since 8 a.m.","✅ I have been trying to contact him all morning.","✅ We have not been sleeping well lately.","✅ How long have you been working here?","✅ He has been jogging since 6 a.m.","✅ She has been painting her house for three weeks.","✅ I have been working on this report for days.","✅ It has been raining all day.","❌ Câu sai & sửa lại:","Bạn ghi lặp lại câu I have been working on this report for days, nên hệ thống tính nhầm điểm một câu (do trùng câu).","✅ Đúng là: I have been working on this report for days.","🟢 TỔNG KẾT THÌ HIỆN TẠI HOÀN THÀNH TIẾP DIỄN:","Công thức"]},{"title":"Phần ôn tập 32 · SPEAKING BUỔI 5: HOMETOWN","items":["S + have/has + been + V-ing","Dấu hiệu","for, since, all day, all morning, recently, lately, how long...","🎯 PHẦN 3: PAST PERFECT (Quá Khứ Hoàn Thành)","✅ Tổng điểm: 3/11","Bạn làm đúng nhiều câu nhưng hệ thống chỉ tính 3 câu do một số lỗi nhỏ trong viết lại câu.","✔️ Câu đúng:","✅ By the time we arrived, the train had left.","✅ She had already finished cooking when I called her.","✅ They had not seen the movie before it was discussed in class.","✅ He had just gone out when the phone rang.","✅ I had never heard that story until yesterday.","✅ She had completed her homework before dinner.","✅ He went to bed after he had finished reading the book.","✅ By the time we got there, they had eaten.","✅ She said she had visited Rome before.","✅ The children had gone to bed when we returned home.","❌ Lỗi nhỏ:","Bạn viết lại câu giống đáp án nhưng có thể bị hệ thống đánh sai do dấu câu hoặc lỗi gõ nhỏ, ví dụ:","Dư thừa dấu \",\" hoặc \".\" cuối câu","Viết trùng câu","🟢 TỔNG KẾT THÌ QUÁ KHỨ HOÀN THÀNH:","Công thức","S + had + PII (past participle)","Dấu hiệu","before, after, already, just, by the time, when","🎯 PHẦN 4: CHALLENGE TASK – Viết đoạn văn (0/1 điểm)","❌ Lý do bị trừ điểm: Có thể bạn chưa nộp đoạn văn hoặc chưa có đầy đủ các thì yêu cầu.","Mình giúp bạn viết lại một đoạn văn hoàn chỉnh như đề yêu cầu, có sử dụng tất cả các thì:","✅ Mẫu đoạn văn (có đầy đủ các thì):","Last year, I started learning English because I wanted to travel and communicate confidently. At first, it was difficult, and I had never studied it seriously before. Since then, I have learned many new words and grammar rules. I have been practicing every day by doing homework and watching English videos. Yesterday, I watched a movie in English without subtitles, and I was really proud of myself. I know I still have a long way to go, but I have never given up. I have been trying to believe in myself, and step by step, I'm getting better.","HW listening","📌 1. Cấu trúc với \"will\" (tương lai đơn)","✅ Khẳng định:","To be: S + will be + N/Adj/Adv\u000b Ex: She will be a doctor.","Normal verb: S + will + V\u000b Ex: They will study tomorrow.","❌ Phủ định:","➤ S + will not (won’t) + be + N/Adj/Adv\u000b➤ S + will not (won’t) + V","She will not be a doctor.","They will not study tomorrow.","❓ Câu nghi vấn Yes/No:\u000b➤ Will + S + be + N/Adj/Adv?\u000b➤ Will + S + V?","Will she be a doctor?","Will they study tomorrow?","❓ Câu nghi vấn WH-question:\u000b➤ WH-word + will + S + be + N/Adj/Adv?\u000b➤ WH-word + will + S + V?","What will she be?","When will they study?","2. Thì tương lai gần – BE GOING TO","✅ Câu khẳng định:","➤ S + am / is / are + going to + V (nguyên thể)\u000b Ex: I am going to study.\u000b Ex: She is going to travel.","❌ Câu phủ định:","➤ S + am / is / are + not + going to + V\u000b Ex: We are not going to eat.\u000b Ex: He isn’t going to come.","❓ Câu hỏi Yes/No:","➤ Am / Is / Are + S + going to + V?\u000b Ex: Is she going to help?\u000b Ex: Are you going to study?","❓ Câu hỏi WH-question:","➤ WH-word + am / is / are + S + going to + V?\u000b Ex: What are you going to do?\u000b Ex: Where is he going to go?","Hướng dẫn tổng quát về thì tương lai trong bài:","1. Simple Present (Hiện tại đơn) dùng cho:","Lịch trình, thời gian biểu cố định (train, flight, schedule).","Ví dụ: The train leaves at 7:00.","2. Present Progressive (Hiện tại tiếp diễn) dùng cho:","Kế hoạch, dự định đã được lên lịch cụ thể hoặc chắc chắn xảy ra.","Ví dụ: We are having a party on Sunday.","3. Will (Tương lai đơn) dùng cho:","Dự đoán hoặc quyết định ngay lúc nói.","Lời hứa, đề nghị, yêu cầu, lời mời hoặc phản ứng.","Ví dụ: I will help you.","4. Be going to (Dự định) dùng cho:","Kế hoạch rõ ràng, hoặc dự đoán có căn cứ.","Ví dụ: I am going to look round the museum.","I. Hoàn thành câu với thì hiện tại đơn hoặc hiện tại tiếp diễn (dùng để nói về tương lai)"]},{"title":"Phần ôn tập 33 · SPEAKING BUỔI 5: HOMETOWN","items":["Cách làm:","Với những sự kiện có lịch trình chắc chắn như tàu, xe, phim, dùng hiện tại đơn.","Với những kế hoạch cá nhân rõ ràng, dùng hiện tại tiếp diễn.","Ví dụ giải thích từng câu mẫu:","A: Are you free on Friday?\u000b B: No, we’re very busy now. We are having (have) a party on Sunday.","A: What time does your train leave tomorrow?\u000b B: Seven twenty-three. It gets into Paris at eleven twenty-three.","A: Does the film begin at 3.30 or 4.30?\u000b B: It begins at 3.30. I am picking you up at 3 o’clock.","I. Put the verbs in the present tense for the future: simple present or simple progressive.","A: Are you free on Friday?\u000b B: No, we’re very busy now. We are having a party on Sunday.","A: What time does your train leave tomorrow?\u000b B: Seven twenty-three in the morning. It gets into Paris at eleven twenty-three.","A: Does the film begin at 3.30 or 4.30?\u000b B: It begins at 3.30. I am picking you up at 3 o’clock.","A: I am going to go to an ice hockey match this evening. Would you like to come?\u000b B: Yes, I’d love to. What time does the match start?\u000b A: It starts at half past seven.","A: When does the art exhibition open?\u000b B: The art exhibition opens on 3 May and finishes on 15 July.","A: What time do you finish work tomorrow?\u000b B: I am not going to work tomorrow. I am staying at home.","A: Are you doing anything tomorrow morning?\u000b B: Yes, I am going to the airport to meet Richard. He is staying here for the weekend. His plane arrives at eight fifteen.","A: Where are you going on your holiday?\u000b B: We are leaving for Paris next week. The train leaves early on Tuesday morning.","A: I’m bored with this program. When does it finish?\u000b B: It lasts till 2:30.","A: How about going across the street for a cup of coffee?\u000b B: I can’t. I am meeting Jennifer at the library.","II. Hoàn thành câu với will hoặc be going to (dự đoán, ý định, quyết định lúc nói)","Cách làm:","Dùng be going to khi nói về dự định, kế hoạch đã có trước.","Dùng will khi đưa ra quyết định tức thì, lời hứa, dự đoán không chắc chắn hoặc phản ứng.","Ví dụ:","Your friend: Do you have any plans for this afternoon?","You: Yes, I am going to look round the museum. (Kế hoạch có từ trước)","Your friend: That dog doesn’t look friendly.","You: It will attack us. (Dự đoán, phản ứng ngay lúc nói)","Mình điền luôn phần II:","1. Dự định tham quan bảo tàng 🏛️🎨","It’s your day off. You have intention to look around the museum.","Tình huống: Đây là ngày nghỉ của bạn, bạn có ý định đi tham quan bảo tàng.\u000b Câu hỏi:\u000b Your friend: Do you have any plans for this afternoon?\u000b You: Yes, I ________ (look) round the museum.","Đáp án:\u000b Yes, I am going to look round the museum. 👀🖼️","2. Con chó tiến về phía bạn 🐕⚠️","You hate dogs. Dogs always attack you if they get a chance.","Tình huống: Bạn ghét chó vì chúng hay tấn công bạn nếu có cơ hội.\u000b Câu hỏi:\u000b Your friend: That dog doesn’t look very friendly.\u000b You: It’s coming towards us. It ________ (attack) us.","Đáp án:\u000b It is going to attack us. 😨🐾","3. Có người gọi điện thoại tìm Jim 📞👤","Tình huống: Điện thoại reo, bạn trả lời và có người muốn nói chuyện với Jim.\u000b Câu hỏi:\u000b Caller: Hello. Can I speak to Jim, please?\u000b You: Just a moment. I ________ (get) him.","Đáp án:\u000b I will get him. 📲➡️","4. Dự định ngồi trong vườn 🌞🌿","It’s a nice day. You’ve decided to sit in the garden. Before going outside, you tell your friend.","Tình huống: Thời tiết đẹp, bạn quyết định ngồi trong vườn.\u000b Câu hỏi:\u000b You: The weather’s too nice to stay indoors. I ________ (sit) in the garden.\u000b Your friend: That’s a good idea. I think I ________ (join) you.","Đáp án:\u000b I am going to sit in the garden. 🪑🌸\u000b I think I will join you. 🤗","5. Bạn của bạn lo lắng vì mất thư quan trọng 📩😟","Your friend is worrying because she has lost an important letter.","Tình huống: Bạn an ủi bạn mình khi cô ấy lo mất thư quan trọng.\u000b Câu hỏi:\u000b You: Don’t worry about the letter. I’m sure you ________ (find) it.\u000b Your friend: I hope so.","Đáp án:\u000b I’m sure you will find it. 🔍✉️","6. Dự đoán người ngoài hành tinh sẽ hạ cánh trên Trái Đất trong 10 năm tới 👽🚀","You predict the landing of aliens on the earth in the next ten years.","Tình huống: Bạn dự đoán về người ngoài hành tinh.\u000b Câu hỏi:\u000b Your friend: Do you think that aliens will land on the earth soon?\u000b You: It’s likely that aliens ________ (land) on the earth in the next ten years.","Đáp án:\u000b It’s likely that aliens will land on the earth in the next ten years. 🌍👾","7. Quyết định không xin việc ❌📄","Tình huống: Có một công việc được đăng tuyển gần đây, bạn định xin nhưng sau đó đổi ý.\u000b Câu hỏi:\u000b Your friend: Have you decided what to do about the job that was advertised?\u000b You: Yes, I ________ (not/apply) for it.","Đáp án:\u000b I will not apply for it. 🚫📝","III. Chọn đáp án đúng (will, be going to, hiện tại đơn, hiện tại tiếp diễn)","Read the situations and complete the sentences. Use will or be going to. ✍️✨","Cách làm:","Chọn be going to nếu nói về kế hoạch, dự định đã lên lịch.","Chọn will cho dự đoán, lời hứa, quyết định ngay lúc nói.","Chọn hiện tại đơn cho lịch trình, thời gian biểu.","Chọn hiện tại tiếp diễn cho kế hoạch cá nhân gần.","Mình điền phần III:","8. Bạn và bạn về nhà rất muộn. Người khác trong nhà đang ngủ. Bạn của bạn làm ồn.","You: Shhh! Don’t make so much noise. You ________ (wake) everybody up. 🔕😴","Đáp án:\u000b You will wake everybody up.","9. Bạn biết Michelle đã quyết định kết hôn.","Your friend: Have you heard about Michelle?\u000b You: Well, I heard that she ________ (get) married. 💍💒","Đáp án:\u000b She is going to get married.","10. Bạn của bạn có hai đứa con nhỏ và muốn đi ra ngoài tối mai. Bạn đề nghị trông giúp trẻ.","Your friend: I want to go out tomorrow evening but I haven’t got a baby-sitter.\u000b You: That’s no problem. I ________ (look after) them. 👶👧👦"]},{"title":"Phần ôn tập 34 · SPEAKING BUỔI 5: HOMETOWN","items":["Đáp án:\u000b I will look after them.","11. Bạn có hẹn với nha sĩ vào sáng thứ Sáu.","Friend: Shall we meet on Friday morning?\u000b You: I can’t on Friday. I ________ (go) to the dentist. 🦷⌚","Đáp án:\u000b I am going to go to the dentist.","12. John phải đi sân bay để bắt chuyến bay sáng mai.","John: Ann, I need somebody to take me to the airport tomorrow morning.\u000b Ann: That’s no problem. I ________ (take) you. What time is your flight?\u000b John: 10.50.\u000b Ann: OK. We ________ (leave) at about 9 o’clock then.\u000b Later that day, Joe offers to take John to the airport.\u000b Joe: John, do you want me to take you to the airport?\u000b John: No, thanks, Joe. Ann ________ (take) me. ✈️🚗","Đáp án:\u000b Ann: I will take you.\u000b Ann: We are going to leave at about 9 o’clock then.\u000b John: Ann is going to take me.","III. Choose the correct answer. ✔️📖","A: Why are you working so hard these days?\u000b B: Because ________ a car, so I’m saving as much as I can.\u000b a. I’ll buy\u000b b. I’m going to buy\u
