000b c. I buy","Đáp án: b. I’m going to buy 🚗💰","A: Oh, I’ve just realized. I haven’t got any money.\u000b B: Haven’t you? Well, don’t worry. ________ you some.\u000b a. I’ll lend\u000b b. I’m going to lend\u000b c. I’m lending","Đáp án: a. I’ll lend 🤝💵","A: Could I have a word with you, please?\u000b B: Sorry, I’m in a big hurry. My train ________ in fifteen minutes.\u000b a. is going to leave\u000b b. will leave\u000b c. leaves","Đáp án: c. leaves 🚆⏳","A: Let’s go to the carnival.\u000b B: Yes, good idea. I expect ________ fun.\u000b a. it’ll be\u000b b. it’s\u000b c. it’s being","Đáp án: a. it’ll be 🎡🎉","A: Have you decided about the course?\u000b B: Yes, I decided last weekend. ________ for a place.\u000b a. I apply\u000b b. I’m going to apply\u000b c. I’ll apply","Đáp án: b. I’m going to apply 🎓📝","A: It’s a public holiday next month.\u000b B: Yes, I know. ________ anything special?\u000b a. Are you doing\u000b b. Do you do\u000b c. Will you do","Đáp án: a. Are you doing 🎉📅","A: Do you mind not leaving your papers all over the table?\u000b B: Oh sorry. I’ll take them all with me when ________.\u000b a. I’ll go\u000b b. I’m going\u000b c. I go","Đáp án: c. I go 📝➡️","A: ________ a party next Saturday. Can you come?\u000b B: Yes, of course.\u000b a. We’ll have\u000b b. We’re having\u000b c. We have","Đáp án: b. We’re having 🎈🎊","A: I’m trying to move this cupboard, but it’s very heavy.\u000b B: Well, ________ you, then.\u000b a. I’ll help\u000b b. I’m going to help\u000b c. I help","Đáp án: a. I’ll help 💪📦","A: Excuse me. What time ________ to London?\u000b B: Seven thirty in the morning.\u000b a. will this train leave\u000b b. is this train going to get\u000b c. does this train get","Đáp án: c. does this train get 🚆🕢","A: I’ve decided to repaint this room.\u000b B: Oh, have you? What color ________ it?\u000b a. does you paint\u000b b. are you going to paint\u000b c. will you paint","Đáp án: b. are you going to paint 🎨🏠","A: Why are you putting on your coat? ________ somewhere?\u000b B: No, I just feel rather cold.\u000b a. Are you going\u000b b. Do you go\u000b c. Will you go","Đáp án: a. Are you going 🧥❄️","A: Did you post that letter for me?\u000b B: Oh, I’m sorry. I completely forgot. ________ it now.\u000b a. I do\u000b b. I’m doing\u000b c. I’ll do","Đáp án: c. I’ll do ✉️✅","A: You look very happy. What is happening?\u000b B: Well, I’ve got a new job. ________ my new job on Monday.\u000b a. I’m starting\u000b b. I’m going to start\u000b c. I start","Đáp án: a. I’m starting 💼✨","A: Someone told me you’ve got a place at university.\u000b B: That’s right. ________ maths at St Andrews, in Scotland.\u000b a. I’ll study\u000b b. I’m going to study\u000b c. I study","Đáp án: b. I’m going to study 🎓📚","A: The alarm’s going. It’s making an awful noise.\u000b B: OK, ________ it off.\u000b a. I am switching\u000b b. I am going to switch\u000b c. I’ll switch","Đáp án: c. I’ll switch 🔔🔕","A: Did you buy this book?\u000b B: No, Emma did. ________ it on holiday.\u000b a. She’ll read\u000b b. She is going to read\u000b c. She reads","Đáp án: b. She is going to read 📖🏖️","A: Is the shop open yet?\u000b B: No, but there’s someone inside. I think ________.\u000b a. it opens\u000b b. it’s about to open\u000b c. it will open","Đáp án: b. it’s about to open 🏪⏰","A: Have you heard anything about Jane?\u000b B: Yes. She’s engaged. ________ married in June.\u000b a. She’s getting\u000b b. She’ll get\u000b c. She’s about to get","Đáp án: a. She’s getting 💍👰","A: I’m just going out to get a paper.\u000b B: What newspaper ________?\u000b a. will you buy\u000b b. are you buying\u000b c. are you going to buy","Đáp án: b. are you buying 📰🛒","1. Major in / Specialize in","Nghĩa: Học chuyên ngành / Chuyên về","Ví dụ:","I major in Computer Science at university.","Tôi học chuyên ngành Khoa học Máy tính tại đại học.","2. Core subjects","Nghĩa: Các môn học cốt lõi","Ví dụ:","Mathematics and English are core subjects in high school.","Toán và Tiếng Anh là các môn học cốt lõi ở cấp ba.","3. Career-oriented","Nghĩa: Hướng đến sự nghiệp","Ví dụ:","This program is career-oriented and focuses on practical skills.","Chương trình này hướng đến sự nghiệp và tập trung vào kỹ năng thực tế.","4. Challenging workload","Nghĩa: Khối lượng công việc đầy thách thức","Ví dụ:","The challenging workload helps students develop time management skills.","Khối lượng công việc đầy thách thức giúp sinh viên phát triển kỹ năng quản lý thời gian.","5. Practical applications","Nghĩa: Ứng dụng thực tiễn"]},{"title":"Phần ôn tập 35 · SPEAKING BUỔI 5: HOMETOWN","items":["Ví dụ:","Learning programming has many practical applications in today's job market.","Học lập trình có nhiều ứng dụng thực tiễn trong thị trường việc làm ngày nay.","6. Future aspirations","Nghĩa: Khát vọng tương lai","Ví dụ:","Her future aspirations include becoming a successful entrepreneur.","Khát vọng tương lai của cô ấy bao gồm việc trở thành một doanh nhân thành đạt.","7. Gain valuable skills","Nghĩa: Thu nhận các kỹ năng quý giá","Ví dụ:","Volunteering is a great way to gain valuable skills.","Làm tình nguyện là một cách tuyệt vời để thu nhận các kỹ năng quý giá.","8. Broaden my knowledge","Nghĩa: Mở rộng kiến thức của tôi","Ví dụ:","Traveling abroad can help broaden your knowledge about other cultures.","Du lịch nước ngoài có thể giúp mở rộng kiến thức của bạn về các nền văn hóa khác.","9. Theoretical foundations","Nghĩa: Nền tảng lý thuyết","Ví dụ:","Understanding the theoretical foundations of physics is crucial for advanced research.","Hiểu nền tảng lý thuyết của vật lý là rất quan trọng cho nghiên cứu chuyên sâu.","10. Field of study","Nghĩa: Lĩnh vực học tập","Ví dụ:","His field of study is artificial intelligence.","Lĩnh vực học tập của anh ấy là trí tuệ nhân tạo.","11. Personal passion","Nghĩa: Đam mê cá nhân","Ví dụ:","Cooking is her personal passion, and she dreams of opening her own restaurant.","Nấu ăn là đam mê cá nhân của cô ấy, và cô mơ ước mở nhà hàng của riêng mình.","12. Career goals","Nghĩa: Mục tiêu sự nghiệp","Ví dụ:","Setting clear career goals can help you stay focused.","Đặt mục tiêu sự nghiệp rõ ràng có thể giúp bạn tập trung hơn.","13. Practical benefits","Nghĩa: Lợi ích thực tế","Ví dụ:","The program provides practical benefits for students entering the workforce.","Chương trình cung cấp các lợi ích thực tế cho sinh viên khi tham gia lực lượng lao động.","14. Challenging workload","Nghĩa: Khối lượng công việc đầy thách thức","Ví dụ:","The challenging workload helps students develop time management skills.","Khối lượng công việc đầy thách thức giúp sinh viên phát triển kỹ năng quản lý thời gian.","15. Struggle with","Nghĩa: Vật lộn với / Gặp khó khăn với","Ví dụ:","Many students struggle with math in high school.","Nhiều học sinh gặp khó khăn với môn Toán ở cấp ba.","16. Develop resilience","Nghĩa: Phát triển khả năng chịu đựng / phục hồi","Ví dụ:","Overcoming challenges can help you develop resilience.","Vượt qua thử thách có thể giúp bạn phát triển khả năng chịu đựng.","17. Manage time effectively","Nghĩa: Quản lý thời gian hiệu quả","Ví dụ:","You need to manage time effectively to balance work and studies.","Bạn cần quản lý thời gian hiệu quả để cân bằng giữa công việc và học tập.","18. Seek guidance","Nghĩa: Tìm kiếm sự hướng dẫn","Ví dụ:","Don’t hesitate to seek guidance from your mentors.","Đừng ngần ngại tìm kiếm sự hướng dẫn từ cố vấn của bạn.","19. Hands-on experience","Nghĩa: Kinh nghiệm thực tế"]},{"title":"Phần ôn tập 36 · SPEAKING BUỔI 5: HOMETOWN","items":["Ví dụ:","Internships provide students with valuable hands-on experience.","Các kỳ thực tập cung cấp cho sinh viên kinh nghiệm thực tế quý báu.","20. Immediate goals","Nghĩa: Mục tiêu trước mắt","Ví dụ:","My immediate goal is to finish this project by next week.","Mục tiêu trước mắt của tôi là hoàn thành dự án này trước tuần sau.","21. Long-term plans","Nghĩa: Kế hoạch dài hạn","Ví dụ:","He has long-term plans to establish his own company.","Anh ấy có kế hoạch dài hạn là thành lập công ty riêng.","22. Professional development","Nghĩa: Phát triển nghề nghiệp","Ví dụ:","Attending workshops is essential for professional development.","Tham dự các buổi hội thảo là điều cần thiết cho sự phát triển nghề nghiệp.","23. Career path","Nghĩa: Con đường sự nghiệp","Ví dụ:","Choosing the right major can influence your career path.","Lựa chọn đúng ngành học có thể ảnh hưởng đến con đường sự nghiệp của bạn.","24. Apply skills in real-world","Nghĩa: Áp dụng kỹ năng vào thực tế","Ví dụ:","The program encourages students to apply their skills in real-world projects.","Chương trình khuyến khích sinh viên áp dụng kỹ năng của mình vào các dự án thực tế.","A: Hi, Brian! You look so busy! What are you studying?\u000bB: Well, you know, I'm in my last year of high school now. I'm so busy preparing for the university entrance exams in June.","A: Wow! I remember when I took those exams. They were really tough. It took up all my time, just preparing for them.\u000bB: That’s exactly how I feel. There’s so much to study and so little time.","A: Well, don’t give up. Keep it up.\u000bB: What did you study in university?\u000bA: I majored in ______.","Student 1:","Student 2:","Student 3:","Student 4:","B: What kind of courses did you take for that major?\u000bA: ______.","(từ gợi ý: core subjects, broaden my knowledge, gain valuable skills)","Student 1:","Student 2:","Student 3:","Student 4:","B: That sounds interesting. Why did you choose that major?\u000bA: When I was in high school, I always liked ______.\u000bSo, I decided to major in ______.","(từ gợi ý: align with my interest, future opportunities, inspired by)","Student 1:","Student 2:","Student 3:","Student 4:","B: What would you say was the most interesting course you studied in university?c\u000bA: That would definitely be ______ because ______.","Student 1:","Student 2:","Student 3:","Student 4:","B: Is it really true that college life is much freer than middle school life? I mean, if college life is the same as this, I don’t think I’m going to make it through all those years of intense studying.\u000bA: College life is ______.","(từ gợi ý: struggle with, hands-on experience, manage time effectively, challenging workload","Student 1:","Student 2:","Student 3:","Student 4:","B: Was there anything you disliked about college?\u000bA: Well, yes. One thing I really disliked was ______.","Student 1:","Student 2:","Student 3:","Student 4:","B: And what would you say was the best thing about being a college student?\u000bA: For me, the best thing was ______.","Student 1:","Student 2:","Student 3:","Student 4:","B: Well, college certainly does sound like something to look forward to. I’d better keep on studying if I’m ever going to make it into college. Thanks for the encouragement. I really appreciate it.\u000bA: No problem at all. All the best to you! Study hard!","❓1. What do you major in?"]},{"title":"Phần ôn tập 37 · SPEAKING BUỔI 5: HOMETOWN","items":["✨ Your version (based on your background):","I major in Hospital Administration. It’s a program that focuses on both healthcare and management. I chose this field because I want to work in a hospital, but more in the administrative and supportive roles, rather than as a medical staff. I’m more comfortable working with data, documents, and coordination tasks.","❓2. What subject do you study?","I study subjects related to hospital operations, such as human resource management, healthcare laws, and medical office procedures. I also had some classes on medical terminology and communication in hospitals, which were very useful when I worked as a medical secretary.","❓3. Why did you choose this subject?","I chose this subject because I enjoy working in hospitals, but I prefer doing things like planning, organizing, and supporting medical staff, not giving direct treatment. I also enjoy using the computer, doing data entry, and learning new software. I think this major really suits my personality and skills.","❓4. What do you find most difficult in your studies?","For me, the most difficult part is medical terminology in English. When I worked as a medical secretary, I realized that using the wrong term can cause confusion. That’s why I’m trying to improve my English speaking and listening skills every day.","❓5. What do you find most interesting in your studies?","I find hospital HR management very interesting. I love learning how to manage people, schedule shifts, and support staff. I also enjoyed my internship at Vinmec, where I learned how important it is to keep things organized and communicate well with doctors and patients.","❓6. What would you like to do after graduation?","I would like to work in the Human Resources Department of a hospital. I want to help manage staff data, support new employees, and make sure everything runs smoothly. I’m also studying Excel and Power BI so I can analyze staff performance and help the hospital make better decisions.","What did you study in university?","I specialize in Hospital administration at the Economic University in Ho Chi Minh City. I chose this field because I have always been interested in the healthcare system, and hope my family gets healthcare benefits from staff in a hospital. Besides, it’s a perfect combination of management, service, and public health. But my determined study of this major gave me insight into how hospitals operate, from Hr to finance and I found that really eye - opening.","What kind of courses did you take for that major?","I took a variety of courses including Healthcare Management, Medical Terminology, Human Resources in Hospitals, and Health Economics, Medical Record Management","Why did you choose that major?","What would you say was the most interesting course you studied in university?","Is it really true that college life is much freer than middle school life?","Was there anything you disliked about college?","And what would you say was the best thing about being a college student?"]},{"title":"TOPIC 3: STUDIES & SCHOOL","items":["TOPIC 3: STUDIES & SCHOOL","Please do the rest as your homework and fill in the docs link:","🧠 BÀI HỌC: LƯỢNG TỪ TRONG TIẾNG ANH (QUANTIFIERS)","🔰 I. LƯỢNG TỪ LÀ GÌ?","Lượng từ là các từ chỉ số lượng của danh từ (bao nhiêu người, bao nhiêu đồ, v.v.).\u000b Chúng chia thành 3 nhóm chính:","🟢 1. LƯỢNG TỪ DÙNG VỚI DANH TỪ ĐẾM ĐƯỢC","👉 Dùng khi bạn đếm được từng cái một (books, apples, people...)","Từ","Nghĩa","Ví dụ","many","nhiều","Do you have many friends?","few","rất ít (gần như không có) – tiêu cực","He has few friends.","a few","một vài – tích cực","She has a few good friends.","several","một vài","Several students are absent today.","💡 Ghi nhớ:","\"few\" = không đủ","\"a few\" = đủ dùng","🔵 2. LƯỢNG TỪ DÙNG VỚI DANH TỪ KHÔNG ĐẾM ĐƯỢC","👉 Dùng với những thứ không đếm từng cái được (water, sugar, money...)","Từ","Nghĩa","Ví dụ","much","nhiều","Is there much rice left?","little","rất ít – tiêu cực","I have little time.","a little","một ít – tích cực","There's a little hope.","💡 Ghi nhớ:","\"little\" = gần như không có","\"a little\" = có một ít, đủ dùng","🟣 3. DÙNG ĐƯỢC VỚI CẢ HAI LOẠI DANH TỪ","Từ","Nghĩa","Ví dụ","some","một ít/một vài","I have some questions.","any","một chút nào/ bất kỳ","Do you have any sugar?","no","không có","There are no students here.","all","tất cả","All people are equal.","most","hầu hết","Most students passed.","enough","đủ","We have enough chairs.","every","mỗi (đếm được số ít)","Every child needs love.","each","từng người, từng cái","Each student has a book."]},{"title":"Phần ôn tập 39 · TOPIC 3: STUDIES & SCHOOL","items":["🌟 II. CỤM TỪ CHỈ SỐ LƯỢNG","Cụm từ","Nghĩa","Danh từ đi kèm","Ví dụ","a number of","một số lượng","Đếm được","A number of students are missing.","a great deal of","rất nhiều","Không đếm được","She spent a great deal of time.","plenty of","dư dả","Cả hai","There are plenty of options.","a lot of / lots of","rất nhiều (thân mật)","Cả hai","Lots of people came.","dozens of","hàng tá","Đếm được","Dozens of tourists visited.","✍️ III. BÀI TẬP NHANH:","🔹 Bài 1: Điền từ thích hợp (many, much, few, little, some, any, every, each)","There isn’t much milk in the fridge.","I have many questions to ask you.","She has few friends, so she feels lonely.","Every student in the class has to submit the project.","He gave a gift to each of his children.","🔹 Bài 2: Chọn đáp án đúng","There are plenty of opportunities for young people these days.","We need a large amount of water to survive.","🎯 MẸO GHI NHỚ NHANH","Đếm được: dùng many, few, a few, several","Không đếm được: dùng much, little, a little","Dùng chung: some, any, a lot of, all, most","🗣 GỢI Ý CÂU HỎI CHO GIÁO VIÊN","✏️ Về cấu trúc ngữ pháp","Can we use quantifiers before adjectives? (e.g. much easier?)\u000b → Chúng ta có thể dùng lượng từ trước tính từ không? (Ví dụ: much easier?)","Are there any exceptions to the countable/uncountable rules?\u000b → Có ngoại lệ nào cho quy tắc danh từ đếm được và không đếm được không?","How do quantifiers affect the verb – singular or plural?\u000b → Lượng từ ảnh hưởng thế nào đến động từ – chia số ít hay số nhiều?","Sự khác biệt giữa \"a number of\" và \"the number of\"","💬 Về thực hành giao tiếp","Can you give me 5 daily questions using different quantifiers?\u000b → Cô/cậu có thể cho em 5 câu hỏi giao tiếp hằng ngày dùng lượng từ khác nhau không?","Can we play a game or do an exercise to practice using quantifiers?\u000b → Mình có thể chơi trò chơi hoặc làm bài tập để luyện dùng lượng từ không?","Can I make flashcards with pictures for quantifiers?\u000b → Em có thể làm flashcard có hình để học lượng từ không?","🧠 MẸO NHỚ NHANH (theo kiểu cô Mai Phương)","Few vs. A few / Little vs. A little\u000b 👉 Có “a” là còn có hy vọng 😊\u000b 👉 Không có “a” là gần như chẳng có gì 😢","Many = đếm được / Much = không đếm được\u000b 👉 Many = có chữ “n” như “nhiều người”\u000b 👉 Much = không đếm được, như nước, sữa, thời gian","Some – Any – No\u000b 👉 Some = khẳng định & mời mọc\u000b 👉 Any = phủ định & câu hỏi\u000b 👉 No = phủ định mạnh (nên đi với danh từ KHÔNG có “not”)","💡 I. ĐỊNH NGHĨA","Lượng từ (Quantifier) là từ/cụm từ đứng trước danh từ, dùng để chỉ số lượng.\u000b Có thể dùng cho danh từ đếm được (countable) hoặc không đếm được (uncountable).","🔹 Đếm được số ít → dùng: a/an, one, each, every","🔹 Đếm được số nhiều → dùng: many, few, a few, several","🔹 Không đếm được → dùng: much, little, a little","🔹 Cả hai → some, any, no, a lot of, plenty of, enough, most, all","📘 II. Lượng từ + Danh từ đếm được hoặc không đếm được","Lượng từ","Dùng với","Ví dụ","✅ a/an/one","Danh từ đếm được số ít","a pen, an egg, one student","✅ many","Danh từ đếm được số nhiều","many books, many students","✅ few / a few"]},{"title":"Phần ôn tập 40 · TOPIC 3: STUDIES & SCHOOL","items":["Danh từ đếm được số nhiều","a few apples (một vài trái táo – tích cực)","few apples (gần như không có – tiêu cực)","✅ several","Danh từ đếm được số nhiều","several friends, several emails","✅ much","Danh từ không đếm được","much money, much time","✅ little / a little","Danh từ không đếm được","a little milk (một ít – đủ dùng)","little milk (rất ít – gần như không đủ)","✅ some / any / no","Cả hai loại danh từ","some books (đếm được số nhiều)","some water (không đếm được)","Do you have any sugar?","There is no information.","✅ a lot of / lots of","Cả hai loại danh từ","a lot of people (đếm được)","lots of juice (không đếm được)","✅ plenty of","Cả hai loại danh từ","plenty of food / plenty of chairs","✅ each / every","Danh từ đếm được số ít","each student, every day","✅ all / most / enough","Cả hai loại danh từ","all the books / all the money","most people / most information","enough chairs / enough water","✨ PHẦN II: CỤM TỪ CHỈ SỐ LƯỢNG (EXPRESSIONS OF QUANTITY)","🧠 Khái niệm:","Cụm từ chỉ số lượng là những từ/cụm dùng để nói bao nhiêu người, vật, hoặc thứ gì đó. Nó giúp người học biết được số lượng là ít, nhiều, vừa phải, và chúng đi kèm danh từ.","🟦 1. CỤM CHỈ SỐ LƯỢNG XÁC ĐỊNH (Definite Quantifiers)","🔹 A number of + danh từ đếm được số nhiều","📌 Nghĩa: một vài, một số lượng (không cụ thể số, nhưng đã xác định trong ngữ cảnh)\u000b 👉 Chỉ dùng với danh từ đếm được số nhiều","📍 Ví dụ:\u000b ✔️ A number of books are missing from the library.\u000b → Một số cuốn sách đã bị mất trong thư viện.","💡 Mẹo nhớ:\u000b \"A number of\" = giống như “several” (một số), đi với danh từ đếm được số nhiều","🔹 A great deal of / A large amount of + danh từ không đếm được","📌 Nghĩa: rất nhiều\u000b 👉 Chỉ dùng với danh từ không đếm được như: time, money, water, love...","📍 Ví dụ:\u000b ✔️ She spent a great deal of time on this project.\u000b → Cô ấy đã dành rất nhiều thời gian cho dự án này.","💡 Mẹo nhớ:\u000b Great deal = lớn\u000b Amount = số lượng\u000b → Chỉ những thứ không đếm từng cái được, mà phải đo bằng tổng khối lượng.","🟩 2. CỤM CHỈ SỐ LƯỢNG KHÔNG XÁC ĐỊNH (Indefinite Quantifiers)","🔹 A lot of / Lots of + danh từ đếm được & không đếm được","📌 Nghĩa: rất nhiều (cách nói thân mật, phổ biến)\u000b 👉 Dùng được với mọi loại danh từ.","📍 Ví dụ:\u000b ✔️ They have a lot of friends. (đếm được)\u000b ✔️ She has lots of homework. (không đếm được)","💡 Mẹo nhớ:\u000b “Lots of / A lot of” = siêu đa năng, văn nói thân mật, cực dễ dùng!","🔹 Dozens of + danh từ đếm được số nhiều","📌 Nghĩa: hàng tá, rất nhiều\u000b 👉 “Dozen” nghĩa là 12, “dozens of” → rất nhiều (nhiều hơn một tá)\u000b 👉 Chỉ dùng với danh từ đếm được số nhiều","📍 Ví dụ:\u000b ✔️ Dozens of people attended the event.\u000b → Hàng tá người đã tham dự sự kiện.","💡 Mẹo nhớ:\u000b Dozen = 12 → Dozens = nhiều gấp nhiều lần 12 → Chỉ số đông, dân số, người, đồ vật đếm được.","🔹 Plenty of + danh từ đếm được / không đếm được","📌 Nghĩa: nhiều, đủ xài, dư dả\u000b 👉 Dùng với cả danh từ đếm được và không đếm được\u000b 👉 Nghĩa thường tích cực, mang cảm giác yên tâm, thoải mái","📍 Ví dụ:\u000b ✔️ There are plenty of opportunities available.\u000b → Có rất nhiều cơ hội đang có sẵn.","💡 Mẹo nhớ:\u000b Plenty = nghe như “plan” + “tea” = đủ trà để uống → nhớ là đủ, dư, an tâm 😄","📝 BẢNG TỔNG HỢP NHANH","Cụm từ","Dùng với gì?","Trang trọng hay thân mật?","Ghi nhớ","A number of","Danh từ đếm được số nhiều","Trang trọng hơn","Một số lượng","A great deal of","Danh từ không đếm được"]},{"title":"Phần ôn tập 41 · TOPIC 3: STUDIES & SCHOOL","items":["Trang trọng hơn","Rất nhiều","A large amount of","Danh từ không đếm được","Trang trọng hơn","Khối lượng lớn","A lot of","Cả 2 loại danh từ","Thân mật, tự nhiên","Đa năng","Lots of","Cả 2 loại danh từ","Thân mật, tự nhiên","Dễ dùng","Dozens of","Danh từ đếm được","Bình thường","Hàng tá","Plenty of","Cả 2 loại danh từ","Trung tính","Dư dả","I. Complete the sentences with some or any","Quy tắc chính:","Some dùng trong câu khẳng định và câu hỏi khi đề nghị, mời gọi.","Any dùng trong câu phủ định và câu hỏi (không dùng để đề nghị).","We didn’t buy any flowers.\u000b → Câu này là phủ định, nên dùng any.","This evening I’m going out with some friends of mine.\u000b → Câu khẳng định nên dùng some.","I didn’t have any money, so I had to borrow some.\u000b → Phủ định → dùng any.\u000b → Mượn một ít tiền → dùng some thay cho danh từ không đếm được money.","Can I have some milk on my coffee, please?\u000b → Đây là câu hỏi mang tính đề nghị, mời gọi, nên dùng some (milk là danh từ không đếm được).","I was too tired to do any work.\u000b → Phủ định → dùng any (work không đếm được).","Have you seen any good films recently?\u000b → Câu hỏi không mang tính đề nghị nên dùng any (films là danh từ đếm được số nhiều).","Can you give me some information about places of interest in the town?\u000b → Câu hỏi đề nghị, mời gọi → dùng some (information là danh từ không đếm được).","With the special tourist train ticket, you can travel on any train you like.\u000b → Nghĩa \"bất kỳ\" → dùng any.","If there are any words you don’t understand, use a dictionary.\u000b → Câu điều kiện phủ định → dùng any.","She went out without any money.\u000b → Phủ định → dùng any.","She didn’t go out with any money.","→ “Without” là phủ định, nên dùng ‘any’","II. Complete the conversations with some, any, anyone, someone, something, anything, somewhere, anywhere","Quy tắc:","some / someone / something / somewhere dùng trong câu khẳng định, yêu cầu, đề nghị, lời mời.","any / anyone / anything / anywhere dùng trong câu hỏi( nghi vấn) và phủ định.","A: We haven’t got any bread.\u000b B: You’d better go to the shop, then. We need some tomatoes, too.\u000b → A phủ định nên dùng any; B khẳng định nên dùng some.","A: Would you like some cheese and biscuits?\u000b B: Oh, no thank you. That was delicious, but I couldn’t eat anything else.\u000b → Câu hỏi đề nghị dùng some; câu trả lời phủ định dùng anything.","A: There’s someone at the door.\u000b B: Are you expecting any visitors?\u000b → Câu khẳng định dùng someone; câu hỏi dùng anyone.","A: Has anyone offered to help you with the tea?\u000b B: No, but I’d be very grateful for any help you can give.\u000b → Câu hỏi dùng anyone; câu trả lời phủ định dùng any.","A: I was looking for something, and now I can’t remember what it was.\u000b B: You said you were looking for some/a few matches.\u000b → Câu khẳng định dùng something và some.","A: Does anyone mind if I open the window?\u000b B: No, please do. We all need some fresh air.\u000b → Câu hỏi dùng anyone; câu khẳng định dùng some.","A: Where shall we go on holiday?\u000b B: Let’s go somewhere warm and sunny.\u000b → Câu hỏi dùng where; câu trả lời khẳng định dùng somewhere.","A: What happened to Sally last night?\u000b B: I don’t know exactly. She was upset about something and refused to talk to anyone.\u000b → Câu khẳng định dùng something; phủ định dùng anyone.","A: Would you like something to eat?\u000b B: No, I don’t want anything to eat. But I’m thirsty, I want something to drink.\u000b → Câu hỏi dùng something; phủ định dùng anything; khẳng định dùng something.","A: What would you like?\u000b B: I don’t mind.\u000b → Câu trả lời chung chung, không cần từ phủ định hay khẳng định.","A: Do you know anyone here named Jim?\u000b B: No, he lives in another part of town.\u000b → Câu hỏi dùng anyone (câu hỏi), câu trả lời phủ định không dùng từ phủ định trong câu.","III. Complete with a lot of, many, much","Quy tắc:","Many dùng với danh từ đếm được số nhiều.","Much dùng với danh từ không đếm được.","A lot of dùng cho cả hai, nghĩa \"rất nhiều\".","There are a lot of athletes taking part in the International Games in London. \u000b → athletes đếm được → dùng a lot of.","There’s been a lot of coverage in the papers.\u000b → coverage không đếm được → dùng a lot of.","Our runners haven’t won many medals.\u000b → medals đếm được số nhiều → dùng many.","No, not as many as last time. But there is plenty of time.\u000b → so sánh số lượng với many.","There are still many events to come.\u000b → events đếm được, số nhiều→ dùng many.","I’d like to go and see some of the track events, but I haven’t got much time at the moment.\u000b → time không đếm được → dùng much.","Daniel: No, not with exams coming up. We’re having so many lessons to study.\u000b → lessons đếm được → dùng many.","Matthew: I’m hoping to go at the weekend if I can get a ticket. Apparently.There aren’t many seats left.\u000b → seats đếm được → dùng many.","Daniel: I’ve heard the cheapest tickets are £25.. I think that’s too much.\u000b → much dùng với danh từ không đếm được.","IV. Put in a few, few, a little, little","Quy tắc:","A few / few dùng với danh từ đếm được (few = ít, a few = một vài)."]},{"title":"Phần ôn tập 42 · TOPIC 3: STUDIES & SCHOOL","items":["A little / little dùng với danh từ không đếm được (little = ít, a little = một ít).\u000bFew vs. A few / Little vs. A little\u000b 👉 Có “a” là còn có hy vọng 😊\u000b 👉 Không có “a” là gần như chẳng có gì 😢","I don’t think I can lift this box on my own. I need a little help.\u000b → help không đếm được → a little nghĩa là “một ít”.","Few tourists visited Northern Ireland in the 1980s because of the terrorism there.","→ tourists đếm được → few nghĩa “ít, không đủ”.","The postman doesn’t often come here. We receive few letters.\u000b → letters đếm được → few nghĩa “ít”.","The snow was quite deep..There seemed little hope  of completing our journey.\u000b → hope không đếm được → little nghĩa “ít”.","Trevor doesn’t find it easy to fix the shelves.He’s having a little trouble.\u000b → trouble không đếm được → a little nghĩa “một ít”.","Sarah is exhausted.She’s having a few days’ holiday next week.\u000b → days đếm được → a few nghĩa “một vài”.","David quite likes golf, but unfortunately, He has little ability.\u000b → ability không đếm được → little nghĩa “ít”.","I can speak a few words of Swedish, but I’m not very fluent.\u000b\u000b → words đếm được → a few nghĩa “một vài”.","Listen carefully..I’m going to give you a little advice.\u000b → advice không đếm được → a little nghĩa “một ít”.","“Have you ever been to Paris?” “Yes,I’ve been there a few times.\u000b → times đếm được → a few nghĩa “một vài”.","V. Complete paragraph with many, few, much, little","The main town of the island is very small and does not have many important buildings. (buildings đếm được số nhiều). The islanders do not have much money. (money không đếm được),  and they have little contact with the outside world. (contact không đếm được, ít). There is not much chance of... (chance không đếm được) the place attracting large numbers of tourists. The roads are not very good. There are lots of bicycles but not many cars. (cars đếm được số nhiều) And  there are hardly any of the modern facilities which visitors expect. There are few shops. (shops đếm được số nhiều, ít) , and there is little entertainment. (entertainment không đếm được, ít)","VI. Choose the correct words — giải thích chi tiết","We didn’t spend much money.\u000b → money là danh từ không đếm được → dùng much.","You must be quick. We have little time.\u000b → time không đếm được, ít → dùng little.","They’ve got so much money that they don’t know what to do with it.\u000b → money không đếm được → much.","Did you take many photographs when you were on holiday?\u000b → photographs đếm được → many.","Would you like less coffee than this?\u000b → coffee không đếm được → dùng less (so sánh giảm).","The tickets cost too much, so we can’t afford them.\u000b → price là không đếm được → much.","“Would you like some sugar in your tea?” “Yes, please.“Just a little.”\u000b → sugar không đếm được → a little.","If you have any problems, you can discuss them with your group leaders.\u000b → câu hỏi/phủ định, dùng any.","I take photos, but not as many as I used to. At one time I took many/a lot of.","→ photos đếm được → many.","How much butter do we put in?\u000b → butter không đếm được → much.","Quick! There’s somebody coming and I don’t want anybody to see us.\u000b → câu khẳng định → somebody.","→ câu phủ định → anybody.","He can speak a little English,  so it’s not difficult to communicate with him.\u000b\u000b → English không đếm được → a little.","My father drinks a lot of tea.\u000b → tea không đếm được → a lot of.","This is not a very interesting place to visit, so few tourists come here.\u000b → tourists đếm được → few.","She spent a great deal of time on the project.\u000b → time không đếm được → a great deal of = a lot of.","A large number of paintings have been sold.\u000b → paintings đếm được → a large number of.","We had not a lot of rain, but didn’t need many storms.\u000b → rain không đếm được → a lot of.\u000b → storms đếm được → many.","Do you mind if I ask you a few questions?\u000b → questions đếm được → a few.","The shop is very quiet.There are few customers here now.\u000b → customers đếm được → few nghĩa “ít”.","Bài tập + Giải thích chọn từ + Điều kiện dùng","I. Choose some or any","I didn’t buy _______ fruit at the market.","Đáp án: any","Giải thích: Đây là câu phủ định, nên dùng any (dùng trong câu phủ định và nghi vấn).","Từ đồng nghĩa: no (không mua quả nào)","Từ trái nghĩa: some (một vài, dùng câu khẳng định)","There are _______ people waiting outside the theater.","Đáp án: some","Giải thích: Câu khẳng định, dùng để nói có vài người đang đợi.","Điều kiện: some dùng trong câu khẳng định hoặc khi đề nghị, yêu cầu.","Từ đồng nghĩa: a few (một vài người)","Từ trái nghĩa: any (dùng trong câu phủ định/nghi vấn)","Can you give me _______ water, please?","Đáp án: some","Giải thích: Đây là câu hỏi dùng để đề nghị, yêu cầu nên dùng some (không dùng any trong lời đề nghị lịch sự).","Điều kiện: some dùng trong câu đề nghị.","Từ trái nghĩa: any (câu hỏi thông thường, không mang tính đề nghị)","I don’t have _______ time to go shopping today.","Đáp án: any","Giải thích: Câu phủ định, nên dùng any.","Từ đồng nghĩa: no","Từ trái nghĩa: some","We need to buy _______ new chairs for the dining room.","Đáp án: some","Giải thích: Câu khẳng định, nói về việc cần một số ghế mới.","Điều kiện: some dùng trong câu khẳng định.","Từ trái nghĩa: any","She didn’t make _______ mistakes in her test.","Đáp án: any","Giải thích: Câu phủ định, dùng any cho danh từ đếm được số nhiều trong câu phủ định.","Từ đồng nghĩa: no","Từ trái nghĩa: some","I have _______ interesting books at home."]},{"title":"Phần ôn tập 43 · TOPIC 3: STUDIES & SCHOOL","items":["Đáp án: some","Giải thích: Câu khẳng định, nên dùng some (một vài cuốn sách thú vị).","Từ đồng nghĩa: a few","Từ trái nghĩa: any","He didn’t want _______ help with his homework.","Đáp án: any","Giải thích: Câu phủ định, nên dùng any với danh từ không đếm được.","Từ đồng nghĩa: no","Từ trái nghĩa: some","II. Fill in the gaps using much, many, a lot of, a little, few, or little.","I don’t have _______ sugar left in my jar.","Đáp án: much","Giải thích: much dùng với danh từ không đếm được trong câu phủ định hoặc nghi vấn.","Từ đồng nghĩa: a little (ít nhưng đủ), little (ít và không đủ, tiêu cực).","Từ trái nghĩa: a lot of (nhiều)","There are _______ cars on the street today.","Đáp án: few","Giải thích: Dùng với danh từ đếm được số nhiều, few mang nghĩa “ít và không đủ” (tiêu cực).","Từ đồng nghĩa: a few (ít nhưng đủ)","Từ trái nghĩa: many (nhiều)","She drinks _______ coffee every morning.","Đáp án: a lot of","Giải thích: Dùng với danh từ không đếm được để nói “rất nhiều”.","Từ đồng nghĩa: much","Từ trái nghĩa: little (ít)","There is _______ time to finish the project.","Đáp án: little","Giải thích: Dùng với danh từ không đếm được, mang nghĩa tiêu cực “ít và không đủ”.","Từ đồng nghĩa: not enough time","Từ trái nghĩa: a lot of time, enough time","They didn’t buy _______ new clothes this month.","Đáp án: many","Giải thích: Dùng với danh từ đếm được số nhiều trong câu phủ định.","Từ đồng nghĩa: a lot of (nhiều)","Từ trái nghĩa: few","We need _______ information before we make a decision.","Đáp án: a lot of","Giải thích: Dùng với danh từ không đếm được trong câu khẳng định để nói “nhiều”.","Từ đồng nghĩa: much","Từ trái nghĩa: little","He has _______ friends in his new school.","Đáp án: few","Giải thích: Dùng với danh từ đếm được số nhiều, mang sắc thái tiêu cực “ít và không đủ”.","Từ đồng nghĩa: not many","Từ trái nghĩa: many, a lot of","I have _______ books on that subject.","Đáp án: a lot of","Giải thích: Dùng với danh từ đếm được số nhiều trong câu khẳng định để nói “rất nhiều”.","Từ đồng nghĩa: many","Từ trái nghĩa: few","III. Write sentences using too much, too many, enough, and not enough.","I have _______ homework to do tonight.","Đáp án: too much","Giải thích: Dùng với danh từ không đếm được để nói “quá nhiều” (tiêu cực).","Từ đồng nghĩa: quá tải, quá sức","Từ trái nghĩa: not enough","We don’t have _______ chairs for everyone.","Đáp án: enough (hoặc not enough)","Giải thích: Nói về số lượng đủ hoặc không đủ, ở đây là câu phủ định nên chọn not enough hoặc khẳng định \"enough\" đi với phủ định.","Từ đồng nghĩa: đủ hoặc thiếu","Từ trái nghĩa: too many","There is _______ salt in the soup.","Đáp án: too much","Giải thích: Dùng với danh từ không đếm được để nói “quá nhiều” (tiêu cực).","Từ trái nghĩa: not enough","They didn’t have _______ time to finish the assignment.","Đáp án: enough (hoặc not enough)","Giải thích: Câu phủ định nên dùng not enough để nhấn mạnh thiếu thời gian.","Từ trái nghĩa: too much","IV. Complete the conversation with appropriate words"]},{"title":"Phần ôn tập 44 · TOPIC 3: STUDIES & SCHOOL","items":["A: Do you want _______ to eat?","B: No, thanks. I’ve had _______ for lunch.","A: How about _______ ice cream?","B: I’m not sure. I think I have _______ sugar today.","Đáp án:","Hàng 1: something (đại từ để hỏi về một món gì đó)","Hàng 2: enough (đủ rồi)","Hàng 3: some (một chút, đề nghị)","Hàng 4: not enough (không đủ)","Giải thích:","something dùng khi hỏi hoặc đề nghị món ăn.","enough nghĩa là đã đủ rồi, không cần thêm.","some dùng trong câu đề nghị, mời.","not enough dùng khi muốn nói chưa đủ.","🧠 PHRASAL VERBS – CỤM ĐỘNG TỪ (từ vựng)","💬 “Phrasal verbs giúp tiếng Anh tự nhiên như người bản xứ – học đúng cách thì cực dễ nhớ!”","🟡 1. Phrasal Verbs là gì?","Là động từ + giới từ / trạng từ, tạo ra nghĩa mới hoàn toàn.","📌 Ví dụ:","Look after = chăm sóc (chứ không phải “nhìn sau” nhé!)","Take off = cất cánh hoặc cởi ra (tùy ngữ cảnh)","🟡 2. Có mấy loại Phrasal Verbs?","✅ a. Không tách được (Inseparable)","– Không được chèn tân ngữ vào giữa.\u000b 🔸 Look for (tìm kiếm): \u000b → I’m looking for my bag.","🔸 Run into (tình cờ gặp):\u000b → I ran into my teacher at the mall.","✅ b. Tách được (Separable)","– Có thể để tân ngữ ở giữa hoặc sau cụm từ.\u000b 🔸 Turn off (tắt):\u000b → Turn off the TV. = Turn the TV off.","🔸 Pick up (đón / nhặt):\u000b → I’ll pick you up. = I’ll pick up you.","📌 ⚠️ Nếu tân ngữ là “it”, bắt buộc để ở giữa: Turn it off ✅ / Turn off it ❌","✅ c. Nội động từ (Intransitive)","– Không cần tân ngữ.\u000b 🔸 Come back (trở lại): He’ll come back.\u000b 🔸 Wake up (thức dậy): I wake up at 6.","🟡 3. Một số Phrasal Verbs hay gặp (cần nhớ)","📌 Phrasal Verb","🇻🇳 Nghĩa","📝 Ví dụ","Take off","Cất cánh / cởi ra","The plane took off.","Put on","Mặc vào","Put on your coat.","Give up","Từ bỏ","Don’t give up!","Look after","Chăm sóc","She looks after her grandma.","Break down","Hỏng hóc","My motorbike broke down.","Get along with","Hòa hợp với","I get along with my brother.","Find out","Tìm ra","I found out the truth.","Call off","Hủy bỏ","They called off the trip.","🟡 4. Mẹo học cực dễ nhớ","💡 1. Học theo chủ đề\u000b Ví dụ:"]},{"title":"Chủ đề gia đình → look after, get along with","items":["Chủ đề gia đình → look after, get along with"]},{"title":"Chủ đề du lịch → take off, check in, get on","items":["Chủ đề du lịch → take off, check in, get on","💡 2. Ghi chú bằng màu / flashcard\u000b Ghi cụm từ + vẽ hình minh hoạ → nhớ lâu hơn chữ.","💡 3. Luyện câu ngắn mỗi ngày\u000b Ví dụ:","I get up at 6 a.m.","I put on my shoes.","I turn off the lights.","💡 4. Xem phim / nghe nhạc tiếng Anh\u000b Phrasal verbs xuất hiện rất nhiều trong phim Mỹ và nhạc Pop!","🟩 Mini Test nhanh (5s nhớ lâu)","Điền Phrasal Verb vào chỗ trống:","I always ________ my alarm at 6. (wake up / get up)","He ________ smoking last year. (give up / put on)","We ________ the meeting because of rain. (call off / look for)","She ________ her little sister after school. (looks after / gets on with)","My car ________ on the way to work. (broke down / ran into)","💬 Câu hỏi hay để hỏi giáo viên về Phrasal Verbs","Câu hỏi về cách dùng và ý nghĩa:","“Thầy/cô ơi, làm thế nào để phân biệt ý nghĩa của một phrasal verb khi nó có nhiều nghĩa khác nhau?”","“Có cách nào nhớ nhanh phrasal verbs thường dùng theo chủ đề không ạ?”","Câu hỏi về cấu trúc và ngữ pháp:","“Khi nào thì bắt buộc phải tách phrasal verb, khi nào thì không được ạ?”","“Nếu tân ngữ là đại từ thì có quy tắc nào đặc biệt không?”","“Có phrasal verbs nào vừa là nội động từ vừa là ngoại động từ không ạ?”","Câu hỏi về luyện tập và áp dụng:","“Em có thể luyện tập phrasal verbs hiệu quả hàng ngày như thế nào?”","“Thầy/cô có thể cho ví dụ về các câu phrasal verbs dùng trong giao tiếp hàng ngày hoặc công việc không?”","“Có bài tập hoặc trò chơi nào giúp nhớ phrasal verbs vui mà hiệu quả không ạ?”","Câu hỏi về cách phân biệt:","“Làm sao để phân biệt phrasal verbs với các cụm từ động từ khác như idioms hoặc collocations?”","“Có những phrasal verbs nào dễ bị nhầm lẫn và làm thế nào để tránh nhầm?”","Câu hỏi về phát âm và ngữ điệu:","“Phrasal verbs có cách nhấn giọng hoặc phát âm đặc biệt nào không thầy/cô?”","“Khi nói nhanh, phrasal verbs có bị lược bỏ hoặc nối âm như thế nào?”","Phrasal Verb","Nghĩa","Ví dụ","Break down","Hỏng hóc","My car broke down.","Break into","Đột nhập","Thieves broke into the house.","Break up","Chia tay","They broke up last month.","Call off","Hủy bỏ","They called off the meeting.","Carry on","Tiếp tục","Carry on with your work.","Cheer up","Vui lên","Cheer up! It’ll be fine.","Come back","Trở lại","He’ll come back tomorrow.","Come up with","Nghĩ ra ý tưởng","She came up with a plan.","Cut down on","Cắt giảm","You should cut down on sugar.","Find out","Tìm ra","I found out the truth.","Get along with","Hòa hợp với","I get along with him.","Get rid of","Loại bỏ"]},{"title":"Phần ôn tập 47 · Chủ đề du lịch → take off, check in, get on","items":["We need to get rid of it.","Give back","Trả lại","Give back the book, please.","Give up","Từ bỏ","Don't give up!","Go on","Tiếp tục, diễn ra","What’s going on here?","Hang out","Đi chơi, tụ tập","Let's hang out tonight.","Keep up with","Theo kịp","I can't keep up with him.","Look after","Chăm sóc","She looks after her dog.","Look for","Tìm kiếm","I'm looking for my keys.","Look forward to","Mong chờ, trông đợi","I look forward to seeing you.","Look into","Điều tra, xem xét","We’ll look into the issue.","Make up","Bịa chuyện / làm hòa","He made up a funny story.","Pass away","Qua đời","His grandfather passed away last year.","Pay back","Trả tiền lại","I'll pay back the money.","Pick up","Đón / nhặt lên","I'll pick up the kids.","Put off","Hoãn lại","They put off the meeting.","Put on","Mặc vào","Put on your jacket.","Run out of","Hết, cạn kiệt","We ran out of sugar.","Set up","Thiết lập / sắp xếp","They set up the meeting.","Take care of","Chăm sóc","She takes care of her kids.","Take off","Cất cánh / cởi ra","The plane took off.","Take up","Bắt đầu (sở thích)","She took up painting.","Turn down","Từ chối / giảm âm lượng","He turned down the offer.","Turn off","Tắt","Turn off the lights.","Turn on","Bật","Turn on the TV, please."]},{"title":"Phần ôn tập 48 · Chủ đề du lịch → take off, check in, get on","items":["Try on","Thử đồ","Try on this shirt.","Wake up","Thức dậy","I wake up at 7 a.m.","Work out","Tập thể dục / tìm ra","I work out every day.","Exercise 1: Fill in the blanks","I need to put on my jacket before going outside.\u000b → put on: dùng khi mặc quần áo, giày dép.","The meeting was called off because of the weather.\u000b → call off: hủy một sự kiện đã được lên kế hoạch.","I’ve lent the money to my friend.\u000b → Không có phrasal verb phù hợp vì “lent” là động từ thường.","I can’t believe you gave up your job!\u000b → give up: từ bỏ, ở đây là bỏ việc.","When did you come back from the trip?\u000b → come back: trở về từ một nơi nào đó.","I don’t have any bread left. We’ve run out of bread.\u000b → run out of: dùng hết, không còn nữa.","They set up their vacation next week.\u000b → Sai dùng. set up là thiết lập. Câu nên là are going on a vacation.","Can you turn up your phone? I can’t hear you.\u000b → turn up: tăng âm lượng. Không phải “turn on”.","The teacher asked us to hand in the project by Friday.\u000b → hand in: nộp bài, dự án.","My parents were very upset when they heard the news, but I hope they will cheer up.\u000b → cheer up: vui lên, tinh thần khá hơn.","Exercise 2: Choose the correct phrasal verb","I need to pick up my sister after school.\u000b → pick up: đón ai đó.","She’s been getting rid of all the things she doesn’t need.\u000b → get rid of: loại bỏ.","The car broke down on the way to the beach.\u000b → break down: xe bị hỏng.","I have to turn on the computer before the meeting.\u000b → turn on: bật thiết bị.","They set up a new office in the city center.\u000b → set up: thành lập văn phòng.","I don’t know what’s going on in this situation.\u000b → go on: đang diễn ra.","We need to wake up early tomorrow.\u000b → wake up: thức dậy.","Don’t worry, everything will work out just fine.\u000b → work out: ổn, sẽ thành công.","I couldn’t look for the answers to my questions, so I asked my teacher.\u000b → look for: tìm kiếm.","The company has decided to cut down on costs next year.\u000b → cut down on: giảm bớt.","Exercise 3: Fill in the blanks","The boss told me to put off the meeting until next week.\u000b → put off: trì hoãn.","I’ve been looking into this issue for a while now and still have no solution.\u000b → look into: tìm hiểu kỹ vấn đề.","We have to go over the results of the survey before making any decisions.\u000b → go over: xem lại, xem kỹ.","It’s getting late. We should call it a day now.\u000b → Thành ngữ: ngừng làm việc hôm nay.","I have to look after my grandmother while my parents are on vacation.\u000b → look after: chăm sóc.","Please don’t put off your homework. It’s important.\u000b → put off: trì hoãn.","I will take up this new hobby next year.\u000b → take up: bắt đầu sở thích mới.","The children are very active, but they burn out by the end of the day.\u000b → burn out: kiệt sức.","I don’t know why she’s so sad. Let’s try to cheer up her mood.\u000b → cheer up: làm ai đó vui lên.","I have to hand in the report by Friday.\u000b → hand in: nộp.","Exercise 4: Translate the sentences","I will pick up my daughter after school.\u000b → Đón con.","I can’t find my keys.\u000b → Có thể dùng look for.","Can you turn off the lights for me?\u000b → Tắt đèn.","They called off the meeting tomorrow.\u000b → Hủy cuộc họp.","She gave up studying after a few months.\u000b → Từ bỏ việc học.","You need to take up a new hobby right now.\u000b → Bắt đầu sở thích mới.","She will come back in a few days.\u000b → Trở lại.","I can’t keep up with this work.\u000b → Theo kịp công việc.","Don’t worry, everything will work out fine.\u000b → Mọi thứ sẽ ổn.","I need to check the results before making a decision.\u000b → Không có phrasal verb phù hợp, “check” là động từ thường.","Exercise 5: Complete with phrasal verbs","The project was so difficult, but we finally worked it out.\u000b → work out: giải quyết thành công.","I’ve put on a lot of weight since I started working out.\u000b → put on: tăng cân; work out: tập thể dục.","I will put on my coat before I leave.\u000b → put on: mặc áo.","He lost his phone while he was at the park.\u000b → Có thể là left behind nếu là để quên.","She is always so happy and cheers up others.\u000b → cheer up: làm ai đó vui lên.","They have set up the new office in a great location.\u000b → set up: thành lập.","He didn’t have time to study for his test, so he failed.\u000b → Không dùng phrasal verb ở đây.","The kids are so excited for the trip. They can’t wait to go on it.\u000b → go on: tham gia chuyến đi.","The train was delayed, so we had to put off our plans.\u000b → put off: hoãn.","I forgot to turn off the lights when I left the house.\u000b → turn off: tắt.","Exercise 6: Choose the correct answer","We need to come up with a new strategy to improve the business.\u000b → come up with: nghĩ ra.","I have to pick up the phone while I’m working.\u000b → pick up: trả lời điện thoại.","I can’t pick up my phone. Have you seen it?\u000b → pick up: nhặt lấy.","I really hope the weather will cheer up tomorrow.\u000b → cheer up: cải thiện (thời tiết), nghĩa mở rộng.","They decided to call off the meeting because of the rain.\u000b → call off: hủy bỏ."]},{"title":"Phần ôn tập 49 · Chủ đề du lịch → take off, check in, get on","items":["Exercise 7: Complete with the correct phrasal verb","I need to check in with my boss about the new project.\u000b → check in with: cập nhật, báo cáo tình hình.","We need to turn down the offer by tomorrow.\u000b → turn down: từ chối.","He’s planning to move out next month.\u000b → move out: dọn ra ngoài.","Can you look after this for me while I’m gone?\u000b → look after: trông nom.","I’ll pick up the kids after school today.\u000b → pick up: đón.","1. Điền từ đúng vào chỗ trống (Phrasal verbs)","Câu","Đáp án đúng","Từ đồng nghĩa (Synonyms)","Từ trái nghĩa (Antonyms)","I need to ________ my jacket before I leave for the party.","put on","wear, dress in","take off, remove","After the meeting, he will ________ his notes and email them to us.","take down","write, note","erase, delete","The meeting was ________ due to the snowstorm.","called off","canceled, aborted","held, proceeded","She was feeling down, but I tried to ________ her mood by giving her a gift.","cheer up","brighten, encourage","depress, sadden","I couldn’t believe they ________ their vacation because of the bad weather.","called off","canceled, scrapped","went ahead with, continued","Could you please ________ the phone, I have a call coming through?","pick up","answer, receive","hang up, ignore","They ________ the concert last night because of the rain.","called off","canceled, postponed","held, took place","This exercise is not very clear, I'll _______ it.","look into","investigate, examine","ignore, neglect","He needs to ________ the new policy during tomorrow’s meeting.","go over","review, check","overlook, skip","I’ve been trying to ________ this issue for a while now, but I’m not getting anywhere.","work through","solve, handle","give up, avoid","2. Chọn phrasal verb đúng (Multiple choice)","Câu","Đáp án đúng","Từ đồng nghĩa","Từ trái nghĩa","I hope everything will ________ in the end.","work out","succeed, turn out well","fail, collapse","After a long day of work, she likes to ________ with a good book.","wind down","relax, chill out","stress out, ramp up","The kids can’t wait for the weekend, they always ________ their activities.","look forward to","anticipate, await","dread, fear","We should try to ________ an appointment for next week.","set up"]},{"title":"Phần ôn tập 50 · Chủ đề du lịch → take off, check in, get on","items":["arrange, schedule","cancel, postpone","If you don’t ________ the TV, we’ll miss the start of the show.","turn on","switch on, power up","turn off, switch off","I need to ________ my sister while our parents are away.","look after","take care of, watch over","neglect, ignore","They decided to ________ expenses for the new project.","cut down on","reduce, decrease","increase, raise","I had to ________ the meeting due to an emergency.","call off","cancel, abort","hold, proceed","I’ll have to ________ the computer before starting the presentation.","turn on","switch on, power up","turn off, shut down","We’ll have to ________ the meeting again once everyone arrives.","pick up","resume, continue","stop, suspend","3. Dịch câu sang tiếng Anh (Phrasal verbs)","Câu tiếng Việt","Câu tiếng Anh","Từ đồng nghĩa","Từ trái nghĩa","Tôi đã tắt máy tính khi tôi rời khỏi văn phòng.","I turned off the computer when I left the office.","switched off, shut down","turned on, powered on","Họ quyết định hủy cuộc họp vì tình hình thời tiết.","They decided to call off the meeting because of the weather.","cancel, abort","hold, continue","Tôi sẽ bắt đầu dự án này vào tuần tới.","I will set up this project next week.","start, initiate","stop, end","Cô ấy cần chăm sóc em gái tôi trong khi tôi đi công tác.","She needs to look after my little sister while I’m on a business trip.","take care of, watch over","neglect, ignore","Bạn có thể giúp tôi giải quyết vấn đề này không?","Can you help me work out this problem?","solve, figure out","ignore, complicate","4. Tự tạo câu với phrasal verbs","Phrasal verb","Câu mẫu đúng","Từ đồng nghĩa","Từ trái nghĩa","look forward to","I look forward to meeting my friends this weekend.","anticipate, await","dread, avoid","make up","They always make up after arguing.","reconcile, resolve","quarrel, fight","take up","I want to take up swimming and do it twice a week to stay healthy.","start, begin","quit, stop","pick up","I will pick up my little sister from school at 3 p.m."]},{"title":"Phần ôn tập 51 · Chủ đề du lịch → take off, check in, get on","items":["collect, fetch","drop off, leave","pick up","I picked up a lot of phrasal verbs during my lesson today.","learned, acquired","forgot, lost","Slide:","HW phrases & clauses: https://forms.gle/nupSsfwbVzc61ErSA","1. Hoàn thành câu với because hoặc because of","Because + mệnh đề (có chủ ngữ + động từ)","Because of + cụm danh từ / cụm từ","Complete the sentences with either because or because of.","We delayed our trip because of the bad weather.\u000b Giải thích: “the bad weather” là cụm danh từ nên dùng because of.","Sue’s eyes were red because she had been crying.\u000b Giải thích: “she had been crying” là mệnh đề có chủ ngữ + động từ, dùng because.","My mother is always complaining because of the untidiness of my room.\u000b Giải thích: “the untidiness of my room” là cụm danh từ, dùng because of.","The water in most rivers is unsafe to drink because it’s polluted.\u000b Giải thích: “it’s polluted” là mệnh đề, dùng because.","The trees were bent over because of the wind.\u000b Giải thích: “the wind” là cụm danh từ, dùng because of.","You can’t enter this secure area because you don’t have an official permit.\u000b Giải thích: “you don’t have an official permit” là mệnh đề, dùng because.","It’s unsafe to travel in that country because of the ongoing civil war.\u000b Giải thích: “the ongoing civil war” là cụm danh từ, dùng because of.","Several people in the crowd became ill and fainted because of the extreme heat.\u000b Giải thích: “the extreme heat” là cụm danh từ, dùng because of.","Mark didn’t go to work yesterday because he didn’t feel well.\u000b Giải thích: “he didn’t feel well” là mệnh đề, dùng because.","We couldn’t get into the disco because of the enormous crowd.\u000b Giải thích: “the enormous crowd” là cụm danh từ, dùng because of.","Rewrite these sentences, using because.","2. Viết lại câu dùng because","Because + mệnh đề nguyên nhân thay cho cụm giới từ nguyên nhân (due to, because of...)","Due to the cold weather, we stayed home.\u000b → We stayed home because the weather was cold.","Most people hear jogging is a good exercise, so they begin to jog.\u000b → Most people begin to jog because they hear jogging is a good exercise.","People like to live in this country because of its healthy climate.\u000b → People like to live in this country because the climate is healthy.","A computer can be used for various purposes, so it becomes very popular nowadays.\u000b → A computer becomes very popular nowadays because it can be used for various purposes.","Stacey retired in 1987, partly because of ill health.\u000b → Stacey retired in 1987 because she was partly ill.","We were late for the meeting due to the heavy traffic.\u000b → We were late for the meeting because the traffic was heavy.","Harry had to stay in hospital because of his broken leg.\u000b → Harry had to stay in hospital because his leg was broken.","Our leader couldn’t attend the meeting, so it was canceled.\u000b → The meeting was canceled because our leader couldn’t attend.","The young couple decided not to buy the house because of its dilapidated condition.\u000b → The young couple decided not to buy the house because it was in a dilapidated condition.","I always enjoyed mathematics in high school, so I decided to major in it in college.\u000b → I decided to major in mathematics in college because I always enjoyed it in high school.","Change clauses of reason to phrases of reason.","3. Chuyển mệnh đề nguyên nhân thành cụm nguyên nhân (thay because + mệnh đề bằng because of + cụm danh từ)","Jim had to give up jogging because he had sprained his ankle severely.\u000b → Jim had to give up jogging because of a severe ankle sprain.","The water in most rivers is unsafe to drink because it’s polluted.\u000b → The water in most rivers is unsafe to drink because of pollution.","We had to stay in London an extra day because it was foggy at the airport.\u000b → We had to stay in London an extra day because of fog at the airport.","Bill has to do all of the cooking and cleaning because his wife is ill.\u000b → Bill has to do all of the cooking and cleaning because of his wife’s illness.","We all have received the best of everything because our parents are generous.\u000b → We all have received the best of everything because of our parents’ generosity.","I couldn’t get to sleep last night because it was noisy in the next apartment.\u000b → I couldn’t get to sleep last night because of the noise from the next apartment.","John has to sit in the front row in class because he has poor eyesight.\u000b → John has to sit in the front row in class because of poor eyesight.","We stopped our car because the traffic lights turned red.\u000b → We stopped our car because of the red traffic light.","She couldn’t see the road because the wall was too high.\u000b → She couldn’t see the road because of the high wall.","We postponed our trip because the driving conditions were bad.\u000b → We postponed our trip because of bad driving conditions.","Sarah will not walk across a bridge because she’s afraid of heights.\u000b → Sarah will not walk across a bridge because of her fear of heights.","Mark’s doctor has advised him to exercise regularly because he is overweight.\u000b → Mark’s doctor has advised him to exercise regularly because of his overweight condition.","Piranhas can devour an entire cow in several minutes because their teeth are extremely sharp.\u000b → Piranhas can devour an entire cow in several minutes because of their extremely sharp teeth.","John succeeded in his final exams because he worked hard and methodically.\u000b → John succeeded in his final exams because of his hard and methodical work.","Complete the answers to the questions. Use too or enough with the word in brackets.","1.","A: Is she going to get married?\u000b B: No, she’s not old enough to get married.\u000b ➤ Giải thích:","\"enough + adj\" → \"old enough\" (đủ lớn)","Dịch: Cô ấy chưa đủ lớn để kết hôn.","Câu khác: She is too young to get married (Cô ấy quá trẻ để kết hôn).","2.","A: I need to talk to you about something.\u000b B: I’m afraid I’m too busy to talk to you now.\u000b ➤ Giải thích:","too + adj + to V → \"too busy to talk\" (quá bận để nói chuyện)","Dịch: Tôi e là tôi quá bận để nói chuyện với bạn bây giờ.","Câu khác: I’m afraid i’m not free enough to talk to you now.","3.","A: Let’s go to the cinema.\u000b B: No, it’s too late to go to the cinema.\u000b Hoặc: It’s not early enough to go to the cinema.\u000b ➤ Giải thích:","too + adj + to V → \"too late to go\" (quá trễ để đi)","not + adj + enough + to V → \"not early enough\" (không đủ sớm)","Dịch: Không, quá trễ để đi xem phim rồi / Không còn sớm nữa để đi xem phim.","4.","A: Why don’t we sit in the garden?\u000b B: It’s not warm enough to sit in the garden.\u000b Hoặc: It’s too cold to sit in the garden.\u000b ➤ Giải thích:","not + adj + enough + to V → \"not warm enough to sit\""]},{"title":"Phần ôn tập 52 · Chủ đề du lịch → take off, check in, get on","items":["too + adj + to V → \"too cold to sit\"","Dịch: Trời chưa đủ ấm để ngồi ngoài vườn / Trời quá lạnh để ngồi ngoài vườn.","5.","A: Would you like to be a politician?\u000b B: No, I’m not nice enough to be a politician.\u000b Hoặc: I’m too bad to be a politician.\u000b ➤ Giải thích:","not + adj + enough + to V → \"not nice enough\" (không đủ tử tế)","too + adj + to V → \"too bad\" (quá tệ)","Dịch: Không, tôi không đủ tử tế để làm chính trị gia.","6.","A: Do you want to play tennis today?\u000b B: No, I haven’t got enough energy to play tennis today.\u000b ➤ Giải thích:","enough + noun + to V → \"enough energy to play\"","Dịch: Không, tôi không có đủ năng lượng để chơi tennis hôm nay.","Câu khác: No, I haven’t got too tired to play tennis today.","7.","A: Did you hear what he was saying?\u000b B: No, we were too far away to hear what he was saying.\u000b Hoặc: We weren’t near enough to hear.\u000b ➤ Giải thích:","too + adj + to V → \"too far away to hear\"","not + adj + enough → \"not near enough\"","Dịch: Không, chúng tôi ở quá xa để nghe / Chúng tôi không đủ gần để nghe.","8.","A: Can he read a newspaper in English?\u000b B: No, he doesn’t know enough English to read a newspaper.\u000b ➤ Giải thích:","enough + noun + to V → \"enough English\"","Dịch: Không, anh ấy không biết đủ tiếng Anh để đọc báo.","Câu khác: “He knows too little English”","9.","A: Why don’t you put the wallet in your pocket?\u000b B: It’s too big to put in my pocket.\u000b ➤ Giải thích:","too + adj + to V → \"too big to put\"","Dịch: Nó quá to để cho vào túi.","Câu khác: it’s not small enough to put in my pocket.","10.","A: I think you should apply for the job.\u000b B: I’m afraid I haven’t got enough qualifications to apply for the job.\u000b ➤ Giải thích:","enough + noun + to V → \"enough qualifications\"","Dịch: Tôi e là tôi không có đủ bằng cấp để nộp đơn.","Câu khác: I’m afraid i’m too unqualified to apply for the job\u000b\"Too\" không đi với \"have got\" + tính từ","Make one sentence from two. Use too or enough and a phrase with for or a to-infinitive.","1. We couldn’t eat the food. It was very hot.","✅ The food was too hot to eat.\u000b 👉 Giải thích: \"too + adj + to-infinitive\".","2. A taxi would have been best. But I didn’t have much money.","✅ I didn’t have enough money for a taxi.\u000b 👉 Giải thích: \"enough + danh từ + for\".","3. Sarah can’t take a day off. She’s very busy.","✅ Sarah is too busy to take a day off.\u000b 👉 Giải thích: \"too + adj + to\".","4. A picnic would be nice. But it’s wet.","✅ It’s too wet for a picnic.\u000b 👉 Giải thích: \"too + adj + for + noun\".","5. Nobody could move the piano. It was very heavy.","✅ The piano was too heavy to move.\u000b 👉 Giải thích: \"too + adj + to\".","6. I don’t wear this coat in winter. It isn’t warm.","✅ This coat isn’t warm enough to wear in winter.\u000b 👉 Giải thích: \"adj + enough + to\".","7. All my guests will need chairs. But I haven’t got very many.","✅ I haven’t got enough chairs for all my guests.\u000b 👉 Giải thích: \"enough + danh từ + for\".","8. I can’t explain the situation. It’s complicated.","✅ The situation is too complicated to explain.\u000b 👉 Giải thích: \"too + adj + to\".","9. Three people can’t sit on this sofa. It isn’t wide.","✅ This sofa isn’t wide enough for three people.\u000b 👉 Giải thích: \"adj + enough + for\".","10. I couldn’t carry the equipment. I had such a lot.","✅ I had too much equipment to carry.\u000b 👉 Giải thích: \"too much + noun + to\".","Put in so, such or such a.","📘 BẢNG SO SÁNH \"SO...THAT\" vs \"SUCH...THAT\"","Dạng câu","Công thức","Ví dụ","1. So + adjective/adverb + that","Dùng với tính từ/trạng từ, không có danh từ đi kèm","He is so tall that he can reach the ceiling.","2. So + many/few + plural noun + that","Dùng với danh từ đếm được số nhiều","There were so many people that we couldn’t move.","3. So + much/little + uncountable noun + that","Dùng với danh từ không đếm được","She had so much work that she stayed up all night.","4. Such + (a/an) + adjective + singular noun + that","Dùng với danh từ đếm được số ít","It was such a nice day that we went to the park."]},{"title":"Phần ôn tập 53 · Chủ đề du lịch → take off, check in, get on","items":["5. Such + adjective + plural noun + that","Dùng với danh từ đếm được số nhiều","They are such good students that the teacher praised them.","6. Such + adjective + uncountable noun + that","Dùng với danh từ không đếm được","It was such bad weather that we stayed indoors.","💡 Gợi ý cách học nhanh:","Nếu có danh từ → dùng such","Nếu chỉ có tính từ/trạng từ → dùng so","Nếu có \"many/much/few/little\" → dùng so","1. I like Tom and Ann. They’re such nice people.","👉 Giải thích: \"such + adj + plural noun\".","2. I was surprised that he looked so well after his recent illness.","👉 Giải thích: \"so + adj\" (không có danh từ đi kèm).","3. The weather is lovely, isn’t it? I didn’t expect it to be such a nice day.","👉 Giải thích: \"such a + adj + singular noun\".","4. He always looks good. He wears such nice clothes.","👉 Giải thích: \"such + adj + plural noun\".","5. It was such a boring film that I fell asleep.","👉 Giải thích: \"such a + adj + noun + that\".","6. The children had so much fun at the carnival that they begged to go again.","👉 Giải thích: \"so much + uncountable noun\".","7. The food at the hotel was so awful. I’ve never eaten such awful food.","👉 Giải thích: - \"so + adj\" (không có noun)\u000b → \"such + adj + noun\".","8. The test was so easy that everyone got a high score.","👉 Giải thích: \"so + adj + that\".","9. I didn’t realize you lived such a long way from the city center.","👉 Giải thích: \"such a + adj + noun\".","10. I feel like I have so little energy that I wonder if I’m getting sick.","👉 Giải thích: \"so little + uncountable noun\".","Combine the sentences using so ... that.","The weather was very hot. You could fry an egg on the sidewalk.\u000b 👉 The weather was so hot that you could fry an egg on the sidewalk.","I couldn’t understand her. She talked too fast.\u000b 👉 She talked so fast that I couldn’t understand.","Grandpa held me tightly when he hugged me. I couldn’t breathe for a moment.\u000b 👉 Grandpa hugged me so tightly that I couldn’t breathe.","There were very few people. The meeting was canceled.\u000b 👉 There were so few people that the meeting was canceled.","Ted couldn’t get to sleep last night. He was worried about the exam.","✅Ted was so worried about the exam that he couldn’t get to sleep last night.","Jerry got angry. He put his fist through the wall.","✅Jerry got so angry that he put his fist through the wall.","I have many problems. I can use all the help you can give me.","✅ I have so many problems that I can use all the help you can give me.","I can’t figure out what this sentence says. His handwriting is illegible.","✅ His handwriting is so illegible that I can’t figure out what this sentence says.","It took us only ten minutes to get there. There was little traffic.","✅ There was so little traffic that it took us only ten minutes to get there.","Too many people came to the meeting. There were not enough seats for everyone.\u000b✅ There were so many people came to the meeting that there weren’t enough seats.","Combine the sentences using such ... that.","1. We took a walk. It was a nice day.","✅ It was such a nice day that we took a walk.\u000b (Sai ở Student 1 vì thiếu \"such\" và vị trí chưa hợp lý)","2. It was an expensive car. We couldn’t afford to buy it.","✅ It was such an expensive car that we couldn’t afford to buy it.\u000b (Student 2, 3, 4 thiếu \"it\" cuối câu)","3. I don’t feel like going to class. We’re having beautiful weather.","✅ We’re having such beautiful weather that I don’t feel like going to class.","4. The classroom has comfortable chairs. The students find it easy to fall asleep.","✅ The classroom has such comfortable chairs that the students find it easy to fall asleep.","5. The tornado struck with great force. It lifted automobiles off the ground.","✅ The tornado struck with such great force that it lifted automobiles off the ground.\u000b (Student 3 thiếu phần sau)","6. This is good coffee. I think I’ll have another cup.","✅ This is such good coffee that I think I’ll have another cup.","7. Karen is a good pianist. I’m surprised she didn’t go into music professionally.","✅ Karen is such a good pianist that I’m surprised she didn’t go into music professionally.\u000b (Student 3 bị lỗi chính tả: \"planist\")","8. It was a good book. I couldn’t put it down.","✅ It was such a good book that I couldn’t put it down.\u000b (Student 2 viết nhầm \"good\")","9. We did a lot of gymnastics. We couldn’t walk afterwards.","✅ We did such a lot of gymnastics that we couldn’t walk afterwards.","10. They were beautiful flowers. We took a photograph of them.","✅ They were such beautiful flowers that we took a photograph of them.","Sarah was so late home that Mark had already gone to bed",".Mike hadn’t cooked for so long time that he’d almost forgotten how to","The piano was so heavy that Mike and Harriet couldn’t move it."]},{"title":"Phần ôn tập 54 · Chủ đề du lịch → take off, check in, get on","items":["Tom was so annoyed about United losing that he wouldn’t speak to anyone.","The band was such a big attraction that all the tickets sold out.","Vicky had so much work to do that she was sure she’d never finish it.","The party made so much noise that it kept all the neighbors awake.","She speaks English so well that you would think it was her native language.","It was such horrible weather that we spent the whole day indoors.","The music was so loud that you could hear it from miles away.","Use your own ideas to complete the sentences.","💡 1. Cấu trúc: so + tính từ/trạng từ + that + mệnh đề","✅ Dùng khi muốn nói quá... đến nỗi mà...","📌 Cấu trúc:\u000b So + adj/adv + that + S + V","💡 2. Cấu trúc: such + (a/an) + adj + noun + that + mệnh đề","✅ Dùng khi muốn nhấn mạnh một cái gì đó rất... đến nỗi mà...","📌 Cấu trúc:","Such + (a/an) + adj + singular noun + that + S + V","Such + adj + plural noun/uncountable noun + that + S + V","💡 3. Cấu trúc: too + adj/adv + to + V-infinitive","✅ Dùng khi muốn nói \"quá... đến nỗi không thể...\"","📌 Cấu trúc:\u000b Too + adj/adv + to + V","💡 4. Cấu trúc: adj/adv + enough + to + V-infinitive","✅ Dùng khi muốn nói đủ để làm gì đó","📌 Cấu trúc:\u000b Adj/adv + enough + to + V","📌 So sánh với cấu trúc adj + enough to V:","Cấu trúc","Ví dụ","adj + enough to V","She is old enough to drive.","adj + enough + noun + to V","She is old enough girl to drive.","➡️ Cấu trúc có thêm noun để nhấn mạnh vào đối tượng có tính chất đó.","so + adj/adv + that","such + (adj) + noun + that","too + adj/adv + to + V-inf","adj/adv + enough + (noun) + to + V-inf","adj + enough + noun + to + V-inf (bổ sung theo yêu cầu của bạn)","1. The exam was so difficult that…","✅ 1. The exam was difficult","So...that: The exam was so difficult that many students failed.","Such...that: It was such a difficult exam that many students failed.","Too...to: The exam was too difficult to pass.","Enough...to: The exam wasn’t easy enough to pass.","2. I was so tired that…","So…that: I was so tired that I fell asleep immediately.","Such…that: It was such a tiring day that I couldn’t stay awake.","Too…to: I was too tired to study.","Adj/adv + enough + (noun) + to: I was tired enough to skip dinner.","Adj + enough + noun + to: I had a strong enough headache to stop working.","3. They’ve got …. money that…","So…that: They’ve got so much money that they can buy a private island.","Such…that: They’ve got such a huge fortune that they never worry about bills.","Too…to: They have too much money to spend in a lifetime.","Adj/adv + enough + (noun) + to: They are rich enough to invest worldwide.","Adj + enough + noun + to: They have a large enough budget to build a hospital.","4. My …… busy man that…","So…that: My father is so busy that he forgets his own birthday.","Such…that: My father is such a busy man that he eats at his desk.","Too…to: He is too busy to talk to us sometimes.","Adj/adv + enough + (noun) + to: He is responsible enough to manage three departments.","Adj + enough + noun + to: He is a busy enough man to skip all family gatherings.","5. It was … lovely weather that…","So…that: It was so lovely that we spent all day outside.","Such…that: It was such lovely weather that we went on a trip.","Too…to: It was too lovely to stay indoors.","Adj/adv + enough + (noun) + to: It was pleasant enough to have a garden lunch.","Adj + enough + noun + to: It was lovely enough weather to organize a beach party.","6. He …. quickly that…","So…that: He ran so quickly that no one saw him pass.","Such…that: He made such quick moves that the opponent froze.","Too…to: He was too quick to catch.","Adj/adv + enough + (noun) + to: He was fast enough to win the race."]},{"title":"Phần ôn tập 55 · Chủ đề du lịch → take off, check in, get on","items":["Adj + enough + noun + to: He had a quick enough pace to beat the record.","7. We …. a good time …","So…that: We had so good a time that we forgot the time.","Such…that: It was such a good time that we wanted to do it again.","Too…to: We were too excited to notice it was raining.","Adj/adv + enough + (noun) + to: It was fun enough to make us laugh for hours.","Adj + enough + noun + to: We had a good enough time to tell stories for years.","8. I’ve got so many things to do that…","So…that: I’ve got so many things to do that I feel stressed.","Such…that: I have such a tight schedule that I can't relax.","Too…to: I’m too busy to watch TV.","Adj/adv + enough + (noun) + to: I’m organized enough to finish everything on time.","Adj + enough + noun + to: I have a long enough list to work all night.","9. These shoes are so expensive that…","So…that: These shoes are so expensive that I only wear them on special occasions.","Such…that: They are such expensive shoes that they come with a security tag.","Too…to: They are too expensive to buy right now.","Adj/adv + enough + (noun) + to: They are stylish enough to match any outfit.","Adj + enough + noun + to: These are expensive enough shoes to make a statement.","10. It was such an extraordinary story that…","So…that: The story was so extraordinary that I read it twice.","Such…that: It was such an extraordinary story that it became a bestseller.","Too…to: It was too extraordinary to be fiction.","Adj/adv + enough + (noun) + to: It was exciting enough to keep readers awake all night.","Adj + enough + noun + to: It was an extraordinary enough story to inspire a movie.","Although he behaved me badly, i still love me , treat him kindly because my love doesn’t depend on how he treat me, but my feeling will never be as whole as we once were","🧠 Tổng quan ngữ pháp Mệnh đề nhượng bộ","1. Although / Even though / Though (Liên từ - Conjunction)","Chức năng: Diễn tả sự tương phản giữa hai mệnh đề.","Cấu trúc: Theo sau là một mệnh đề (chủ ngữ + động từ).","Ví dụ: \"Although it rained, we went out.\"","2. In spite of / Despite (Giới từ - Preposition)","Chức năng: Diễn tả sự tương phản, giống như \"although\", nhưng theo sau là danh từ, đại từ hoặc động từ thêm -ing.","Cấu trúc: \"In spite of / Despite + danh từ / đại từ / V-ing\"","Ví dụ: \"Despite the rain, we went out.\"My English Pages","3. Because / Because of (Diễn tả nguyên nhân)","Because: Theo sau là một mệnh đề.","Ví dụ: \"We stayed at home because it was raining.\"","Because of: Theo sau là danh từ hoặc cụm danh từ.","Ví dụ: \"We stayed at home because of the rain.\"","✍️ Bài tập: Hoàn thành câu với although / in spite of / because of","Complete the sentences with although/ in spite of/ because of.","_____ it rained a lot, we enjoyed our holiday.","Đáp án: Although","Giải thích: Theo sau là mệnh đề \"it rained a lot\", nên dùng \"although\".Cambridge Dictionary+7Promova+7Learn English Today+7","Daniel forgot his passport _____ having it in his list.","Đáp án: In spite of","Giải thích: Theo sau là cụm V-ing \"having it in his list\", nên dùng \"in spite of\".The Art of Business English+2My English Pages+2EC English ( EN )+2","I couldn’t get to sleep _____ the noise.","Đáp án: Because of","Giải thích: \"The noise\" là danh từ, nên dùng \"because of\".YouTube+1EC English ( EN )+1","_____ I had nothing for lunch but an apple, I ate dinner early.","Đáp án: Because","Giải thích: Theo sau là mệnh đề \"I had nothing...\", nên dùng \"because\".","A lot of things went wrong _____ all our careful plans.","Đáp án: In spite of","Giải thích: \"All our careful plans\" là danh từ, nên dùng \"in spite of\".Cambridge Dictionary+4Learn English Today+4Promova+4","She wasn’t wearing a coat _____ it was quite cold.","Đáp án: Although","Giải thích: Theo sau là mệnh đề \"it was quite cold\", nên dùng \"although\".","He only accepted the job _____ the salary, which was very high.","Đáp án: Because of","Giải thích: \"The salary\" là danh từ, nên dùng \"because of\".","I went home early _____ I was feeling unwell.","Đáp án: Because","Giải thích: Theo sau là mệnh đề \"I was feeling unwell\", nên dùng \"because\".Learn English Today+8Perfect English Grammar+8Talk English+8","_____ I knew the truth, I decided not to tell them.","Đáp án: Although","Giải thích: Theo sau là mệnh đề \"I knew the truth\", nên dùng \"although\".","The villagers- dân làng refused to leave _____ the drought-hạn hán."]},{"title":"Phần ôn tập 56 · Chủ đề du lịch → take off, check in, get on","items":["Đáp án: In spite of","Giải thích: \"The drought\" là danh từ, nên dùng \"in spite of\".","We decided not to go out for a meal _____ we were simply too tired.","Đáp án: Because","Giải thích: Theo sau là mệnh đề \"we were simply too tired\", nên dùng \"because\".","Have you really got no money _____ the fact that you’ve had a job?","Đáp án: In spite of","Giải thích: \"The fact that you’ve had a job\" là cụm danh từ, nên dùng \"in spite of\".","Sarah can’t climb up the tree _____ her fear of heights.","Đáp án: Because of","Giải thích: \"Her fear of heights\" là danh từ, nên dùng \"because of\".","Matthew looked quite fresh, _____ he’d been playing squash.","Đáp án: Although","Giải thích: Theo sau là mệnh đề \"he’d been playing squash\", nên dùng \"although\".","_____ his age, John was not hired _____ he had the necessary qualifications.","Đáp án: Because of his age, John was not hired although he had the necessary qualifications.","Giải thích: \"His age\" là danh từ, nên dùng \"because of\"; \"he had the necessary qualifications\" là mệnh đề, nên dùng \"although\".","Make one sentence from two. Use the word(s) in brackets in your sentences.","1. I enjoyed the film. The story was silly. (in spite of)\u000b→ I enjoyed the film in spite of the silly story.","2. We live in the same street. We hardly ever see each other. (despite)\u000b→ Despite living on the same street, we hardly ever see each other.","3. My foot was injured. I managed to walk. (although)\u000b→ Although my foot was injured, I managed to walk.","4. They have very little money. They are happy. (in spite of)\u000b→ In spite of having very little money, they are happy.","5. I got very wet. I had an umbrella. (even though)\u000b→ Even though I had an umbrella, I got very wet.","6. I couldn’t sleep. I was tired. (despite)\u000b→ Despite being tired, I couldn’t sleep.","7. He liked the sweater. He didn't buy it. (though)\u000b→ Though he liked the sweater, he didn’t buy it.","8. I didn’t get the job. I had all qualifications. (in spite of)\u000b→ I didn’t get the job in spite of having all the necessary qualifications.","9. Nick used to smoke. He seems healthy. (although)\u000b→ Although Nick used to smoke, he seems healthy.","10. I turned on the air conditioner. It was hot. (even though)\u000b→ Even though I turned on the air conditioner, it was hot.","11. Laura wants to fly. She feels afraid. (in spite of the fact)\u000b→ Laura wants to fly in spite of the fact that she feels afraid.","12. Trevor didn’t notice the sign. It was right in front. (even though)\u000b→ Even though the sign was right in front of him, Trevor didn’t notice it.","13. I’m no better. I took pills. (despite the fact)\u000b→ I’m no better despite the fact that I took the pills.","14. Matthew doesn’t know French. It was his school subject. (though)\u000b→ Though French was his school subject, Matthew doesn’t know it.","15. Henry’s friend is a millionaire. He hates spending. (despite)\u000b→ Despite being a millionaire, Henry’s friend hates spending money.","16. We queued for an hour. We didn’t get tickets. (in spite of)\u000b→ In spite of queuing for an hour, we didn’t get tickets.","17. I had met her twice. I didn’t recognize her. (although)\u000b→ Although I had met her twice before, I didn’t recognize her.","18. Laura felt unwell. She went
