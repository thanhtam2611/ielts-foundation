<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Foundation Room</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#25354a;font:16px/1.65 system-ui}header{background:#203a52;color:white;padding:30px 6%}h1,h2,h3{line-height:1.25;margin:8px 0 14px}main{max-width:1250px;margin:auto;padding:24px;display:grid;grid-template-columns:280px 1fr;gap:22px}aside,section{background:white;border:1px solid #e1e6ea;border-radius:15px;padding:22px}aside{align-self:start}button,select,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #dbe4e9;background:white;color:#203a52;padding:9px 14px;border-radius:8px}button:hover,button.active{background:#e1eff0}button.primary{background:#226d70;color:white;border:0}nav button{display:block;width:100%;text-align:left;margin:5px 0;font-size:14px}nav{max-height:65vh;overflow:auto}input,textarea{width:100%;padding:12px;border:1px solid #ccd5df;border-radius:8px;margin:8px 0}textarea{min-height:90px}progress{width:100%;accent-color:#226d70}.tag{color:#226d70;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:1px}.example{background:#eef5f5;padding:18px;border-radius:10px}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}.muted{color:#64748b}.ok{color:#13734b}.bad{color:#b14334}details{margin:15px 0}a{color:#226d70} @media(max-width:750px){main{grid-template-columns:1fr;padding:12px}nav{max-height:200px}}</style><header><div class="tag" style="color:#bde3e3">30 DAY RESET • IELTS 0–3.0</div><h1>IELTS Foundation Room</h1>Học lại từ gốc · Hiểu cấu trúc · Tạo phản xạ</header><main><aside><h3>Tiến độ của bạn</h3><progress id="bar" max="30"></progress><div id="stat"></div><p class="muted">60–90 phút/ngày · 30 bài</p><nav id="nav"></nav><p><a href="https://docs.google.com/document/d/1qJ55Vo0MkJB7FsslCVjZl2IjKzQV5wMVV3Ho2X5dQSo/edit" target="_blank">Tài liệu gốc ↗</a></p></aside><section><div id="head"></div><div class="tabs" id="tabs"></div><div id="content"></div><hr><label>Ghi chú lỗi sai hôm nay<textarea id="note" placeholder="Ví dụ: quên thêm s sau she..."></textarea></label><button class="primary" id="done">Hoàn thành ngày học</button> <button id="next">Bài tiếp theo →</button></section></main><script>const data=[["Trật tự câu SVO", "S + V + O. Chủ ngữ đứng trước động từ, tân ngữ đứng sau.", "I study English every day.", "Tôi học tiếng Anh mỗi ngày.", "I ___ English every day.", "study", "My day"], ["To be", "I am; he/she/it is; you/we/they are. Be + adjective/noun.", "She is a nurse.", "Cô ấy là y tá.", "She ___ a nurse.", "is", "Job"], ["Danh từ và đại từ", "Danh từ gọi tên người/vật; I, you, he, she, it, we, they thay cho chủ ngữ.", "They live in a small house.", "Họ sống trong một ngôi nhà nhỏ.", "My parents are kind. ___ are kind.", "They", "Family"], ["Tính từ", "Adj + noun; be/seem/look + adj.", "He is a curious boy.", "Cậu ấy là một cậu bé tò mò.", "He is a ___ boy. (curiosity)", "curious", "Personality"], ["Trạng từ", "Trạng từ bổ nghĩa cho động từ, tính từ hoặc trạng từ khác.", "Helen speaks English fluently.", "Helen nói tiếng Anh trôi chảy.", "Time passes ___. (slow)", "slowly", "Studies"], ["Word form", "Tìm từ loại cần điền trước khi biến đổi từ. Tính từ sở hữu + danh từ.", "Sports are good for our health.", "Thể thao tốt cho sức khỏe của chúng ta.", "Sports are good for our ___. (healthy)", "health", "Health"], ["Ôn tuần 1", "Kiểm tra SVO, be, danh từ, tính từ và trạng từ.", "This exercise seems difficult.", "Bài tập này có vẻ khó.", "This exercise seems ___. (difficulty)", "difficult", "Review"], ["Present Simple", "I/you/we/they + V; he/she/it + V-s/es.", "He drives carefully.", "Anh ấy lái xe cẩn thận.", "He ___ carefully. (drive)", "drives", "Daily routine"], ["Phủ định và câu hỏi", "Do/does + S + V? S + do/does not + V.", "Does she work here?", "Cô ấy làm việc ở đây phải không?", "___ she work here?", "Does", "Job"], ["Trạng từ tần suất", "Usually/often đứng trước động từ thường, sau be.", "I usually wake up at six.", "Tôi thường thức dậy lúc sáu giờ.", "She ___ goes to the cinema. (frequency)", "frequently", "Daily activities"], ["Present Continuous", "S + am/is/are + V-ing: việc đang diễn ra.", "I am cooking dinner.", "Tôi đang nấu bữa tối.", "I am ___ dinner. (cook)", "cooking", "Food"], ["Past Simple", "S + V2/ed; did not + V; Did + S + V?", "I visited my hometown yesterday.", "Hôm qua tôi về thăm quê.", "I ___ my hometown yesterday. (visit)", "visited", "Hometown"], ["Future", "Will + V; be going to + V.", "I will study tonight.", "Tôi sẽ học tối nay.", "I will ___ tonight. (study)", "study", "Plans"], ["Ôn tuần 2", "Phân biệt hiện tại, quá khứ, tương lai qua dấu hiệu thời gian.", "She went to school yesterday.", "Hôm qua cô ấy đi học.", "She ___ to school yesterday. (go)", "went", "School"], ["A / an / the", "A/an với danh từ đếm được số ít chưa xác định; the khi đã xác định.", "I have an apple.", "Tôi có một quả táo.", "I have ___ apple.", "an", "Food"], ["Danh từ đếm được", "Many + danh từ đếm được số nhiều; much + không đếm được.", "I drink a lot of water.", "Tôi uống nhiều nước.", "How ___ water do you drink?", "much", "Food"], ["Giới từ thời gian", "At + giờ; on + ngày; in + tháng/năm.", "I start work at seven.", "Tôi bắt đầu làm việc lúc bảy giờ.", "I start work ___ seven.", "at", "Calendar"], ["Giới từ nơi chốn", "In: bên trong; on: trên bề mặt; next to: bên cạnh.", "The plant is next to the window.", "Chậu cây ở cạnh cửa sổ.", "The book is ___ the table. (trên)", "on", "House"], ["There is / are", "There is + số ít; there are + số nhiều.", "There are three bedrooms.", "Có ba phòng ngủ.", "There ___ three bedrooms.", "are", "House"], ["So sánh hơn", "Adj ngắn + er; more + adj dài; than.", "My room is smaller than yours.", "Phòng tôi nhỏ hơn phòng bạn.", "My room is ___ than yours. (small)", "smaller", "City"], ["Ôn tuần 3", "Ôn mạo từ, giới từ, danh từ và so sánh.", "This is the most valuable machine.", "Đây là chiếc máy có giá trị nhất.", "This is the most ___ machine. (value)", "valuable", "Review"], ["Adj -ing / -ed", "-ing mô tả tác nhân gây cảm xúc; -ed mô tả cảm xúc.", "The film is boring, so I am bored.", "Phim chán nên tôi thấy chán.", "The film is ___. (bore)", "boring", "Movies"], ["Collocations", "take care of, pay attention to, make a choice.", "I take care of my family.", "Tôi chăm sóc gia đình.", "Please pay attention ___ the lesson.", "to", "Family"], ["Like / enjoy / want", "Enjoy + V-ing; want + to V; like + V-ing hoặc to V.", "I enjoy listening to music.", "Tôi thích nghe nhạc.", "I enjoy ___ to music. (listen)", "listening", "Hobbies"], ["Because / but / and", "Because + mệnh đề chỉ lý do; but chỉ tương phản; and bổ sung.", "I study English because I want to study abroad.", "Tôi học tiếng Anh vì muốn du học.", "I am tired, ___ I still study.", "but", "Studies"], ["Can / should / must", "Modal + V nguyên mẫu không to.", "You should exercise regularly.", "Bạn nên tập thể dục thường xuyên.", "You should ___ regularly. (exercise)", "exercise", "Health"], ["Present Perfect", "Have/has + V3; trải nghiệm hoặc liên hệ hiện tại.", "He has recently bought a new car.", "Anh ấy vừa mua xe mới.", "He has recently ___ a new car. (buy)", "bought", "Review"], ["Luyện kể về bản thân", "Nói 4 câu: giới thiệu, công việc, thói quen, lý do.", "I work during the day and study English at night.", "Tôi làm việc ban ngày và học tiếng Anh buổi tối.", "I work during the day ___ study at night.", "and", "Personal information"], ["Luyện viết đoạn ngắn", "Câu chủ đề + hai chi tiết + lý do.", "I love my house because it is quiet.", "Tôi yêu nhà mình vì nó yên tĩnh.", "I love my house ___ it is quiet.", "because", "My house"], ["Kiểm tra tổng hợp", "Tự nói và viết 5 câu, kiểm tra chủ ngữ, động từ và từ loại.", "She studies English every evening.", "Cô ấy học tiếng Anh mỗi tối.", "She ___ English every evening. (study)", "studies", "Final review"]];let day=0,tab=0;const tabs=['Ngữ pháp','Từ vựng','Nghe & chép','Speaking','Đọc & viết','Kiểm tra'];let saved={};try{saved=JSON.parse(localStorage.getItem('foundation30')||'{}')}catch(e){}function save(){try{localStorage.setItem('foundation30',JSON.stringify(saved))}catch(e){}}const $=x=>document.getElementById(x);function speak(t){if(!('speechSynthesis'in window)){alert('Trình duyệt không hỗ trợ đọc tiếng Anh.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}function norm(s){return s.toLowerCase().trim().replace(/[.!?]/g,'').replace(/\s+/g,' ')}function check(a){let ok=norm($('answer').value)===norm(a);$('feedback').textContent=ok?'Chính xác!':'Chưa khớp đáp án mẫu. Đáp án: '+a;$('feedback').className=ok?'ok':'bad';if(!ok){saved[day]={...saved[day],error:$('answer').value+' → '+a};save()}}function render(){let [title,rule,en,vi,q,a,topic]=data[day];$('bar').value=Object.values(saved).filter(x=>x.done).length;$('stat').textContent=$('bar').value+'/30 ngày hoàn thành';$('nav').innerHTML=data.map((r,i)=>`<button class="${i===day?'active':''}" onclick="day=${i};tab=0;render()">${saved[i]?.done?'✓':'○'} ${i+1}. ${r[0]}</button>`).join('');$('head').innerHTML=`<div class="tag">Ngày ${day+1} • ${topic}</div><h2>${title}</h2>`;$('tabs').innerHTML=tabs.map((t,i)=>`<button class="${i===tab?'active':''}" onclick="tab=${i};render()">${t}</button>`).join('');let ex=`<div class="example"><b>${en}</b><br>${vi}</div>`;let quiz=(prompt,ans)=>`<p>${prompt}</p><input id="answer" autocomplete="off" placeholder="Nhập câu trả lời"><button class="primary" id="check">Kiểm tra</button><p id="feedback"></p>`;let v=[`<h3>Hiểu quy tắc • 15 phút</h3><p>${rule}</p>${ex}<p>Đọc câu, xác định chủ ngữ, động từ và thành phần còn lại. Tự đặt 3 câu mới.</p>`,`<h3>Học từ trong ngữ cảnh • 10 phút</h3>${ex}<p>Từ trọng tâm: <b>${a}</b></p><p>Chép cụm chứa từ này, tra nghĩa nếu cần, rồi đặt 2 câu của riêng bạn.</p>${quiz(q,a)}`,`<h3>Chép chính tả • 15 phút</h3><p>Nghe 3 lần, không nhìn đáp án. Sau đó đọc đuổi 3 lần.</p><button id="listen">▶ Nghe câu tiếng Anh</button>${quiz('Gõ lại toàn bộ câu nghe được.',en)}<details><summary>Transcript và nghĩa</summary>${ex}</details>`,`<h3>Speaking • 15 phút</h3><p>Topic: ${topic}. Hãy nói 3–5 câu về chủ đề này: What do you do? When or where? Why?</p>${ex}<button id="listen">▶ Nghe câu mẫu</button><textarea id="practice" placeholder="Viết ý của bạn trước hoặc ghi lại câu vừa nói"></textarea><p class="muted">Tự kiểm: S + V, thì, phát âm. Không chấm phát âm tự động.</p>`,`<h3>Reading & Writing • 15 phút</h3><p>Dịch câu sau sang tiếng Anh:</p><p><b>${vi}</b></p>${quiz('Bản dịch của bạn',en)}<details><summary>Phân tích và câu mẫu</summary>${ex}<p>${rule}</p></details><textarea id="practice" placeholder="Viết thêm 3 câu liên quan"></textarea>`,`<h3>Kiểm tra • 10 phút</h3>${quiz(q,a)}<details><summary>Giải thích</summary>${rule}${ex}</details><p>Đọc lại câu không nhìn mẫu và tự đặt một câu mới.</p>`];$('content').innerHTML=v[tab];if($('listen'))$('listen').onclick=()=>speak(en);if($('check'))$('check').onclick=()=>check([2,4].includes(tab)?en:a);if($('practice')){$('practice').value=saved[day]?.['p'+tab]||'';$('practice').oninput=e=>{saved[day]={...saved[day],['p'+tab]:e.target.value};save()}}$('note').value=saved[day]?.note||'';$('note').oninput=e=>{saved[day]={...saved[day],note:e.target.value};save()};$('done').textContent=saved[day]?.done?'✓ Đã hoàn thành (bỏ đánh dấu)':'Hoàn thành ngày học';$('done').onclick=()=>{saved[day]={...saved[day],done:!saved[day]?.done};save();render()};$('next').onclick=()=>{day=Math.min(29,day+1);tab=0;render()}}render();</script></html>
